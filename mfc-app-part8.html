<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFC | Users & Reports</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-500:#6366f1;--brand-600:#4f46e5;--brand-700:#4338ca;
  --success-50:#ecfdf5;--success-500:#10b981;--success-600:#059669;--success-700:#047857;
  --warning-50:#fffbeb;--warning-500:#f59e0b;--warning-600:#d97706;
  --danger-50:#fef2f2;--danger-500:#ef4444;--danger-600:#dc2626;
  --info-50:#eff6ff;--info-500:#3b82f6;
  --purple-500:#8b5cf6;
  --bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--bg-elevated:#fff;
  --bg-overlay:rgba(15,23,42,.55);--bg-glass:rgba(255,255,255,.85);
  --text-primary:#0f172a;--text-secondary:#475569;--text-tertiary:#94a3b8;
  --border-subtle:#e2e8f0;--border-default:#cbd5e1;--border-strong:#94a3b8;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.07);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,.08);
  --shadow-xl:0 20px 25px -5px rgba(15,23,42,.10);
  --shadow-2xl:0 25px 50px -12px rgba(15,23,42,.25);
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --mono:'JetBrains Mono',monospace;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-hero:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#312e81 100%);
  --sidebar-w:260px;--topbar-h:68px;
}
[data-theme="dark"]{
  --bg-base:#0a0e1a;--bg-surface:#111827;--bg-subtle:#161e2e;--bg-elevated:#1a2233;
  --bg-overlay:rgba(0,0,0,.75);--bg-glass:rgba(17,24,39,.85);
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-tertiary:#64748b;
  --border-subtle:#1f2937;--border-default:#334155;--border-strong:#475569;
  --brand-50:rgba(99,102,241,.1);--brand-100:rgba(99,102,241,.15);
}
[data-theme="midnight"]{
  --bg-base:#0f1729;--bg-surface:#1a2540;--bg-subtle:#152036;--bg-elevated:#1f2b4d;
  --text-primary:#dbe4f0;--text-secondary:#8fa3c2;--text-tertiary:#6b7fa0;
  --border-subtle:#2a3a5c;--border-default:#3d5280;--brand-500:#4f93ff;
}
[data-theme="sepia"]{
  --bg-base:#f5efdc;--bg-surface:#fdfaf0;--bg-subtle:#f0e8d0;
  --text-primary:#3a2e1f;--text-secondary:#7a6b52;
  --border-subtle:#e0d5b8;--border-default:#c4b592;--brand-500:#a0661d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-base);color:var(--text-primary);font-family:'Inter','Cairo',sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
[dir="rtl"] body{font-family:'Cairo',sans-serif;}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit;}
input,select,textarea{font:inherit;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:9999px;}

@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.4)}50%{box-shadow:0 0 40px rgba(99,102,241,.7)}}
@keyframes spin{to{transform:rotate(360deg)}}

.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--topbar-h) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";}
.sidebar{grid-area:sidebar;background:var(--grad-hero);color:#fff;display:flex;
  flex-direction:column;z-index:150;overflow:hidden;border-inline-end:1px solid rgba(255,255,255,.06);}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,.06);min-height:var(--topbar-h);}
.sidebar-logo{width:40px;height:40px;border-radius:10px;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-weight:800;font-size:13px;flex:none;animation:glow 3s ease-in-out infinite;}
.sidebar-brand-text .kicker{font-size:9.5px;letter-spacing:2px;color:#94a3b8;font-weight:700;text-transform:uppercase;}
.sidebar-brand-text h1{font-size:15px;font-weight:800;margin-top:2px;}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-section-title{font-size:10px;color:#64748b;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;padding:8px 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:10px;color:#cbd5e1;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(99,102,241,.18);color:#fff;font-weight:600;}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;
  top:20%;bottom:20%;width:3px;background:#818cf8;border-radius:0 9999px 9999px 0;}
.nav-icon{width:20px;flex:none;text-align:center;font-size:16px;}

.topbar{grid-area:topbar;background:var(--bg-glass);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;
  gap:12px;padding:0 24px;position:sticky;top:0;z-index:100;}
.topbar-btn{width:38px;height:38px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;color:var(--text-secondary);
  transition:all .15s;flex:none;}
.topbar-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.topbar-actions{margin-inline-start:auto;display:flex;gap:8px;align-items:center;}
.user-chip{
  display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;border-radius:9999px;
  background:var(--bg-subtle);border:1px solid var(--border-subtle);
  cursor:pointer;transition:all .15s;
}
.user-chip:hover{border-color:var(--brand-500);}
.user-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:12px;color:#fff;flex:none;
}
.user-name{font-size:13px;font-weight:700;}
.user-role{font-size:10.5px;color:var(--text-tertiary);}

.main{grid-area:main;padding:24px;overflow-y:auto;overflow-x:hidden;}
.page-header{margin-bottom:24px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;}
.page-subtitle{font-size:14px;color:var(--text-secondary);margin-top:4px;}
.page-actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;
  transition:all .15s;white-space:nowrap;border:1.5px solid transparent;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3);}
.btn-primary:hover:not(:disabled){background:var(--brand-700);}
.btn-outline{background:var(--bg-surface);color:var(--text-primary);border-color:var(--border-default);}
.btn-outline:hover:not(:disabled){border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover:not(:disabled){background:var(--bg-subtle);color:var(--text-primary);}
.btn-danger{background:var(--danger-500);color:#fff;}
.btn-danger:hover:not(:disabled){background:var(--danger-600);}
.btn-sm{padding:6px 12px;font-size:12.5px;}

/* TABS */
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg-subtle);
  border-radius:12px;margin-bottom:24px;width:fit-content;
  border:1px solid var(--border-subtle);}
.tab{padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--text-secondary);cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:8px;}
.tab:hover{color:var(--text-primary);}
.tab.active{background:var(--bg-surface);color:var(--brand-600);
  box-shadow:var(--shadow-sm);}

/* CARDS */
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden;}
.card-header{padding:18px 22px;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;}
.card-title{font-size:15px;font-weight:800;flex:1;}
.card-body{padding:22px;}

/* USERS TABLE */
.users-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.users-table thead{background:var(--bg-subtle);}
.users-table th{padding:12px 14px;text-align:start;font-weight:700;
  font-size:10.5px;color:var(--text-tertiary);text-transform:uppercase;
  letter-spacing:.5px;border-bottom:1px solid var(--border-subtle);}
.users-table td{padding:14px;border-bottom:1px solid var(--border-subtle);}
.users-table tr:last-child td{border-bottom:none;}
.users-table tr:hover td{background:var(--bg-subtle);}
.user-cell{display:flex;align-items:center;gap:12px;}
.user-cell-avatar{width:36px;height:36px;border-radius:50%;
  background:var(--grad-brand);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:none;}
.user-cell-info .name{font-weight:700;font-size:13.5px;}
.user-cell-info .email{font-size:11.5px;color:var(--text-tertiary);margin-top:2px;}

.role-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:9999px;
  font-size:11.5px;font-weight:700;border:1px solid;
}
.role-badge.admin{color:#dc2626;border-color:rgba(239,68,68,.35);background:var(--danger-50);}
.role-badge.manager{color:#d97706;border-color:rgba(245,158,11,.35);background:var(--warning-50);}
.role-badge.viewer{color:#2563eb;border-color:rgba(59,130,246,.35);background:var(--info-50);}

.status-dot{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;
}
.status-dot::before{content:"";width:7px;height:7px;border-radius:50%;
  background:var(--success-500);}
.status-dot.offline::before{background:var(--text-tertiary);}

.action-btn{
  width:32px;height:32px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-secondary);transition:all .15s;
}
.action-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.action-btn.danger:hover{background:var(--danger-50);color:var(--danger-600);}

/* REPORT TEMPLATES */
.templates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;}
.template-card{
  padding:20px;border:1.5px solid var(--border-subtle);border-radius:14px;
  cursor:pointer;transition:all .2s;background:var(--bg-surface);
  position:relative;overflow:hidden;
}
.template-card:hover{border-color:var(--brand-500);
  transform:translateY(-4px);box-shadow:var(--shadow-lg);}
.template-icon{
  width:48px;height:48px;border-radius:12px;
  background:var(--brand-50);color:var(--brand-600);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:14px;
}
.template-name{font-size:14px;font-weight:800;margin-bottom:6px;}
.template-desc{font-size:12px;color:var(--text-secondary);line-height:1.5;}

/* REPORT BUILDER */
.builder-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;margin-bottom:20px;}
.form-field label{display:block;font-size:11.5px;font-weight:700;
  color:var(--text-tertiary);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px;}
.form-field input,.form-field select{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1.5px solid var(--border-subtle);background:var(--bg-subtle);
  font-size:13.5px;color:var(--text-primary);transition:all .15s;
}
.form-field input:focus,.form-field select:focus{
  outline:none;border-color:var(--brand-500);background:var(--bg-surface);
  box-shadow:0 0 0 4px rgba(99,102,241,.1);
}

.columns-picker{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;margin-bottom:20px;
}
.column-check{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--bg-subtle);border-radius:10px;
  cursor:pointer;transition:all .15s;font-size:13px;
  border:1.5px solid transparent;
}
.column-check:hover{border-color:var(--brand-500);}
.column-check input{cursor:pointer;}
.column-check.checked{background:var(--brand-50);border-color:var(--brand-500);color:var(--brand-700);font-weight:600;}

/* PREVIEW */
.report-preview{background:var(--bg-subtle);border-radius:12px;
  padding:20px;max-height:400px;overflow:auto;font-size:12px;}
.report-preview table{width:100%;border-collapse:collapse;}
.report-preview th{background:var(--bg-surface);padding:10px;
  text-align:start;font-weight:700;border-bottom:1px solid var(--border-subtle);
  font-size:11px;color:var(--text-tertiary);text-transform:uppercase;
  position:sticky;top:0;}
.report-preview td{padding:10px;border-bottom:1px solid var(--border-subtle);}

/* AUDIT LOG */
.audit-item{display:flex;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--border-subtle);}
.audit-item:last-child{border-bottom:none;}
.audit-icon{width:36px;height:36px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-subtle);font-size:15px;}
.audit-body{flex:1;min-width:0;}
.audit-text{font-size:13px;margin-bottom:4px;line-height:1.5;}
.audit-text b{color:var(--brand-600);}
.audit-meta{font-size:11px;color:var(--text-tertiary);font-family:var(--mono);}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:var(--bg-overlay);
  backdrop-filter:blur(6px);z-index:900;display:none;
  align-items:center;justify-content:center;padding:24px;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--bg-elevated);border-radius:20px;width:100%;
  max-width:600px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-2xl);animation:bounceIn .3s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;}
.modal-header{padding:20px 26px;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;}
.modal-title{font-size:17px;font-weight:800;flex:1;}
.modal-close{width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);transition:all .15s;}
.modal-close:hover{background:var(--bg-subtle);color:var(--text-primary);}
.modal-body{padding:22px 26px;overflow-y:auto;flex:1;}
.modal-footer{padding:16px 26px;border-top:1px solid var(--border-subtle);
  background:var(--bg-subtle);display:flex;gap:10px;justify-content:flex-end;}

/* TOAST */
.toast-container{position:fixed;bottom:24px;inset-inline-end:24px;z-index:1000;
  display:flex;flex-direction:column;gap:12px;max-width:400px;pointer-events:none;}
.toast{background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:10px;box-shadow:var(--shadow-xl);padding:16px;
  display:flex;gap:12px;border-inline-start:4px solid var(--brand-500);
  pointer-events:auto;animation:bounceIn .25s cubic-bezier(.34,1.56,.64,1);
  min-width:300px;}
.toast.success{border-inline-start-color:var(--success-500);}
.toast.error{border-inline-start-color:var(--danger-500);}
.toast.warning{border-inline-start-color:var(--warning-500);}
.toast.removing{animation:fadeOut .15s forwards;}
.toast-icon{width:24px;height:24px;border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  background:var(--bg-subtle);}
.toast.success .toast-icon{background:var(--success-50);color:var(--success-600);}
.toast.error .toast-icon{background:var(--danger-50);color:var(--danger-600);}
.toast-body{flex:1;}
.toast-title{font-size:13.5px;font-weight:700;}
.toast-msg{font-size:12.5px;color:var(--text-secondary);}

@media (max-width:768px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main";}
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sidebar-w);
    transform:translateX(-100%);transition:transform .25s;z-index:200;}
  [dir="rtl"] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0) !important;}
  .main{padding:16px;}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">MFC</div>
      <div class="sidebar-brand-text">
        <div class="kicker">MFC Company</div>
        <h1>Users & Reports</h1>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Management</div>
        <div class="nav-item active"><span class="nav-icon">👥</span><span>Users</span></div>
        <div class="nav-item"><span class="nav-icon">📊</span><span>Reports</span></div>
        <div class="nav-item"><span class="nav-icon">📜</span><span>Audit Log</span></div>
      </div>
    </nav>
  </aside>

  <header class="topbar">
    <button class="topbar-btn" id="mobileMenu" style="display:none;">☰</button>
    <div style="flex:1;"></div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="themeToggle"></button>
      <button class="topbar-btn" id="rtlToggle">🌐</button>
      <div class="user-chip" id="userChip">
        <div class="user-avatar" id="userAvatar">MFC</div>
        <div>
          <div class="user-name" id="userName">MFC Admin</div>
          <div class="user-role" id="userRoleDisplay">Administrator</div>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="pageTitle">Users & Reports</h1>
        <p class="page-subtitle" id="pageSubtitle">Manage users and generate reports</p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="users">👥 Users</div>
      <div class="tab" data-tab="reports">📊 Reports</div>
      <div class="tab" data-tab="audit">📜 Audit Log</div>
    </div>

    <div id="content"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  supabaseUrl: "https://bagbnoupsnsltflgwpic.supabase.co",
  supabaseKey: "sb_publishable_jyov6Yn5ulwm3fj3lIs9yw_IDZVhYMd"
};
const STORAGE = {
  theme: 'mfc_theme_v3',
  rtl: 'mfc_rtl_v3',
  users: 'mfc_users_v3',
  currentUser: 'mfc_current_user_v3',
  audit: 'mfc_audit_v3'
};

let db = null;
try {
  if (typeof supabase !== 'undefined' && supabase.createClient) {
    db = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    console.log('%c✅ Supabase ready', 'color:#10b981;font-weight:bold');
  }
} catch(e){ console.error('Supabase init failed:', e); }

/* =========================================================
   STATE
   ========================================================= */
const State = {
  currentTab: 'users',
  sites: [],
  users: [],
  audit: [],
  currentUser: null,
  reportConfig: {
    template: 'summary',
    columns: ['site_id', 'gov', 'team', 'states'],
    filters: { gov: '', team: '', status: '', dateFrom: '', dateTo: '' }

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, c=document)=> c.querySelector(s);
const $$ = (s, c=document)=> Array.from(c.querySelectorAll(s));

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtNum(n){
  if (n == null || isNaN(n)) return '0';
  return Number(n).toLocaleString();
}

function fmtMoney(n){
  if (n == null || isNaN(n)) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Number(n).toLocaleString();
}

function toast({type='info', title='', message='', duration=3500} = {}){
  const container = $('#toastContainer');
  const icons = { success:'✓', error:'!', warning:'⚠', info:'i' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type] || 'i'}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ''}
    </div>
  `;
  container.appendChild(el);
  if (duration > 0) setTimeout(()=>{
    el.classList.add('removing');
    setTimeout(()=> el.remove(), 200);
  }, duration);
}

function addAudit(action, target, details){

function initTheme(){
  const saved = localStorage.getItem(STORAGE.theme) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}
function toggleTheme(){
  const themes = ['light','dark','midnight','sepia'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = themes[(themes.indexOf(cur)+1) % themes.length];
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(STORAGE.theme, next);
  updateThemeIcon();
}
function updateThemeIcon(){
  const cur = document.documentElement.getAttribute('data-theme');
  $('#themeToggle').textContent = (cur === 'dark' || cur === 'midnight') ? '☀️' : '🌙';
}
function initRTL(){
  const saved = localStorage.getItem(STORAGE.rtl) === '1';
  document.documentElement.setAttribute('dir', saved ? 'rtl' : 'ltr');
}
function toggleRTL(){
  const rtl = document.documentElement.getAttribute('dir') !== 'rtl';
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  localStorage.setItem(STORAGE.rtl, rtl ? '1' : '0');
}

function getFilteredSites(){
  const gov = $('#filterGov')?.value || '';
  const team = $('#filterTeam')?.value || '';
  const status = $('#filterStatus')?.value || '';
  const dateFrom = $('#filterDateFrom')?.value || '';
  const dateTo = $('#filterDateTo')?.value || '';

  return State.sites.filter(s => {
    if (gov && s.gov !== gov) return false;
    if (team && s.team !== team) return false;
    if (status) {
      const st = (s.states || '').toLowerCase();
      if (status === 'done' && !st.includes('done')) return false;
      if (status === 'progress' && !st.includes('progress')) return false;
      if (status === 'pending' && (st.includes('done') || st.includes('progress'))) return false;
    }
    if (dateFrom && s.date_field && s.date_field < dateFrom) return false;
    if (dateTo && s.date_field && s.date_field > dateTo) return false;
    return true;
  });
}

function showPreview(){
  const sites = getFilteredSites();
  const cols = ALL_COLUMNS.filter(c => State.reportConfig.columns.includes(c.key));
  const preview = $('#reportPreview');
  const card = $('#previewCard');
  const count = $('#previewCount');

  card.style.display = 'block';

  if (!sites.length) {
    preview.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-tertiary);">No data matches filters</div>';
    count.textContent = '0 sites';
    return;
  }

  count.textContent = `${sites.length} sites · ${cols.length} columns`;

  preview.innerHTML = `
    <table>
      <thead>
        <tr>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr>
      </thead>
      <tbody>
        ${sites.slice(0, 20).map(s => `
          <tr>${cols.map(c => {
            let v = s[c.key];
            if (c.key.includes('amount') || c.key.includes('value') || c.key === 'pending_payment') {
              v = fmtNum(parseFloat(v) || 0);
            }
            return `<td>${escapeHtml(v || '—')}</td>`;
          }).join('')}</tr>
        `).join('')}
      </tbody>
    </table>
    ${sites.length > 20 ? `<div style="text-align:center;padding:12px;color:var(--text-tertiary);font-size:12px;">Showing 20 of ${sites.length} sites</div>` : ''}
  `;
}

function exportReport(format){
  const sites = getFilteredSites();
  const cols = ALL_COLUMNS.filter(c => State.reportConfig.columns.includes(c.key));

  if (!sites.length) {
    toast({type:'warning', title:'No data to export'});
    return;
  }

  if (format === 'csv') {
    const headers = cols.map(c => c.label);
    const rows = [headers.join(',')];
    sites.forEach(s => {
      rows.push(cols.map(c => {
        let v = String(s[c.key] ?? '').replace(/"/g, '""');
        if (v.includes(',') || v.includes('"')) v = `"${v}"`;
        return v;
      }).join(','));
    });
    const blob = new Blob(['\uFEFF' + rows.join('\n')], { type:'text/csv;charset=utf-8;' });
    downloadBlob(blob, `mfc_report_${new Date().toISOString().slice(0,10)}.csv`);
    addAudit('export_csv', `${sites.length} sites`);
    toast({type:'success', title:'CSV exported'});
  }
  else if (format === 'xlsx') {
    const rows = sites.map(s => {
      const obj = {};
      cols.forEach(c => {
        let v = s[c.key];
        if (c.key.includes('amount') || c.key.includes('value') || c.key === 'pending_payment') {
          v = parseFloat(v) || 0;
        }
        obj[c.label] = v || '';
      });
      return obj;
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header: cols.map(c => c.label) });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, `mfc_report_${new Date().toISOString().slice(0,10)}.xlsx`);
    addAudit('export_xlsx', `${sites.length} sites`);
    toast({type:'success', title:'Excel exported'});
  }
  else if (format === 'pdf') {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'mm', 'a4');

      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 297, 40, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(22);
      doc.setFont('helvetica', 'bold');
      doc.text('MFC Company', 15, 20);
      doc.setFontSize(14);
      doc.setFont('helvetica', 'normal');
      doc.text('Site Report', 15, 30);
      doc.setFontSize(9);
      doc.text(`Generated: ${new Date().toLocaleString()}  |  ${sites.length} sites`, 15, 36);

      const head = [cols.map(c => c.label)];
      const body = sites.map(s => cols.map(c => {
        let v = s[c.key];
        if (c.key.includes('amount') || c.key.includes('value') || c.key === 'pending_payment') {
          v = fmtNum(parseFloat(v) || 0);
        }
        return String(v || '—');
      }));

      doc.autoTable({
        startY: 46,
        head,
        body,
        styles: { fontSize: 7, cellPadding: 1.5 },
        headStyles: { fillColor: [99, 102, 241], textColor: [255,255,255], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [248, 250, 252] }
      });

      doc.save(`mfc_report_${new Date().toISOString().slice(0,10)}.pdf`);
      addAudit('export_pdf', `${sites.length} sites`);
      toast({type:'success', title:'PDF exported'});
    } catch(e){
      console.error(e);
      toast({type:'error', title:'PDF failed', message:e.message});
    }
  }
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================
   AUDIT LOG
   ========================================================= */
function renderAudit(){
  const html = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">📜 Audit Log (${State.audit.length})</div>
        <button class="btn btn-outline btn-sm" id="clearAuditBtn">🗑️ Clear</button>
      </div>
      <div class="card-body">
        ${State.audit.length === 0 ? `
          <div style="text-align:center;padding:40px;color:var(--text-tertiary);">
            <div style="font-size:42px;opacity:.4;margin-bottom:12px;">📜</div>
            <div>No activity recorded yet</div>
          </div>
        ` : State.audit.map(a => `
          <div class="audit-item">
            <div class="audit-icon">
              ${a.action.includes('user') ? '👤' :
                a.action.includes('delete') ? '🗑️' :
                a.action.includes('export') ? '📥' :
                a.action.includes('login') ? '🔑' : '📝'}
            </div>
            <div class="audit-body">
              <div class="audit-text">
                <b>${escapeHtml(a.user)}</b> · ${escapeHtml(a.action)}${a.target ? ` → <b>${escapeHtml(a.target)}</b>` : ''}${a.details ? ` (${escapeHtml(a.details)})` : ''}
              </div>
              <div class="audit-meta">${new Date(a.timestamp).toLocaleString()}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  $('#content').innerHTML = html;
  $('#pageActions').innerHTML = '';

  $('#clearAuditBtn').onclick = () => {
    if (!confirm('Clear all audit logs?')) return;
    State.audit = [];
    localStorage.setItem(STORAGE.audit, '[]');
    renderAudit();
    toast({type:'success', title:'Audit log cleared'});
  };
}

/* =========================================================
   TABS
   ========================================================= */
function switchTab(tab){
  State.currentTab = tab;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'users') renderUsers();
  else if (tab === 'reports') renderReports();
  else if (tab === 'audit') renderAudit();
}

/* =========================================================
   LOAD SITES
   ========================================================= */
async function loadSites(){
  if (!db) return;
  try {
    const { data, error } = await db.from('sites').select('*').order('id');
    if (error) throw error;
    State.sites = data || [];
    console.log(`%c📊 Loaded ${State.sites.length} sites`, 'color:#6366f1;font-weight:bold');
    if (State.currentTab === 'reports') renderReports();
  } catch(e){
    console.error('Load failed:', e);
  }
}

/* =========================================================
   INIT
   ========================================================= */
function bindEvents(){
  const mm = $('#mobileMenu');
  mm.onclick = () => $('#sidebar').classList.toggle('open');
  const upd = () => mm.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
  window.addEventListener('resize', upd);
  upd();

  $('#themeToggle').onclick = toggleTheme;
  $('#rtlToggle').onclick = toggleRTL;

  $$('.tab').forEach(t => {
    t.onclick = () => switchTab(t.dataset.tab);
  });

  $$('.nav-item').forEach(item => {
    item.onclick = () => {
      const text = item.textContent.toLowerCase();
      if (text.includes('user')) switchTab('users');
      else if (text.includes('report')) switchTab('reports');
      else if (text.includes('audit')) switchTab('audit');
      $$('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    };
  });

  $('#userChip').onclick = () => {
    const user = State.currentUser;
    if (!user) return;
    const html = `
      <div class="modal-header">
        <div class="modal-title">👤 ${escapeHtml(user.name)}</div>
        <button class="modal-close" id="profileClose">✕</button>
      </div>
      <div class="modal-body">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="width:80px;height:80px;border-radius:50%;background:var(--grad-brand);
            display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
            font-size:28px;font-weight:800;color:#fff;">
            ${user.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase()}
          </div>
          <div style="font-size:18px;font-weight:800;">${escapeHtml(user.name)}</div>
          <div style="color:var(--text-secondary);margin-top:4px;">${escapeHtml(user.email)}</div>
          <span class="role-badge ${ROLES[user.role]?.color}" style="margin-top:10px;">
            ${ROLES[user.role]?.label}
          </span>
        </div>
        <div style="border-top:1px solid var(--border-subtle);padding-top:16px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;">
            <div><div style="color:var(--text-tertiary);font-size:11px;margin-bottom:4px;">USERNAME</div><b>${escapeHtml(user.username)}</b></div>
            <div><div style="color:var(--text-tertiary);font-size:11px;margin-bottom:4px;">CREATED</div><b>${escapeHtml(user.created || '—')}</b></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="profileClose2">Close</button>
      </div>
    `;
    $('#modalContent').innerHTML = html;
    $('#modal').classList.add('show');
    $('#profileClose').onclick = closeModal;
    $('#profileClose2').onclick = closeModal;
  };

  $('#modal').onclick = (e) => {
    if (e.target.id === 'modal') closeModal();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === '/') { e.preventDefault(); toggleTheme(); }
  });
}

async function init(){
  console.log('%c🚀 MFC Users & Reports', 'color:#6366f1;font-weight:bold;font-size:14px');
  initTheme();
  initRTL();
  loadUsers();
  loadAudit();
  loadCurrentUser();
  bindEvents();
  addAudit('login', State.currentUser?.name || 'System');
  await loadSites();
  switchTab('users');
  console.log('%c✅ Ready — Phase 8 Complete', 'color:#10b981;font-weight:bold');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
