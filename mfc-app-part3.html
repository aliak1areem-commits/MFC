<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFC | Sites Pro</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ========== DESIGN SYSTEM ========== */
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-200:#c7d2fe;--brand-300:#a5b4fc;
  --brand-400:#818cf8;--brand-500:#6366f1;--brand-600:#4f46e5;--brand-700:#4338ca;--brand-800:#3730a3;
  --success-50:#ecfdf5;--success-100:#d1fae5;--success-500:#10b981;--success-600:#059669;--success-700:#047857;
  --warning-50:#fffbeb;--warning-100:#fef3c7;--warning-500:#f59e0b;--warning-600:#d97706;--warning-700:#b45309;
  --danger-50:#fef2f2;--danger-100:#fee2e2;--danger-500:#ef4444;--danger-600:#dc2626;--danger-700:#b91c1c;
  --info-50:#eff6ff;--info-100:#dbeafe;--info-500:#3b82f6;--info-600:#2563eb;
  --bg-base:#f8fafc;--bg-surface:#fff;--bg-elevated:#fff;--bg-subtle:#f1f5f9;
  --bg-overlay:rgba(15,23,42,.55);--bg-glass:rgba(255,255,255,.85);
  --text-primary:#0f172a;--text-secondary:#475569;--text-tertiary:#94a3b8;
  --border-subtle:#e2e8f0;--border-default:#cbd5e1;--border-strong:#94a3b8;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.07),0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.05);
  --shadow-xl:0 20px 25px -5px rgba(15,23,42,.10),0 8px 10px -6px rgba(15,23,42,.05);
  --shadow-2xl:0 25px 50px -12px rgba(15,23,42,.25);
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --font-sans:'Inter','Cairo',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-hero:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#312e81 100%);
  --sidebar-w:260px;--sidebar-w-collapsed:72px;--topbar-h:68px;
}
[data-theme="dark"]{
  --bg-base:#0a0e1a;--bg-surface:#111827;--bg-elevated:#1a2233;--bg-subtle:#161e2e;
  --bg-overlay:rgba(0,0,0,.75);--bg-glass:rgba(17,24,39,.85);
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-tertiary:#64748b;
  --border-subtle:#1f2937;--border-default:#334155;--border-strong:#475569;
  --brand-50:rgba(99,102,241,.1);--brand-100:rgba(99,102,241,.15);
}
[data-theme="midnight"]{
  --bg-base:#0f1729;--bg-surface:#1a2540;--bg-subtle:#152036;--bg-elevated:#1f2b4d;
  --text-primary:#dbe4f0;--text-secondary:#8fa3c2;--text-tertiary:#6b7fa0;
  --border-subtle:#2a3a5c;--border-default:#3d5280;--brand-500:#4f93ff;
}
[data-theme="sepia"]{
  --bg-base:#f5efdc;--bg-surface:#fdfaf0;--bg-subtle:#f0e8d0;
  --text-primary:#3a2e1f;--text-secondary:#7a6b52;
  --border-subtle:#e0d5b8;--border-default:#c4b592;--brand-500:#a0661d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
[dir="rtl"] body{font-family:'Cairo',sans-serif;}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit;}
input,select{font:inherit;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:var(--r-full);}

@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.4)}50%{box-shadow:0 0 40px rgba(99,102,241,.7)}}

/* APP SHELL */
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--topbar-h) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";
  transition:grid-template-columns var(--dur-base);}
.app.sidebar-collapsed{grid-template-columns:var(--sidebar-w-collapsed) 1fr;}

.sidebar{grid-area:sidebar;background:var(--grad-hero);color:#fff;display:flex;
  flex-direction:column;z-index:150;overflow:hidden;border-inline-end:1px solid rgba(255,255,255,.06);}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,.06);min-height:var(--topbar-h);}
.sidebar-logo{width:40px;height:40px;border-radius:10px;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
  font-weight:800;font-size:13px;flex:none;animation:glow 3s ease-in-out infinite;}
.sidebar-brand-text{overflow:hidden;white-space:nowrap;}
.sidebar-brand-text .kicker{font-size:9.5px;letter-spacing:2px;color:#94a3b8;font-weight:700;text-transform:uppercase;}
.sidebar-brand-text h1{font-size:15px;font-weight:800;margin-top:2px;}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-section-title{font-size:10px;color:#64748b;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;padding:8px 12px;white-space:nowrap;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:10px;color:#cbd5e1;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;margin-bottom:2px;white-space:nowrap;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(99,102,241,.18);color:#fff;font-weight:600;}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;
  top:20%;bottom:20%;width:3px;background:#818cf8;border-radius:0 9999px 9999px 0;}
.nav-icon{width:20px;flex:none;text-align:center;font-size:16px;}
.nav-text{flex:1;overflow:hidden;text-overflow:ellipsis;}
.app.sidebar-collapsed .sidebar-brand-text,
.app.sidebar-collapsed .nav-text,
.app.sidebar-collapsed .nav-section-title{display:none;}
.app.sidebar-collapsed .nav-item{justify-content:center;padding:10px;}

.topbar{grid-area:topbar;background:var(--bg-glass);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;
  gap:12px;padding:0 24px;position:sticky;top:0;z-index:100;}
.topbar-btn{width:38px;height:38px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;color:var(--text-secondary);
  transition:all .15s;flex:none;}
.topbar-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.topbar-btn.active{background:var(--brand-50);color:var(--brand-600);}
.topbar-search{flex:1;max-width:520px;position:relative;}
.topbar-search input{width:100%;padding:10px 16px 10px 42px;
  border-radius:10px;border:1.5px solid var(--border-subtle);
  background:var(--bg-subtle);font-size:13.5px;transition:all .15s;}
.topbar-search input:focus{outline:none;border-color:var(--brand-500);
  background:var(--bg-surface);box-shadow:0 0 0 4px rgba(99,102,241,.1);}
.topbar-search svg{position:absolute;inset-inline-start:14px;top:50%;
  transform:translateY(-50%);color:var(--text-tertiary);pointer-events:none;}
.topbar-actions{margin-inline-start:auto;display:flex;gap:8px;}
.topbar-divider{width:1px;height:24px;background:var(--border-subtle);margin:0 8px;}

.main{grid-area:main;padding:24px;overflow-y:auto;overflow-x:hidden;}
.page-header{margin-bottom:20px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;}
.page-subtitle{font-size:14px;color:var(--text-secondary);margin-top:2px;}
.page-actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;
  transition:all .15s;white-space:nowrap;border:1.5px solid transparent;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3);}
.btn-primary:hover{background:var(--brand-700);}
.btn-outline{background:var(--bg-surface);color:var(--text-primary);border-color:var(--border-default);}
.btn-outline:hover{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover{background:var(--bg-subtle);color:var(--text-primary);}
.btn-danger{background:var(--danger-500);color:#fff;}
.btn-danger:hover{background:var(--danger-600);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-icon{padding:8px;width:36px;height:36px;}

/* TOOLBAR */
.toolbar{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.toolbar-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.toolbar-row + .toolbar-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-subtle);}

/* SAVED VIEWS */
.views-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.view-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:9999px;background:var(--bg-surface);color:var(--text-secondary);
  font-size:12.5px;font-weight:600;border:1px solid var(--border-default);
  cursor:pointer;transition:all .15s;}
.view-chip:hover{border-color:var(--brand-500);color:var(--brand-600);}
.view-chip.active{background:var(--brand-600);color:#fff;border-color:var(--brand-600);}
.view-chip .x{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:10px;}
.view-chip .x:hover{background:var(--danger-500);}
.view-chip.add{border-style:dashed;color:var(--brand-600);}
.view-chip.add:hover{background:var(--brand-50);}

/* GROUP SELECTOR */
.group-selector{display:inline-flex;align-items:center;gap:6px;padding:4px;
  background:var(--bg-subtle);border-radius:10px;border:1px solid var(--border-subtle);}
.group-btn{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;
  color:var(--text-secondary);transition:all .15s;}
.group-btn:hover{color:var(--text-primary);}
.group-btn.active{background:var(--bg-surface);color:var(--brand-600);
  box-shadow:var(--shadow-sm);}

/* TABLE */
.table-card{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);}
.table-head-bar{display:flex;align-items:center;gap:12px;
  padding:12px 20px;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;}
.table-count{font-size:13px;font-weight:600;}
.table-count span{color:var(--text-tertiary);font-weight:500;}
.table-actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;}
.table-scroll{overflow:auto;max-height:calc(100vh - 380px);}

table.dt{border-collapse:separate;border-spacing:0;width:100%;
  font-size:13px;white-space:nowrap;}
table.dt thead th{position:sticky;top:0;z-index:5;background:var(--bg-subtle);
  color:var(--text-secondary);text-align:start;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;
  border-bottom:1px solid var(--border-subtle);cursor:pointer;user-select:none;}
table.dt thead th:hover{color:var(--text-primary);background:var(--border-subtle);}
table.dt thead th .sort-icon{font-size:9px;margin-inline-start:6px;color:var(--brand-600);}
table.dt thead th.frozen{position:sticky;z-index:6;box-shadow:2px 0 4px -2px rgba(0,0,0,.08);}
table.dt thead th.chk,table.dt tbody td.chk{width:40px;padding:8px;text-align:center;
  position:sticky;inset-inline-start:0;z-index:5;background:var(--bg-surface);}
table.dt thead th.chk{z-index:7;background:var(--bg-subtle);}
table.dt tbody td{padding:11px 14px;border-bottom:1px solid var(--border-subtle);
  vertical-align:middle;max-width:280px;overflow:hidden;text-overflow:ellipsis;
  background:var(--bg-surface);transition:background .15s;}
table.dt tbody td.frozen{position:sticky;z-index:4;
  box-shadow:2px 0 4px -2px rgba(0,0,0,.08);}
table.dt tbody tr:hover td{background:var(--brand-50) !important;}
[data-theme="dark"] table.dt tbody tr:hover td,
[data-theme="midnight"] table.dt tbody tr:hover td{background:rgba(99,102,241,.08) !important;}
table.dt tbody tr.selected td{background:var(--brand-50) !important;}
[data-theme="dark"] table.dt tbody tr.selected td,
[data-theme="midnight"] table.dt tbody tr.selected td{background:rgba(99,102,241,.12) !important;}
table.dt tbody tr.status-done td.chk{border-inline-start:3px solid var(--success-500);}
table.dt tbody tr.status-pending td.chk{border-inline-start:3px solid var(--warning-500);}
table.dt tbody tr.status-overdue td.chk{border-inline-start:3px solid var(--danger-500);}

.density-compact tbody td{padding:6px 10px;font-size:12.5px;}
.density-comfortable tbody td{padding:16px 14px;}

/* GROUP HEADER */
.group-header td{background:var(--brand-50) !important;padding:12px 14px !important;
  font-weight:800 !important;font-size:12.5px !important;
  color:var(--brand-700) !important;cursor:pointer;text-transform:uppercase;
  letter-spacing:.5px;border-top:2px solid var(--brand-100) !important;}
.group-header .group-toggle{display:flex;align-items:center;gap:10px;width:100%;}
.group-header .arrow{transition:transform .15s;font-size:10px;}
.group-header.collapsed .arrow{transform:rotate(-90deg);}
.group-header .count{margin-inline-start:auto;font-family:var(--font-mono);
  font-size:11px;padding:2px 8px;border-radius:9999px;
  background:var(--brand-100);color:var(--brand-800);}

/* CELLS */
.cell-id{font-family:var(--font-mono);font-weight:700;color:var(--brand-600);font-size:13px;cursor:pointer;}
.cell-id:hover{text-decoration:underline;}
.cell-num{font-family:var(--font-mono);text-align:center;}
.cell-money{font-family:var(--font-mono);text-align:end;font-weight:600;}
.cell-money.neg{color:var(--danger-600);}
.cell-money.pos{color:var(--success-600);}
.cell-edit:focus{outline:2px solid var(--brand-500);outline-offset:-2px;
  background:var(--bg-surface);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;
  border-radius:9999px;font-size:11.5px;font-weight:600;border:1px solid;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-green{color:var(--success-700);border-color:rgba(16,185,129,.35);background:var(--success-50);}
.badge-red{color:var(--danger-700);border-color:rgba(239,68,68,.35);background:var(--danger-50);}
.badge-amber{color:var(--warning-600);border-color:rgba(245,158,11,.35);background:var(--warning-50);}
.badge-gray{color:var(--text-secondary);border-color:var(--border-default);background:var(--bg-subtle);}

/* CHECKBOX */
.chkbox{width:16px;height:16px;border:1.5px solid var(--border-default);
  border-radius:4px;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;background:var(--bg-surface);transition:all .15s;flex:none;}
.chkbox.checked{background:var(--brand-600);border-color:var(--brand-600);color:#fff;}
.chkbox.checked::after{content:"";width:4px;height:8px;border:solid #fff;
  border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.chkbox.indet{background:var(--brand-500);border-color:var(--brand-500);}
.chkbox.indet::after{content:"";width:8px;height:2px;background:#fff;}

/* BULK BAR */
.bulk-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:14px;box-shadow:var(--shadow-xl);padding:12px 20px;
  display:flex;align-items:center;gap:16px;z-index:150;
  transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s;
  pointer-events:none;opacity:0;}
.bulk-bar.show{transform:translateX(-50%) translateY(0);
  pointer-events:auto;opacity:1;}
.bulk-bar .count{font-weight:700;font-size:14px;color:var(--brand-600);
  padding-inline-end:16px;border-inline-end:1px solid var(--border-subtle);}
.bulk-actions{display:flex;gap:8px;}

/* DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:var(--bg-overlay);
  backdrop-filter:blur(4px);z-index:800;opacity:0;pointer-events:none;
  transition:opacity .25s;}
.drawer-backdrop.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100vw);
  background:var(--bg-elevated);z-index:801;box-shadow:var(--shadow-2xl);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.16,1,.3,1);}
[dir="rtl"] .drawer{transform:translateX(-100%);}
.drawer.open{transform:translateX(0) !important;}
.drawer-header{padding:20px 24px;border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:12px;}
.drawer-title{flex:1;font-size:16px;font-weight:800;}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px;}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.kv{padding:12px 14px;background:var(--bg-subtle);border-radius:10px;}
.kv .k{font-size:10.5px;color:var(--text-tertiary);text-transform:uppercase;
  font-weight:700;letter-spacing:.5px;margin-bottom:4px;}
.kv .v{font-size:13.5px;font-weight:600;}
.section-title{font-size:11px;font-weight:800;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border-subtle);}

/* COLUMN CHOOSER */
.col-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;
  min-width:280px;max-height:400px;overflow-y:auto;
  background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:12px;box-shadow:var(--shadow-xl);padding:12px;
  z-index:200;display:none;}
.col-menu.show{display:block;}
.col-item{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:8px;cursor:pointer;font-size:13px;transition:background .15s;}
.col-item:hover{background:var(--bg-subtle);}

/* TOAST */
.toast-container{position:fixed;bottom:24px;inset-inline-end:24px;z-index:1000;
  display:flex;flex-direction:column;gap:12px;max-width:400px;pointer-events:none;}
.toast{background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:10px;box-shadow:var(--shadow-xl);padding:16px;
  display:flex;gap:12px;border-inline-start:4px solid var(--brand-500);
  pointer-events:auto;animation:bounceIn .25s cubic-bezier(.34,1.56,.64,1);
  min-width:300px;}
.toast.success{border-inline-start-color:var(--success-500);}
.toast.error{border-inline-start-color:var(--danger-500);}
.toast.warning{border-inline-start-color:var(--warning-500);}
.toast.removing{animation:fadeOut .15s forwards;}
.toast-icon{width:24px;height:24px;border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  background:var(--bg-subtle);}
.toast.success .toast-icon{background:var(--success-50);color:var(--success-600);}
.toast.error .toast-icon{background:var(--danger-50);color:var(--danger-600);}
.toast-body{flex:1;min-width:0;}
.toast-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.toast-msg{font-size:12.5px;color:var(--text-secondary);}

/* EMPTY */
.empty-state{padding:60px 24px;text-align:center;}
.empty-icon{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;
  background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;
  font-size:32px;}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.empty-desc{font-size:13.5px;color:var(--text-secondary);max-width:400px;margin:0 auto 20px;}

/* MENU */
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;min-width:220px;
  background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:12px;box-shadow:var(--shadow-xl);padding:6px;
  z-index:200;display:none;}
.menu.show{display:block;}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:8px;font-size:13px;cursor:pointer;width:100%;text-align:start;}
.menu-item:hover{background:var(--bg-subtle);}
.menu-item.danger{color:var(--danger-600);}
.menu-item.danger:hover{background:var(--danger-50);}
.menu-divider{height:1px;background:var(--border-subtle);margin:4px 8px;}

/* EXPORT MENU */
.relative{position:relative;}

/* MOBILE */
@media (max-width:960px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main";}
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sidebar-w);
    transform:translateX(-100%);transition:transform .25s;z-index:200;}
  [dir="rtl"] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0) !important;}
  .topbar-search{display:none;}
  .main{padding:16px;}
  .kv-grid{grid-template-columns:1fr;}
  .table-scroll{max-height:calc(100vh - 320px);}
  table.dt thead{display:none;}
  table.dt tbody tr{display:block;margin-bottom:12px;border:1px solid var(--border-subtle);
    border-radius:12px;padding:12px;background:var(--bg-surface);}
  table.dt tbody td{display:flex;justify-content:space-between;border:none;
    padding:6px 0;max-width:none;text-align:end;gap:12px;background:transparent !important;}
  table.dt tbody td::before{content:attr(data-label);font-weight:700;
    font-size:11px;color:var(--text-tertiary);text-transform:uppercase;text-align:start;flex:none;}
  table.dt tbody td.chk{position:static;}
  table.dt tbody td.frozen{position:static;box-shadow:none;}
  .bulk-bar{left:16px;right:16px;transform:translateX(0) translateY(80px);}
  .bulk-bar.show{transform:translateX(0) translateY(0);}
}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- SIDEBAR -->

    <div class="sidebar-brand">

  <!-- TOPBAR -->

      <input type="text" placeholder="Search: gov:basra team:ali status:done" id="searchInput">

      </button>

    <!-- TABLE -->

<!-- BULK BAR -->

  <div class="count" id="bulkCount">0 selected</div>

<!-- DRAWER -->

<!-- TOASTS -->

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  supabaseUrl: "https://bagbnoupsnsltflgwpic.supabase.co",
  supabaseKey: "sb_publishable_jyov6Yn5ulwm3fj3lIs9yw_IDZVhYMd"
};

const STORAGE = {
  theme: 'mfc_theme_v3',
  rtl: 'mfc_rtl_v3',
  columns: 'mfc_columns_v3',
  views: 'mfc_views_v3',
  density: 'mfc_density_v3'
};

/* =========================================================
   SUPABASE
   ========================================================= */
let db = null;
try {
  if (typeof supabase !== 'undefined' && supabase.createClient) {
    db = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    console.log('%c✅ Supabase ready', 'color:#10b981;font-weight:bold');
  }
} catch(e){ console.error('Supabase init failed:', e); }

/* =========================================================
   COLUMNS DEFINITION
   ========================================================= */
const ALL_COLUMNS = [
  { key:'site_id', label:'Site ID', type:'id', width:130, default:true, frozen:true },
  { key:'gov', label:'Governorate', type:'text', width:120, default:true, frozen:true },
  { key:'team', label:'Team', type:'text', width:120, default:true },
  { key:'states', label:'Status', type:'badge', width:110, default:true },
  { key:'flm_feedback', label:'FLM', type:'badge', width:100, default:true },
  { key:'main_scope', label:'Scope', type:'text', width:140, default:true },
  { key:'date_field', label:'Date', type:'text', width:110, default:true },
  { key:'amount_to_subcon', label:'Subcon', type:'money', width:120, default:true },
  { key:'amount_paid', label:'Paid', type:'money', width:120, default:true },
  { key:'nokia_amount', label:'Nokia', type:'money', width:120, default:true },
  { key:'payment_status', label:'Payment', type:'badge', width:110, default:true },
  { key:'po', label:'PO', type:'text', width:100, default:false },
  { key:'po2', label:'PO2', type:'text', width:100, default:false },
  { key:'pending_payment', label:'Pending', type:'money', width:110, default:false },
  { key:'smr_number', label:'SMR #', type:'text', width:110, default:false },
  { key:'smr_value', label:'SMR Value', type:'money', width:110, default:false },
  { key:'contract_value', label:'Contract', type:'money', width:110, default:false },
  { key:'field_engineer', label:'Engineer', type:'text', width:130, default:false },
  { key:'subcontractor', label:'Subcontractor', type:'text', width:130, default:false },
  { key:'extra_scope', label:'Extra Scope', type:'text', width:140, default:false },
  { key:'nokia_comments', label:'Comments', type:'text', width:180, default:false },
  { key:'details_of_request', label:'Details', type:'text', width:180, default:false },
  { key:'lat', label:'LAT', type:'text', width:90, default:false },
  { key:'long', label:'LONG', type:'text', width:90, default:false },
  { key:'saif_tool', label:'Saif', type:'badge', width:90, default:false },
  { key:'dismantle', label:'Dismantle', type:'text', width:100, default:false },
  { key:'snags_1', label:'Snag 1', type:'text', width:140, default:false },
  { key:'snags_2', label:'Snag 2', type:'text', width:140, default:false },
  { key:'snags_3', label:'Snag 3', type:'text', width:140, default:false }
];

/* =========================================================
   STATE
   ========================================================= */
const State = {
  sites: [],
  filtered: [],
  selected: new Set(),
  sortKey: null,
  sortDir: 1,
  groupBy: '',
  collapsedGroups: new Set(),
  search: '',
  parsedFilters: {},
  visibleColumns: new Set(),
  density: 'normal',
  savedViews: [],
  currentView: 'all'
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, c=document)=> c.querySelector(s);
const $$ = (s, c=document)=> Array.from(c.querySelectorAll(s));

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtNum(n){
  if (n == null || isNaN(n)) return '0';
  return Number(n).toLocaleString();
}

function fmtMoney(n){
  if (n == null || isNaN(n)) return '—';
  return fmtNum(n);
}

function debounce(fn, ms=250){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), ms); };
}

/* =========================================================
   TOAST
   ========================================================= */
function toast({type='info', title='', message='', duration=3500} = {}){
  const container = $('#toastContainer');
  const icons = { success:'✓', error:'!', warning:'⚠', info:'i' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type] || 'i'}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ''}
    </div>
  `;
  container.appendChild(el);
  if (duration > 0) setTimeout(()=>{
    el.classList.add('removing');
    setTimeout(()=> el.remove(), 200);
  }, duration);
}

/* =========================================================
   THEME / RTL
   ========================================================= */
function initTheme(){
  const saved = localStorage.getItem(STORAGE.theme) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}
function toggleTheme(){
  const themes = ['light','dark','midnight','sepia'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = themes[(themes.indexOf(cur)+1) % themes.length];
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(STORAGE.theme, next);
  updateThemeIcon();
}
function updateThemeIcon(){
  const btn = $('#themeToggle');
  if (!btn) return;
  const cur = document.documentElement.getAttribute('data-theme');
  btn.innerHTML = (cur === 'dark' || cur === 'midnight')
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
}
function initRTL(){
  const saved = localStorage.getItem(STORAGE.rtl) === '1';
  document.documentElement.setAttribute('dir', saved ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', saved ? 'ar' : 'en');
}
function toggleRTL(){
  const rtl = document.documentElement.getAttribute('dir') !== 'rtl';
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', rtl ? 'ar' : 'en');
  localStorage.setItem(STORAGE.rtl, rtl ? '1' : '0');
}

/* =========================================================
   COLUMNS PERSISTENCE
   ========================================================= */
function loadColumns(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE.columns) || 'null');
    if (saved && Array.isArray(saved)) {
      State.visibleColumns = new Set(saved);
    } else {
      State.visibleColumns = new Set(ALL_COLUMNS.filter(c => c.default).map(c => c.key));
    }
  } catch(e){
    State.visibleColumns = new Set(ALL_COLUMNS.filter(c => c.default).map(c => c.key));
  }
}
function saveColumns(){
  localStorage.setItem(STORAGE.columns, JSON.stringify([...State.visibleColumns]));
}

/* =========================================================
   DENSITY
   ========================================================= */
function loadDensity(){
  State.density = localStorage.getItem(STORAGE.density) || 'normal';
  const table = $('#dataTable');
  if (table) table.className = 'dt density-' + State.density;
}
function setDensity(d){
  State.density = d;
  localStorage.setItem(STORAGE.density, d);
  const table = $('#dataTable');
  if (table) table.className = 'dt density-' + d;
}

/* =========================================================
   SAVED VIEWS
   ========================================================= */
function loadSavedViews(){
  try {
    State.savedViews = JSON.parse(localStorage.getItem(STORAGE.views) || '[]');
  } catch(e){ State.savedViews = []; }
  if (!State.savedViews.length) {
    State.savedViews = [
      { id:'all', name:'All Sites', icon:'📋', filters:{} },
      { id:'done', name:'Completed', icon:'✅', filters:{ states:'Done' } },
      { id:'pending', name:'Pending', icon:'⏳', filters:{ states:'Pending' } },
      { id:'unpaid', name:'Unpaid', icon:'💸', filters:{ payment_status:'Unpaid' } }
    ];
  }
}
function saveSavedViews(){
  localStorage.setItem(STORAGE.views, JSON.stringify(State.savedViews));
}

/* =========================================================
   GROUP BY
   ========================================================= */
function setGroupBy(key){
  State.groupBy = key;
  State.collapsedGroups.clear();
  $$('.group-btn').forEach(b => b.classList.toggle('active', b.dataset.group === key));
  renderTable();
}

/* =========================================================
   SEARCH PARSER
   ========================================================= */
function parseSearch(query){
  const filters = {};
  let text = query.trim();
  const tokens = text.match(/(\w+):([^\s]+)/g) || [];
  tokens.forEach(t => {
    const [key, ...rest] = t.split(':');
    const val = rest.join(':');
    if (['gov','team','states','payment_status','site_id','flm_feedback','smr_number'].includes(key)){
      filters[key] = val;
      text = text.replace(t, '').trim();
    }
  });
  return { text, filters };
}

/* =========================================================
   FILTER & SORT
   ========================================================= */
function applyFilters(){
  const { text, filters } = parseSearch(State.search);
  State.parsedFilters = filters;
  const q = text.toLowerCase();

  State.filtered = State.sites.filter(row => {
    if (q) {
      const hay = ALL_COLUMNS.map(c => row[c.key] || '').join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    for (const [k, v] of Object.entries(filters)) {
      if (String(row[k] || '').toLowerCase() !== v.toLowerCase()) return false;
    }
    // Apply saved view filters
    const view = State.savedViews.find(v => v.id === State.currentView);
    if (view && view.filters) {
      for (const [k, v] of Object.entries(view.filters)) {
        if (String(row[k] || '').toLowerCase() !== String(v).toLowerCase()) return false;
      }
    }
    return true;
  });

  if (State.sortKey) {
    State.filtered.sort((a, b) => {
      let va = a[State.sortKey] || '';
      let vb = b[State.sortKey] || '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb) && va !== '' && vb !== '') {
        return (na - nb) * State.sortDir;
      }
      return String(va).localeCompare(String(vb)) * State.sortDir;
    });
  }
}

/* =========================================================
   CELL RENDERER
   ========================================================= */
function badgeClass(key, val){
  const v = String(val || '').toLowerCase();
  if (!v) return 'badge-gray';
  if (v.includes('reject') || v.includes('overdue') || v.includes('unpaid')) return 'badge-red';
  if (v.includes('accept') || v === 'done' || v === 'paid' || v === 'approved' || v === 'yes') return 'badge-green';
  if (v.includes('partial') || v.includes('progress') || v.includes('pending') || v.includes('submitted')) return 'badge-amber';
  return 'badge-gray';
}

function renderCell(col, row, isFrozen){
  const val = row[col.key];
  const cls = isFrozen ? 'frozen' : '';

  if (col.type === 'id') {
    return `<td class="chk-follow ${cls}" data-label="${col.label}">
      <span class="cell-id" data-site-id="${escapeHtml(val)}">${escapeHtml(val || '—')}</span>
    </td>`;
  }
  if (col.type === 'badge') {
    return `<td class="${cls}" data-label="${col.label}">
      ${val ? `<span class="badge ${badgeClass(col.key, val)}">${escapeHtml(val)}</span>` : '—'}
    </td>`;
  }
  if (col.type === 'money') {
    const n = parseFloat(val) || 0;
    return `<td class="cell-money ${cls}" data-label="${col.label}">${n ? fmtMoney(n) : '—'}</td>`;
  }
  return `<td class="cell-edit ${cls}" contenteditable="true" data-col="${col.key}" data-label="${col.label}">${escapeHtml(val || '')}</td>`;
}

/* =========================================================
   RENDER TABLE
   ========================================================= */
function renderTable(){
  const thead = $('#thead');
  const tbody = $('#tbody');
  const visibleCols = ALL_COLUMNS.filter(c => State.visibleColumns.has(c.key));

  // Header
  thead.innerHTML = `
    <th class="chk">
      <div class="chkbox" id="selectAll"></div>
    </th>
    ${visibleCols.map(c => {
      const isFrozen = c.frozen;
      const sortIcon = State.sortKey === c.key
        ? `<span class="sort-icon">${State.sortDir === 1 ? '▲' : '▼'}</span>` : '';
      return `<th class="${isFrozen ? 'frozen' : ''}" data-key="${c.key}" data-label="${c.label}">
        ${c.label}${sortIcon}
      </th>`;
    }).join('')}
  `;

  // Body
  let html = '';
  if (!State.filtered.length) {
    $('#emptyState').style.display = 'block';
    tbody.innerHTML = '';
  } else {
    $('#emptyState').style.display = 'none';

    if (State.groupBy) {
      const groups = {};
      State.filtered.forEach(row => {
        const key = row[State.groupBy] || '(Empty)';
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
      });
      const sortedKeys = Object.keys(groups).sort();
      sortedKeys.forEach(gKey => {
        const isCollapsed = State.collapsedGroups.has(gKey);
        html += `<tr class="group-header ${isCollapsed ? 'collapsed' : ''}" data-group="${escapeHtml(gKey)}">
          <td colspan="${visibleCols.length + 1}">
            <div class="group-toggle">
              <span class="arrow">▼</span>
              <span>${escapeHtml(gKey)}</span>
              <span class="count">${groups[gKey].length}</span>
            </div>
          </td>
        </tr>`;
        if (!isCollapsed) {
          groups[gKey].forEach(row => {
            html += renderRow(row, visibleCols);
          });
        }
      });
    } else {
      State.filtered.forEach(row => {
        html += renderRow(row, visibleCols);
      });
    }
    tbody.innerHTML = html;
  }

  // Update counts
  $('#countDisplay').textContent = State.filtered.length;
  $('#countSub').textContent = State.filtered.length !== State.sites.length
    ? `of ${State.sites.length} total`
    : 'total sites';
  $('#pageSubtitle').textContent = `${State.sites.length} total · ${State.selected.size} selected`;

  // Bind events
  bindTableEvents();
  updateBulkBar();
}

function renderRow(row, visibleCols){
  const isSelected = State.selected.has(row.id);
  const status = String(row.states || '').toLowerCase();
  const statusClass = status === 'done' ? 'status-done'
    : status.includes('progress') ? 'status-pending'
    : status.includes('overdue') ? 'status-overdue' : '';

  return `<tr class="${isSelected ? 'selected' : ''} ${statusClass}" data-id="${row.id}">
    <td class="chk">
      <div class="chkbox ${isSelected ? 'checked' : ''}" data-id="${row.id}"></div>
    </td>
    ${visibleCols.map(c => renderCell(c, row, c.frozen)).join('')}
  </tr>`;
}

/* =========================================================
   BIND TABLE EVENTS
   ========================================================= */
function bindTableEvents(){
  // Header sort
  $$('#thead th[data-key]').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.key;
      if (State.sortKey === key) State.sortDir *= -1;
      else { State.sortKey = key; State.sortDir = 1; }
      applyFilters();
      renderTable();
    };
  });

  // Select all
  const selectAll = $('#selectAll');
  if (selectAll) {
    const allSelected = State.filtered.length > 0 && State.filtered.every(r => State.selected.has(r.id));
    const someSelected = State.filtered.some(r => State.selected.has(r.id)) && !allSelected;
    selectAll.classList.toggle('checked', allSelected);
    selectAll.classList.toggle('indet', someSelected);
    selectAll.onclick = (e) => {
      e.stopPropagation();
      if (allSelected) {
        State.filtered.forEach(r => State.selected.delete(r.id));
      } else {
        State.filtered.forEach(r => State.selected.add(r.id));
      }
      renderTable();
    };
  }

  // Checkboxes
  $$('#tbody .chkbox[data-id]').forEach(cb => {
    cb.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(cb.dataset.id, 10);
      if (State.selected.has(id)) State.selected.delete(id);
      else State.selected.add(id);
      const row = cb.closest('tr');
      row.classList.toggle('selected', State.selected.has(id));
      cb.classList.toggle('checked', State.selected.has(id));
      updateBulkBar();
      $('#pageSubtitle').textContent = `${State.sites.length} total · ${State.selected.size} selected`;
    };
  });

  // Site ID click → Drawer
  $$('#tbody .cell-id').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const siteId = el.dataset.siteId;
      const site = State.sites.find(r => r.site_id === siteId);
      if (site) openSiteDrawer(site);
    };
  });

  // Group header collapse
  $$('.group-header').forEach(gh => {
    gh.onclick = () => {
      const key = gh.dataset.group;
      if (State.collapsedGroups.has(key)) State.collapsedGroups.delete(key);
      else State.collapsedGroups.add(key);
      renderTable();
    };
  });

  // Inline edit blur → save
  $$('#tbody .cell-edit').forEach(cell => {
    cell.addEventListener('blur', async () => {
      const id = parseInt(cell.closest('tr').dataset.id, 10);
      const col = cell.dataset.col;
      const newVal = cell.textContent.trim();
      const site = State.sites.find(r => r.id === id);
      if (!site || site[col] === newVal) return;
      const oldVal = site[col];
      site[col] = newVal;
      try {
        if (db) {
          const update = {};
          update[col] = newVal;
          const { error } = await db.from('sites').update(update).eq('id', id);
          if (error) throw error;
        }
        toast({type:'success', title:'Saved', message:`${col}: ${newVal}`, duration:2000});
      } catch(e){
        site[col] = oldVal;
        cell.textContent = oldVal;
        toast({type:'error', title:'Save failed', message:e.message});
      }
    });
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); cell.blur(); }
      if (e.key === 'Escape') { cell.textContent = cell.dataset.original || ''; cell.blur(); }
    });
    cell.dataset.original = cell.textContent;
  });
}

/* =========================================================
   BULK BAR
   ========================================================= */
function updateBulkBar(){
  const bar = $('#bulkBar');
  const count = State.selected.size;
  if (count > 0) {
    bar.classList.add('show');
    $('#bulkCount').textContent = `${count} selected`;
  } else {
    bar.classList.remove('show');
  }
}

/* =========================================================
   COLUMN CHOOSER
   ========================================================= */
function renderColumnChooser(){
  const menu = $('#colMenu');
  menu.innerHTML = ALL_COLUMNS.map(c => `
    <label class="col-item">
      <input type="checkbox" ${State.visibleColumns.has(c.key) ? 'checked' : ''} data-col="${c.key}">
      <span>${c.label}</span>
    </label>
  `).join('');
  menu.querySelectorAll('input').forEach(cb => {
    cb.onchange = () => {
      if (cb.checked) State.visibleColumns.add(cb.dataset.col);
      else State.visibleColumns.delete(cb.dataset.col);
      saveColumns();
      renderTable();
    };
  });
}

/* =========================================================
   SAVED VIEWS
   ========================================================= */
function renderViewsBar(){
  const bar = $('#viewsBar');
  bar.innerHTML = State.savedViews.map(v => `
    <div class="view-chip ${State.currentView === v.id ? 'active' : ''}" data-view="${v.id}">
      <span>${v.icon || '📋'}</span>
      <span>${escapeHtml(v.name)}</span>
      ${v.id !== 'all' ? `<span class="x" data-remove="${v.id}">✕</span>` : ''}
    </div>
  `).join('') + `
    <div class="view-chip add" id="addViewBtn">+ Save Current</div>
  `;
  bar.querySelectorAll('.view-chip[data-view]').forEach(chip => {
    chip.onclick = (e) => {
      if (e.target.classList.contains('x')) return;
      State.currentView = chip.dataset.view;
      applyFilters();
      renderTable();
      renderViewsBar();
    };
  });
  bar.querySelectorAll('.x').forEach(x => {
    x.onclick = (e) => {
      e.stopPropagation();
      const id = x.dataset.remove;
      if (!confirm('Remove this view?')) return;
      State.savedViews = State.savedViews.filter(v => v.id !== id);
      saveSavedViews();
      if (State.currentView === id) State.currentView = 'all';
      renderViewsBar();
      renderTable();
    };
  });
  $('#addViewBtn').onclick = () => {
    const name = prompt('View name:');
    if (!name) return;
    const { filters } = parseSearch(State.search);
    State.savedViews.push({
      id: 'view_' + Date.now(),
      name,
      icon: '⭐',
      filters: { ...filters, ...State.parsedFilters }
    });
    saveSavedViews();
    renderViewsBar();
    toast({type:'success', title:'View saved'});
  };
}

   DRAWER

      </div>
      <div class="drawer-body">
        <div class="section-title">Basic Info</div>

function closeDrawer(){
  const backdrop = $('#drawerBackdrop');
  const drawer = backdrop.querySelector('.drawer');
  if (drawer) drawer.classList.remove('open');
  backdrop.classList.remove('show');
  setTimeout(() => backdrop.innerHTML = '', 300);
}

/* =========================================================
   EXPORT
   ========================================================= */
function exportData(format, rows = null){
  const data = rows || State.filtered;
  const cols = ALL_COLUMNS.filter(c => State.visibleColumns.has(c.key));

  if (format === 'xlsx') {
    const xlsxData = data.map(row => {
      const obj = {};
      cols.forEach(c => obj[c.label] = row[c.key] || '');
      return obj;
    });
    const ws = XLSX.utils.json_to_sheet(xlsxData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sites');
    XLSX.writeFile(wb, `mfc_sites_${new Date().toISOString().slice(0,10)}.xlsx`);
  }
  else if (format === 'csv') {
    const headers = cols.map(c => c.label);
    const csvRows = [headers.join(',')];
    data.forEach(row => {
      csvRows.push(cols.map(c => {
        let v = String(row[c.key] ?? '').replace(/"/g, '""');
        if (v.includes(',') || v.includes('"') || v.includes('\n')) v = `"${v}"`;
        return v;
      }).join(','));
    });
    downloadFile(`mfc_sites_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;', '\uFEFF' + csvRows.join('\n'));
  }
  else if (format === 'json') {
    const json = JSON.stringify(data, null, 2);
    downloadFile(`mfc_sites_${new Date().toISOString().slice(0,10)}.json`, 'application/json', json);
  }
  toast({type:'success', title:`Exported ${data.length} sites as ${format.toUpperCase()}`});
}

function downloadFile(name, mime, content){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================
   BULK ACTIONS
   ========================================================= */
async function bulkDelete(){
  const ids = [...State.selected];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} sites? This cannot be undone.`)) return;
  try {
    if (db) {
      const { error } = await db.from('sites').delete().in('id', ids);
      if (error) throw error;
    }
    State.sites = State.sites.filter(r => !ids.includes(r.id));
    State.selected.clear();
    applyFilters();
    renderTable();
    toast({type:'success', title:`Deleted ${ids.length} sites`});
  } catch(e){
    toast({type:'error', title:'Delete failed', message:e.message});
  }
}

async function bulkSetField(field, value){
  const ids = [...State.selected];
  if (!ids.length || !value) return;
  try {
    if (db) {
      const update = {};
      update[field] = value;
      const { error } = await db.from('sites').update(update).in('id', ids);
      if (error) throw error;
    }
    State.sites.forEach(r => {
      if (ids.includes(r.id)) r[field] = value;
    });
    applyFilters();
    renderTable();
    toast({type:'success', title:`Updated ${ids.length} sites`});
  } catch(e){
    toast({type:'error', title:'Update failed', message:e.message});
  }
}

/* =========================================================
   LOAD DATA
   ========================================================= */
async function loadSites(){
  if (!db) {
    toast({type:'warning', title:'Offline mode', message:'Supabase not configured'});
    State.sites = [];
    applyFilters();
    renderTable();
    return;
  }
  try {
    const { data, error } = await db.from('sites').select('*').order('id');
    if (error) throw error;
    State.sites = data || [];
    console.log(`%c📊 Loaded ${State.sites.length} sites`, 'color:#6366f1;font-weight:bold');
    applyFilters();
    renderTable();
  } catch(e){
    console.error('Load failed:', e);
    toast({type:'error', title:'Load failed', message:e.message});
  }
}

/* =========================================================
   INIT
   ========================================================= */
function bindEvents(){
  // Mobile sidebar
  const mm = $('#mobileMenu');
  mm.onclick = () => $('#sidebar').classList.toggle('open');
  const upd = () => mm.style.display = window.innerWidth <= 960 ? 'flex' : 'none';
  window.addEventListener('resize', upd);
  upd();

  // Theme
  $('#themeToggle').onclick = toggleTheme;
  $('#rtlToggle').onclick = toggleRTL;

  // Refresh
  $('#refreshBtn').onclick = () => {
    toast({type:'info', title:'Refreshing...', duration:1500});
    loadSites();
  };

  // Add site
  $('#addSiteBtn').onclick = async () => {
    if (!db) return toast({type:'warning', title:'Offline'});
    try {
      const { data, error } = await db.from('sites').insert([{ site_id:'NEW' + Date.now().toString().slice(-4) }]).select().single();
      if (error) throw error;
      State.sites.push(data);
      applyFilters();
      renderTable();
      toast({type:'success', title:'Site created'});
    } catch(e){
      toast({type:'error', title:'Create failed', message:e.message});
    }
  };

  // Search
  $('#searchInput').addEventListener('input', debounce((e) => {
    State.search = e.target.value;
    applyFilters();
    renderTable();
    $('#clearFiltersBtn').style.display = State.search ? 'inline-flex' : 'none';
  }, 200));

  // Clear filters
  $('#clearFiltersBtn').onclick = () => {
    $('#searchInput').value = '';
    State.search = '';
    State.currentView = 'all';
    applyFilters();
    renderTable();
    renderViewsBar();
    $('#clearFiltersBtn').style.display = 'none';
  };

  // Group buttons
  $$('.group-btn').forEach(btn => {
    btn.onclick = () => setGroupBy(btn.dataset.group);
  });

  // Column chooser
  $('#columnsBtn').onclick = (e) => {
    e.stopPropagation();
    $('#colMenu').classList.toggle('show');
  };
  document.addEventListener('click', () => {
    $('#colMenu').classList.remove('show');
    $('#exportMenu').classList.remove('show');
    $('#moreMenu').classList.remove('show');
  });
  $('#colMenu').onclick = (e) => e.stopPropagation();

  // Export menu
  $('#exportBtn').onclick = (e) => {
    e.stopPropagation();
    $('#exportMenu').classList.toggle('show');
  };
  $('#exportMenu').onclick = (e) => e.stopPropagation();
  $$('#exportMenu .menu-item').forEach(b => {
    b.onclick = () => {
      exportData(b.dataset.export);
      $('#exportMenu').classList.remove('show');
    };
  });

  // More menu
  $('#moreBtn').onclick = (e) => {
    e.stopPropagation();
    $('#moreMenu').classList.toggle('show');
  };
  $('#moreMenu').onclick = (e) => e.stopPropagation();
  $$('#moreMenu .menu-item').forEach(b => {
    b.onclick = () => {
      const act = b.dataset.action;
      if (act === 'saveView') { $('#addViewBtn')?.click(); }
      else if (act.startsWith('density-')) { setDensity(act.split('-')[1]); }
      else if (act === 'deleteAll') {
        if (confirm('Delete ALL sites? This cannot be undone!')) {
          State.sites = [];
          renderTable();
        }
      }
      $('#moreMenu').classList.remove('show');
    };
  });

  // Bulk actions
  $('#bulkExport').onclick = () => {
    const selected = State.sites.filter(r => State.selected.has(r.id));
    exportData('xlsx', selected);
  };
  $('#bulkDelete').onclick = bulkDelete;
  $('#bulkClear').onclick = () => {
    State.selected.clear();
    renderTable();
  };
  $('#bulkStatus').onclick = () => {
    const status = prompt('Enter status (Done / In Progress / Pending):');
    if (status) bulkSetField('states', status);
  };
  $('#bulkTeam').onclick = () => {
    const team = prompt('Enter team name:');
    if (team) bulkSetField('team', team);
  };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      e.preventDefault();
      $('#searchInput').focus();
    }
    if (e.key === 'Escape') {
      $('#colMenu').classList.remove('show');
      $('#exportMenu').classList.remove('show');
      $('#moreMenu').classList.remove('show');
      closeDrawer();
    }
  });
}

async function init(){
  console.log('%c🚀 MFC Sites Pro', 'color:#6366f1;font-weight:bold;font-size:14px');
  initTheme();
  initRTL();
  loadColumns();
  loadDensity();
  loadSavedViews();
  bindEvents();
  renderViewsBar();
  renderColumnChooser();
  await loadSites();
  console.log('%c✅ Ready — Phase 3 Complete', 'color:#10b981;font-weight:bold');
}

document.addEventListener('DOMContentLoaded', init);
</script>
