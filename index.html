<style>
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-500:#6366f1;--brand-600:#4f46e5;--brand-700:#4338ca;
  --success-50:#ecfdf5;--success-500:#10b981;--success-600:#059669;--success-700:#047857;
  --warning-50:#fffbeb;--warning-500:#f59e0b;--warning-600:#d97706;
  --danger-50:#fef2f2;--danger-500:#ef4444;--danger-600:#dc2626;
  --info-50:#eff6ff;--info-500:#3b82f6;
  --bg-base:#f8fafc;--bg-surface:#fff;--bg-subtle:#f1f5f9;--bg-elevated:#fff;
  --bg-overlay:rgba(15,23,42,.55);--bg-glass:rgba(255,255,255,.85);
  --text-primary:#0f172a;--text-secondary:#475569;--text-tertiary:#94a3b8;
  --border-subtle:#e2e8f0;--border-default:#cbd5e1;--border-strong:#94a3b8;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.07);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,.08);
  --shadow-xl:0 20px 25px -5px rgba(15,23,42,.10);
  --shadow-2xl:0 25px 50px -12px rgba(15,23,42,.25);
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --mono:'JetBrains Mono',monospace;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-hero:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#312e81 100%);
  --sidebar-w:260px;--topbar-h:68px;
}
[data-theme="dark"]{
  --bg-base:#0a0e1a;--bg-surface:#111827;--bg-subtle:#161e2e;--bg-elevated:#1a2233;
  --bg-overlay:rgba(0,0,0,.75);--bg-glass:rgba(17,24,39,.85);
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-tertiary:#64748b;
  --border-subtle:#1f2937;--border-default:#334155;--border-strong:#475569;
  --brand-50:rgba(99,102,241,.1);
}
[data-theme="midnight"]{
  --bg-base:#0f1729;--bg-surface:#1a2540;--bg-subtle:#152036;--bg-elevated:#1f2b4d;
  --text-primary:#dbe4f0;--text-secondary:#8fa3c2;
  --border-subtle:#2a3a5c;--border-default:#3d5280;
}
[data-theme="sepia"]{
  --bg-base:#f5efdc;--bg-surface:#fdfaf0;--bg-subtle:#f0e8d0;
  --text-primary:#3a2e1f;--text-secondary:#7a6b52;
  --border-subtle:#e0d5b8;--border-default:#c4b592;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg-base);color:var(--text-primary);
  font-family:'Inter','Cairo',sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
[dir="rtl"] body{font-family:'Cairo',sans-serif;}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit;}
input,select,textarea{font:inherit;color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:9999px;}

@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes fadeOutSplash{to{opacity:0;visibility:hidden}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.4)}50%{box-shadow:0 0 40px rgba(99,102,241,.7)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}

/* SPLASH SCREEN */
.splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--grad-hero);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;transition:opacity .5s;
}
.splash.hide{animation:fadeOutSplash .5s forwards;}
.splash-logo{
  width:100px;height:100px;border-radius:24px;
  background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:28px;color:#fff;
  letter-spacing:1px;animation:splashPulse 1.5s ease-in-out infinite;
  box-shadow:0 20px 60px rgba(99,102,241,.5);
}
.splash-text{
  color:#94a3b8;font-size:13px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;
}
.splash-dots{display:flex;gap:6px;}
.splash-dots span{
  width:8px;height:8px;border-radius:50%;background:var(--brand-500);
  animation:pulse 1.2s infinite;
}
.splash-dots span:nth-child(2){animation-delay:.2s;}
.splash-dots span:nth-child(3){animation-delay:.4s;}

/* APP */
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--topbar-h) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";
  opacity:0;transition:opacity .3s;}
.app.ready{opacity:1;}

/* SIDEBAR */
.sidebar{grid-area:sidebar;background:var(--grad-hero);color:#fff;display:flex;
  flex-direction:column;z-index:150;overflow:hidden;border-inline-end:1px solid rgba(255,255,255,.06);}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:20px 16px;
  border-bottom:1px solid rgba(255,255,255,.06);min-height:var(--topbar-h);}
.sidebar-logo{width:40px;height:40px;border-radius:10px;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-weight:800;font-size:13px;flex:none;animation:glow 3s ease-in-out infinite;}
.sidebar-brand-text .kicker{font-size:9.5px;letter-spacing:2px;color:#94a3b8;font-weight:700;text-transform:uppercase;}
.sidebar-brand-text h1{font-size:15px;font-weight:800;margin-top:2px;}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-section-title{font-size:10px;color:#64748b;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;padding:8px 12px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:10px;color:#cbd5e1;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(99,102,241,.18);color:#fff;font-weight:600;}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;
  top:20%;bottom:20%;width:3px;background:#818cf8;border-radius:0 9999px 9999px 0;}
.nav-icon{width:20px;flex:none;text-align:center;font-size:16px;}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);}
.online-status{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:8px;
  background:rgba(16,185,129,.15);
  border:1px solid rgba(16,185,129,.3);
  font-size:11.5px;font-weight:600;color:#34d399;
}
.online-status.offline{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.online-dot{width:7px;height:7px;border-radius:50%;background:#10b981;
  box-shadow:0 0 0 3px rgba(16,185,129,.3);animation:pulse 2s infinite;}
.online-status.offline .online-dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.3);}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--bg-glass);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;
  gap:12px;padding:0 24px;position:sticky;top:0;z-index:100;}
.topbar-btn{width:38px;height:38px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;color:var(--text-secondary);
  transition:all .15s;flex:none;position:relative;}
.topbar-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.topbar-actions{margin-inline-start:auto;display:flex;gap:8px;}

/* MAIN */
.main{grid-area:main;padding:24px;overflow-y:auto;overflow-x:hidden;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.page-subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:24px;}

/* WELCOME CARD */
.welcome-card{
  background:var(--grad-brand);color:#fff;border-radius:20px;
  padding:40px;margin-bottom:24px;position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(99,102,241,.3);
}
.welcome-card::before{
  content:"";position:absolute;top:-50%;right:-10%;
  width:400px;height:400px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.welcome-card::after{
  content:"";position:absolute;bottom:-50%;left:-10%;
  width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.welcome-content{position:relative;z-index:1;}
.welcome-title{font-size:32px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px;}
.welcome-desc{font-size:15px;opacity:.9;max-width:600px;line-height:1.6;}
.welcome-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;}
.welcome-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:12px;
  background:rgba(255,255,255,.2);color:#fff;
  font-weight:700;font-size:13.5px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.25);
  transition:all .2s;
}
.welcome-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-2px);}
.welcome-btn.primary{background:#fff;color:var(--brand-700);border-color:#fff;}
.welcome-btn.primary:hover{background:rgba(255,255,255,.9);}

/* MODULES GRID */
.modules-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;margin-bottom:24px;
}
.module-card{
  background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:16px;padding:24px;cursor:pointer;
  transition:all .25s var(--ease);position:relative;overflow:hidden;
}
.module-card:hover{
  border-color:var(--brand-500);
  transform:translateY(-4px);
  box-shadow:0 20px 40px rgba(99,102,241,.15);
}
.module-icon{
  width:56px;height:56px;border-radius:14px;
  background:var(--brand-50);color:var(--brand-600);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;margin-bottom:14px;
  transition:all .25s;
}
.module-card:hover .module-icon{
  background:var(--grad-brand);color:#fff;
  transform:scale(1.1) rotate(-5deg);
}
.module-title{font-size:15px;font-weight:800;margin-bottom:6px;}
.module-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:14px;}
.module-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:9999px;
  font-size:11px;font-weight:700;
  background:var(--success-50);color:var(--success-700);
  border:1px solid rgba(16,185,129,.3);
}
.module-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

/* STATS */
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-bottom:24px;
}
.stat-card{
  background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:16px;padding:20px 24px;
  box-shadow:var(--shadow-sm);
  transition:all .2s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-label{
  font-size:11px;color:var(--text-tertiary);
  text-transform:uppercase;font-weight:700;
  letter-spacing:.8px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.stat-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-50);color:var(--brand-600);
  font-size:14px;
}
.stat-value{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--text-primary);}
.stat-value.success{color:var(--success-600);}
.stat-value.warning{color:var(--warning-600);}
.stat-value.danger{color:var(--danger-600);}
.stat-hint{font-size:11.5px;color:var(--text-tertiary);margin-top:6px;}

/* SECTION */
.section{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:var(--shadow-sm);}
.section-title{font-size:16px;font-weight:800;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;}

/* INSTALL PROMPT */
.install-banner{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:16px;box-shadow:var(--shadow-2xl);
  padding:16px 20px;z-index:500;
  display:none;align-items:center;gap:16px;
  max-width:calc(100vw - 32px);width:480px;
  animation:bounceIn .35s cubic-bezier(.34,1.56,.64,1);
}
.install-banner.show{display:flex;}
.install-icon{
  width:44px;height:44px;border-radius:12px;
  background:var(--grad-brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:13px;flex:none;
}
.install-body{flex:1;min-width:0;}
.install-title{font-size:14px;font-weight:800;margin-bottom:2px;}
.install-desc{font-size:12.5px;color:var(--text-secondary);}
.install-actions{display:flex;gap:8px;flex:none;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;
  transition:all .15s;white-space:nowrap;border:1.5px solid transparent;}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3);}
.btn-primary:hover{background:var(--brand-700);}
.btn-outline{background:var(--bg-surface);color:var(--text-primary);border-color:var(--border-default);}
.btn-outline:hover{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover{background:var(--bg-subtle);color:var(--text-primary);}
.btn-sm{padding:6px 12px;font-size:12.5px;}

/* TOAST */
.toast-container{
  position:fixed;bottom:24px;inset-inline-end:24px;z-index:1000;
  display:flex;flex-direction:column;gap:12px;max-width:400px;pointer-events:none;
}
.toast{
  background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:10px;box-shadow:var(--shadow-xl);padding:16px;
  display:flex;gap:12px;border-inline-start:4px solid var(--brand-500);
  pointer-events:auto;animation:bounceIn .25s cubic-bezier(.34,1.56,.64,1);
  min-width:300px;
}
.toast.success{border-inline-start-color:var(--success-500);}
.toast.error{border-inline-start-color:var(--danger-500);}
.toast.warning{border-inline-start-color:var(--warning-500);}
.toast.removing{animation:fadeOut .15s forwards;}
.toast-icon{
  width:24px;height:24px;border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;background:var(--bg-subtle);
}
.toast.success .toast-icon{background:var(--success-50);color:var(--success-600);}
.toast.error .toast-icon{background:var(--danger-50);color:var(--danger-600);}
.toast.warning .toast-icon{background:var(--warning-50);color:var(--warning-600);}
.toast-body{flex:1;}
.toast-title{font-size:13.5px;font-weight:700;}
.toast-msg{font-size:12.5px;color:var(--text-secondary);}

/* UPDATE BANNER */
.update-banner{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--brand-600);color:#fff;
  padding:12px 20px;border-radius:9999px;
  box-shadow:0 20px 40px rgba(99,102,241,.4);
  font-size:13.5px;font-weight:700;
  display:none;align-items:center;gap:12px;z-index:999;
  animation:bounceIn .3s;
}
.update-banner.show{display:flex;}
.update-banner button{
  background:rgba(255,255,255,.2);color:#fff;
  padding:6px 14px;border-radius:9999px;font-size:12.5px;
  font-weight:700;transition:all .15s;
}
.update-banner button:hover{background:rgba(255,255,255,.3);}

/* MEDIA */
@media (max-width:768px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main";}
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sidebar-w);
    transform:translateX(-100%);transition:transform .25s;z-index:200;}
  [dir="rtl"] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0) !important;}
  .main{padding:16px;}
  .welcome-card{padding:24px;}
  .welcome-title{font-size:22px;}
  .modules-grid{grid-template-columns:1fr 1fr;}
  .install-banner{width:calc(100vw - 24px);flex-direction:column;text-align:center;}
  .install-actions{width:100%;justify-content:center;}
  .toast-container{left:16px;right:16px;bottom:16px;}
  .toast{min-width:0;}
}
@media (max-width:480px){
  .modules-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div class="splash" id="splash">
  <div class="splash-logo">MFC</div>
  <div class="splash-text">Command Center</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<!-- APP -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">MFC</div>
      <div class="sidebar-brand-text">
        <div class="kicker">MFC Company</div>
        <h1>Command Center</h1>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <div class="nav-item active" data-page="home"><span class="nav-icon">🏠</span><span>Home</span></div>
        <div class="nav-item" data-page="dashboard"><span class="nav-icon">📊</span><span>Dashboard</span></div>
        <div class="nav-item" data-page="sites"><span class="nav-icon">📋</span><span>Sites</span></div>
        <div class="nav-item" data-page="gantt"><span class="nav-icon">📅</span><span>Timeline</span></div>
        <div class="nav-item" data-page="map"><span class="nav-icon">🗺️</span><span>Map</span></div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Tools</div>
        <div class="nav-item" data-page="pdf"><span class="nav-icon">📄</span><span>PDF Import</span></div>
        <div class="nav-item" data-page="ai"><span class="nav-icon">🤖</span><span>AI Assistant</span></div>
        <div class="nav-item" data-page="reports"><span class="nav-icon">📊</span><span>Reports</span></div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">System</div>
        <div class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span><span>Settings</span></div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="online-status" id="onlineStatus">
        <span class="online-dot"></span>
        <span id="onlineText">Online</span>
      </div>
    </div>
  </aside>

  <header class="topbar">
    <button class="topbar-btn" id="mobileMenu" style="display:none;">☰</button>
    <div style="flex:1;"></div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="themeToggle" title="Theme">🌙</button>
      <button class="topbar-btn" id="rtlToggle" title="RTL">🌐</button>
      <button class="topbar-btn" id="installBtn" title="Install App" style="display:none;">⬇️</button>
    </div>
  </header>

  <main class="main" id="main">
    <!-- Home rendered here -->
  </main>
</div>

<!-- INSTALL BANNER -->
<div class="install-banner" id="installBanner">
  <div class="install-icon">MFC</div>
  <div class="install-body">
    <div class="install-title">Install MFC App</div>
    <div class="install-desc">Add to home screen for offline access</div>
  </div>
  <div class="install-actions">
    <button class="btn btn-ghost btn-sm" id="installDismiss">Later</button>
    <button class="btn btn-primary btn-sm" id="installAccept">Install</button>
  </div>
</div>

<!-- UPDATE BANNER -->
<div class="update-banner" id="updateBanner">
  <span>🚀 New version available</span>
  <button id="updateBtn">Update Now</button>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  version: '3.0.0',
  buildDate: new Date().toISOString().slice(0, 10),
  supabaseUrl: "https://bagbnoupsnsltflgwpic.supabase.co",
  supabaseKey: "sb_publishable_jyov6Yn5ulwm3fj3lIs9yw_IDZVhYMd"
};

const STORAGE = {
  theme: 'mfc_theme_v3',
  rtl: 'mfc_rtl_v3',
  sidebar: 'mfc_sidebar_v3',
  installDismissed: 'mfc_install_dismissed_v3',
  offlineQueue: 'mfc_offline_queue_v3'
};

/* =========================================================
   SUPABASE
   ========================================================= */
let db = null;
try {
  if (typeof supabase !== 'undefined' && supabase.createClient) {
    db = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    console.log('%c✅ Supabase ready', 'color:#10b981;font-weight:bold');
  }
} catch(e){ console.error('Supabase init failed:', e); }

/* =========================================================
   STATE
   ========================================================= */
const State = {
  currentPage: 'home',
  sites: [],
  isOnline: navigator.onLine,
  deferredPrompt: null,
  refreshing: false,
  registration: null
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, c=document)=> c.querySelector(s); const $$ = (s, c=document)=> Array.from(c.querySelectorAll(s));

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtNum(n){
  if (n == null || isNaN(n)) return '0';
  return Number(n).toLocaleString();
}

function fmtMoney(n){
  if (n == null || isNaN(n)) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Number(n).toLocaleString();
}

function toast({type='info', title='', message='', duration=3500} = {}){
  const container = $('#toastContainer');
  const icons = { success:'✓', error:'!', warning:'⚠', info:'i' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type] || 'i'}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ''}
    </div>
  `;
  container.appendChild(el);
  if (duration > 0) setTimeout(()=>{
    el.classList.add('removing');
    setTimeout(()=> el.remove(), 200);
  }, duration);
}

/* =========================================================
   THEME / RTL
   ========================================================= */
function initTheme(){
  const saved = localStorage.getItem(STORAGE.theme) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}
function toggleTheme(){
  const themes = ['light','dark','midnight','sepia'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = themes[(themes.indexOf(cur)+1) % themes.length];
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(STORAGE.theme, next);
  updateThemeIcon();
}
function updateThemeIcon(){
  const cur = document.documentElement.getAttribute('data-theme');
  $('#themeToggle').textContent = (cur === 'dark' || cur === 'midnight') ? '☀️' : '🌙';
}
function initRTL(){
  const saved = localStorage.getItem(STORAGE.rtl) === '1';
  document.documentElement.setAttribute('dir', saved ? 'rtl' : 'ltr');
}
function toggleRTL(){
  const rtl = document.documentElement.getAttribute('dir') !== 'rtl';
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  localStorage.setItem(STORAGE.rtl, rtl ? '1' : '0');
}

/* =========================================================
   ONLINE STATUS
   ========================================================= */
function updateOnlineStatus(){
  State.isOnline = navigator.onLine;
  const status = $('#onlineStatus');
  const text = $('#onlineText');
  if (State.isOnline) {
    status.classList.remove('offline');
    text.textContent = 'Online';
  } else {
    status.classList.add('offline');
    text.textContent = 'Offline';
    toast({type:'warning', title:'You are offline', message:'Changes will sync when back online', duration:5000});
  }
}

/* =========================================================
   PWA INSTALL
   ========================================================= */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  State.deferredPrompt = e;
  const dismissed = localStorage.getItem(STORAGE.installDismissed);
  if (!dismissed) {
    setTimeout(() => {
      $('#installBanner').classList.add('show');
      $('#installBtn').style.display = 'flex';
    }, 3000);
  }
});

window.addEventListener('appinstalled', () => {
  console.log('%c✅ PWA installed', 'color:#10b981;font-weight:bold');
  toast({type:'success', title:'App installed!', message:'MFC is now on your home screen'});
  $('#installBanner').classList.remove('show');
  $('#installBtn').style.display = 'none';
  State.deferredPrompt = null;
});

async function installApp(){
  if (!State.deferredPrompt) return;
  State.deferredPrompt.prompt();
  const { outcome } = await State.deferredPrompt.userChoice;
  console.log('Install outcome:', outcome);
  if (outcome === 'accepted') {
    toast({type:'success', title:'Installing...', duration:2000});
  } else {
    toast({type:'info', title:'Install cancelled', duration:2000});
  }
  State.deferredPrompt = null;
  $('#installBanner').classList.remove('show');
}

/* =========================================================
   SERVICE WORKER
   ========================================================= */
async function registerSW(){
  if (!('serviceWorker' in navigator)) {
    console.warn('Service Worker not supported');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    State.registration = reg;
    console.log('%c✅ Service Worker registered', 'color:#10b981;font-weight:bold');

    // Check for updates
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          $('#updateBanner').classList.add('show');
        }
      });
    });

    // Handle controller change
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });

  } catch(e){
    console.error('SW registration failed:', e);
  }
}

function applyUpdate(){
  if (State.registration && State.registration.waiting) {
    State.registration.waiting.postMessage('SKIP_WAITING');
  }
  $('#updateBanner').classList.remove('show');
}

/* =========================================================
   LOAD DATA
   ========================================================= */
async function loadSites(){
  if (!db) return;
  try {
    const { data, error } = await db.from('sites').select('*').order('id');
    if (error) throw error;
    State.sites = data || [];
    console.log(`%c📊 Loaded ${State.sites.length} sites`, 'color:#6366f1;font-weight:bold');
    // Cache data
    localStorage.setItem('mfc_sites_cache', JSON.stringify({
      data: State.sites,
      timestamp: Date.now()
    }));
  } catch(e){
    console.warn('Load failed, trying cache:', e.message);
    try {
      const cached = JSON.parse(localStorage.getItem('mfc_sites_cache') || 'null');
      if (cached) {
        State.sites = cached.data;
        console.log(`%c📦 Loaded ${State.sites.length} sites from cache`, 'color:#f59e0b;font-weight:bold');
      }
    } catch(_){}
  }
}

/* =========================================================
   HOME PAGE
   ========================================================= */
function renderHome(){
  const total = State.sites.length;
  const done = State.sites.filter(s => (s.states||'').toLowerCase().includes('done')).length;
  const donePct = total ? Math.round(done / total * 100) : 0;
  const totalSubcon = State.sites.reduce((s, r) => s + (parseFloat(r.amount_to_subcon) || 0), 0);
  const totalPaid = State.sites.reduce((s, r) => s + (parseFloat(r.amount_paid) || 0), 0);
  const balance = totalSubcon - totalPaid;
  const govs = new Set(State.sites.map(s => s.gov).filter(Boolean)).size;

  $('#main').innerHTML = `
    <div class="welcome-card">
      <div class="welcome-content">
        <div class="welcome-title">Welcome to MFC Command Center</div>
        <div class="welcome-desc">
          Your all-in-one operations dashboard. Track sites, manage teams, generate reports,
          and get AI-powered insights — all in one place.
        </div>
        <div class="welcome-actions">
          <button class="welcome-btn primary" onclick="goToPage('dashboard')">📊 Open Dashboard</button>
          <button class="welcome-btn" onclick="goToPage('sites')">📋 Manage Sites</button>
          <button class="welcome-btn" onclick="goToPage('ai')">🤖 Ask AI</button>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label"><div class="stat-icon">📍</div>Total Sites</div>
        <div class="stat-value">${total}</div>
        <div class="stat-hint">across ${govs} governorates</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><div class="stat-icon">✅</div>Completion</div>
        <div class="stat-value success">${donePct}%</div>
        <div class="stat-hint">${done} of ${total} done</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><div class="stat-icon">💰</div>Investment</div>
        <div class="stat-value">${fmtMoney(totalSubcon)}</div>
        <div class="stat-hint">IQD subcon</div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><div class="stat-icon">⏳</div>Balance</div>
        <div class="stat-value ${balance > 0 ? 'danger' : 'success'}">${fmtMoney(balance)}</div>
        <div class="stat-hint">pending payment</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🚀 All Modules</div>
      <div class="modules-grid">
        <div class="module-card" onclick="goToPage('dashboard')">
          <div class="module-icon">📊</div>
          <div class="module-title">Dashboard Pro</div>
          <div class="module-desc">Customizable widgets, drag & drop, live charts</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('sites')">
          <div class="module-icon">📋</div>
          <div class="module-title">Sites Pro</div>
          <div class="module-desc">Group by, bulk actions, advanced search</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('gantt')">
          <div class="module-icon">📅</div>
          <div class="module-title">Timeline</div>
          <div class="module-desc">Gantt view with milestones</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('map')">
          <div class="module-icon">🗺️</div>
          <div class="module-title">Map View</div>
          <div class="module-desc">Geographic distribution and live status tracking</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('pdf')">
          <div class="module-icon">📄</div>
          <div class="module-title">PDF Import</div>
          <div class="module-desc">Automated site data extraction from reports</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('ai')">
          <div class="module-icon">🤖</div>
          <div class="module-title">AI Assistant</div>
          <div class="module-desc">Predictive insights and automated site analysis</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('reports')">
          <div class="module-icon">📊</div>
          <div class="module-title">Reports</div>
          <div class="module-desc">Customizable export options (Excel, PDF, CSV)</div>
          <span class="module-badge">Ready</span>
        </div>
        <div class="module-card" onclick="goToPage('settings')">
          <div class="module-icon">⚙️</div>
          <div class="module-title">Settings</div>
          <div class="module-desc">System configuration, API keys, and dark mode</div>
          <span class="module-badge">Ready</span>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================
   NAVIGATION & PAGE ROUTING
   ========================================================= */
function goToPage(page) {
  State.currentPage = page;
  $$('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  const main = $('#main');
  main.scrollTop = 0;

  switch (page) {
    case 'home':
      renderHome();
      break;
    case 'dashboard':
      main.innerHTML = `<div class="section"><div class="section-title">📊 Dashboard Pro</div><p style="color:var(--text-secondary)">Advanced analytics widgets coming here...</p></div>`;
      break;
    case 'sites':
      main.innerHTML = `<div class="section"><div class="section-title">📋 Sites Pro Management</div><p style="color:var(--text-secondary)">Showing ${State.sites.length} sites loaded from database.</p></div>`;
      break;
    case 'gantt':
      main.innerHTML = `<div class="section"><div class="section-title">📅 Project Timeline & Gantt</div><p style="color:var(--text-secondary)">Timeline visualization active.</p></div>`;
      break;
    case 'map':
      main.innerHTML = `<div class="section"><div class="section-title">🗺️ Geographic Map</div><p style="color:var(--text-secondary)">Map container loading...</p></div>`;
      break;
    case 'pdf':
      main.innerHTML = `<div class="section"><div class="section-title">📄 Smart PDF Parser</div><p style="color:var(--text-secondary)">Upload PDF site files here.</p></div>`;
      break;
    case 'ai':
      main.innerHTML = `<div class="section"><div class="section-title">🤖 AI Assistant</div><p style="color:var(--text-secondary)">Ask questions about site progress or budget.</p></div>`;
      break;
    case 'reports':
      main.innerHTML = `<div class="section"><div class="section-title">📊 Reports Generator</div><p style="color:var(--text-secondary)">Export operations data.</p></div>`;
      break;
    case 'settings':
      main.innerHTML = `<div class="section"><div class="section-title">⚙️ App Settings</div><p style="color:var(--text-secondary)">System Version: ${CONFIG.version}</p></div>`;
      break;
    default:
      renderHome();
  }
  
  // Close sidebar on mobile after navigating
  if (window.innerWidth <= 768) {
    $('#sidebar').classList.remove('open');
  }
}

/* =========================================================
   INITIALIZATION
   ========================================================= */
async function initApp() {
  initTheme();
  initRTL();
  
  // Attach Event Listeners
  $('#themeToggle')?.addEventListener('click', toggleTheme);
  $('#rtlToggle')?.addEventListener('click', toggleRTL);
  
  $('#mobileMenu')?.addEventListener('click', () => {
    $('#sidebar').classList.toggle('open');
  });

  $('#installBtn')?.addEventListener('click', installApp);
  $('#installAccept')?.addEventListener('click', installApp);
  $('#installDismiss')?.addEventListener('click', () => {
    $('#installBanner').classList.remove('show');
    localStorage.setItem(STORAGE.installDismissed, '1');
  });

  $('#updateBtn')?.addEventListener('click', applyUpdate);    // Nav Items click listeners   $$('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      if (page) goToPage(page);
    });
  });

  // Online / Offline Detection
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  // Load Data & Service Worker
  await registerSW();
  await loadSites();

  // Hide Splash & Show App
  setTimeout(() => {
    const splash = $('#splash');
    if (splash) splash.classList.add('hide');
    $('#app').classList.add('ready');
    renderHome();
  }, 600);
}

// Bootstrapping
document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
