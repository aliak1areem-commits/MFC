function initLeafletMap(){
  if (State.mapInstance) {
    State.mapInstance.remove();
    State.mapInstance = null;
  }
  const container = $('#mapContainer');
  if (!container) return;

  State.mapInstance = L.map('mapContainer', {
    center: [32.5, 44],
    zoom: 7,
    zoomControl: true
  });

  updateMapTiles();

  State.markersLayer = L.layerGroup();
  State.clustersLayer = L.markerClusterGroup({
    maxClusterRadius: 50,
    iconCreateFunction: function(cluster) {
      const count = cluster.getChildCount();
      return L.divIcon({
        html: `<div style="background:var(--brand-600);color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family:var(--font-mono);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);">${count}</div>`,
        className: '',
        iconSize: [44, 44]
      });
    }
  });
  State.heatLayer = L.heatLayer([], { radius: 25, blur: 15, maxZoom: 12 });

  updateMapData();

  // Add markers layer by default
  State.mapInstance.addLayer(State.markersLayer);
}

function updateMapTiles(){
  if (!State.mapInstance) return;
  const theme = document.documentElement.getAttribute('data-theme');
  const isDark = theme === 'dark' || theme === 'midnight';
  State.mapInstance.eachLayer(l => {
    if (l instanceof L.TileLayer) State.mapInstance.removeLayer(l);
  });
  const url = isDark
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
  L.tileLayer(url, { attribution: '© OSM · © CARTO', maxZoom: 19, subdomains: 'abcd' }).addTo(State.mapInstance);
}

function updateMapData(){
  if (!State.mapInstance) return;
  State.markersLayer.clearLayers();
  State.clustersLayer.clearLayers();
  const heatPoints = [];

  const sites = State.sites.filter(s => {
    const lat = parseFloat(s.lat), lng = parseFloat(s.long);
    if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return false;
    if (State.mapFilter !== 'all') {
      const st = getStatusClass(s);
      if (st !== State.mapFilter) return false;
    }
    return true;
  });

  sites.forEach(site => {
    const lat = parseFloat(site.lat);
    const lng = parseFloat(site.long);
    const status = getStatusClass(site);
    const colors = { done:'#10b981', progress:'#3b82f6', pending:'#f59e0b', overdue:'#ef4444' };
    const icons = { done:'✓', progress:'⚙', pending:'⏳', overdue:'!' };

    heatPoints.push([lat, lng, 1]);

    const icon = L.divIcon({
      className: '',
      html: `<div style="width:32px;height:32px;border-radius:50%;background:${colors[status]};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25);">${icons[status]}</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    const marker = L.marker([lat, lng], { icon });
    const popupHtml = `
      <div style="padding:16px 18px;min-width:240px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle);">
          <div style="width:36px;height:36px;border-radius:10px;background:${colors[status]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;">${icons[status]}</div>
          <div>
            <div style="font-size:15px;font-weight:800;">Site ${escapeHtml(site.site_id || '—')}</div>
            <div style="font-size:11.5px;color:var(--text-tertiary);">${escapeHtml(site.gov || '—')}</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;">
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-tertiary);">Status:</span><b>${escapeHtml(site.states || '—')}</b></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-tertiary);">Team:</span><b>${escapeHtml(site.team || '—')}</b></div>
          <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-tertiary);">Subcon:</span><b style="font-family:var(--font-mono);">${fmtMoney(parseFloat(site.amount_to_subcon)||0)}</b></div>
        </div>
      </div>
    `;
    marker.bindPopup(popupHtml, { maxWidth: 300 });
    State.markersLayer.addLayer(marker);
    State.clustersLayer.addLayer(marker);
  });

  State.heatLayer.setLatLngs(heatPoints);
  fitMapToSites();
}

function fitMapToSites(){
  if (!State.mapInstance) return;
  const sites = State.sites.filter(s => {
    const lat = parseFloat(s.lat), lng = parseFloat(s.long);
    return !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;
  });
  if (!sites.length) return;
  const bounds = L.latLngBounds(sites.map(s => [parseFloat(s.lat), parseFloat(s.long)]));
  State.mapInstance.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
}

function setMapMode(mode){
  if (!State.mapInstance) return;
  [State.markersLayer, State.clustersLayer, State.heatLayer].forEach(l => {
    if (State.mapInstance.hasLayer(l)) State.mapInstance.removeLayer(l);
  });
  if (mode === 'markers') State.mapInstance.addLayer(State.markersLayer);
  else if (mode === 'clusters') State.mapInstance.addLayer(State.clustersLayer);
  else if (mode === 'heatmap') State.mapInstance.addLayer(State.heatLayer);
}

/* =========================================================
   ============ PDF IMPORT PRO ============
   ========================================================= */
async function extractPdfStructure(file, onProgress){
  const buf = await file.arrayBuffer();
  const pages = [];
  try {
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const rows = groupByY(content.items);
      pages.push({ pageNum: p, rows });
      if (onProgress) onProgress(p / pdf.numPages, `Page ${p}/${pdf.numPages}`);
    }
  } catch(e){ console.warn('pdf.js:', e); }
  return pages;
}

function groupByY(items){
  const valid = items.filter(it => it.str && it.str.trim());
  valid.sort((a, b) => b.transform[5] - a.transform[5]);
  const TOL = 4;
  const rows = [];
  let cur = null;
  valid.forEach(item => {
    const y = item.transform[5], x = item.transform[4], str = item.str.trim();
    if (!cur || Math.abs(cur.y - y) > TOL) {
      cur = { y, cells: [{ x, str }] };
      rows.push(cur);
    } else {
      cur.cells.push({ x, str });
      cur.y = (cur.y * (cur.cells.length - 1) + y) / cur.cells.length;
    }
  });
  rows.forEach(r => r.cells.sort((a, b) => a.x - b.x));
  return rows;
}

function pagesToText(pages){
  return pages.map(p => p.rows.map(r => r.cells.map(c => c.str).join('\t')).join('\n')).join('\n\n');
}

async function runOCR(file, onProgress){
  try {
    if (typeof Tesseract === 'undefined') throw new Error('Tesseract not loaded');
    const { data: { text } } = await Tesseract.recognize(file, 'eng+ara', {
      logger: (m) => { if (m.status === 'recognizing text' && onProgress) onProgress(m.progress, `OCR: ${Math.round(m.progress*100)}%`); }
    });
    return text;
  } catch(e){ console.warn('OCR:', e); return ''; }
}

function parseSMR(pages, ocrText = ''){
  const result = { number:null, date:'', project:null, budget:null, siteId:null, items:[], warning:null, debug:{} };
  const allText = pagesToText(pages) || ocrText;
  result.debug.rawText = allText;

  result.number = (allText.match(/\b(BN\d{3,6})\b/i) || [])[1] || null;
  const siteM = allText.match(/\bSite\s*[#:]*\s*(\d{3,6})\b/i) || allText.match(/\bSite[-\s]?ID[:\s]*(\d{3,6})\b/i);
  result.siteId = siteM ? siteM[1] : null;
  const projM = allText.match(/\b(FTK|Ziyara|MFC|FTTX|RF)\b/i);
  result.project = projM ? projM[1].toUpperCase() : null;
  const budgetM = allText.match(/(RF\s*CAPEX\s*\d+|CAPEX\s*\d+|OPEX\s*\d+)/i);
  result.budget = budgetM ? budgetM[1].replace(/\s+/g,' ').toUpperCase() : null;
  const dateM = allText.match(/\b(\d{1,2}[-\s](?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[-\s]\d{2,4})\b/i);
  if (dateM) { const d = new Date(dateM[1].replace(/\s+/g,'-')); if (!isNaN(d)) result.date = d.toISOString().slice(0,10); }

  const s1 = extractFromStructure(pages);
  const s2 = extractFromText(allText);
  result.debug.s1Count = s1.length;
  result.debug.s2Count = s2.length;

  if (s1.length >= s2.length && s1.length > 0) { result.items = s1; result.debug.strategy = 'structure'; }
  else if (s2.length > 0) { result.items = s2; result.debug.strategy = 'text'; }
  else { result.items = []; result.debug.strategy = 'none'; result.warning = 'No items auto-detected. Use Debug Text or add manually.'; }

  return result;
}

function extractFromStructure(pages){
  const items = [];
  let header = null;
  for (const p of pages) {
    for (const row of p.rows) {
      const texts = row.cells.map(c => c.str.toLowerCase().trim());
      const hasIdx = texts.some(t => /^(index|no\.?|#|s\.?no\.?|serial|sr\.?)$/i.test(t));
      const hasQty = texts.some(t => /^(qty|qnty|quantity|accepted\s*qty)$/i.test(t));
      if (hasIdx && hasQty) {
        const map = {};
        texts.forEach((t, i) => {
          if (/^(index|no\.?|#|s\.?no\.?|serial|sr\.?)$/i.test(t)) map.idx = i;
          else if (/product|item|code|material|part/i.test(t)) map.code = i;
          else if (/description|desc|details/i.test(t)) map.desc = i;
          else if (/^(qty|qnty|quantity)$/i.test(t)) map.qty = i;
          else if (/unit|uom/i.test(t)) map.unit = i;
        });
        header = { row, map, y: row.y };
        break;
      }
    }
    if (header) break;
  }
  if (!header) return items;

  const isNum = s => /^\d{1,6}(\.\d{1,4})?$/.test(String(s).replace(/,/g,''));
  pages.forEach(p => {
    p.rows.forEach(row => {
      if (row.y >= header.y || row === header.row) return;
      const cells = row.cells;
      if (cells.length < 3) return;
      const first = String(cells[0]?.str || '').replace(/,/g,'').trim();
      if (!/^\d{1,5}$/.test(first)) return;
      const codeCell = cells[header.map.code ?? 1];
      if (!codeCell) return;
      const code = codeCell.str.trim();
      if (code.length < 2) return;
      let qty = null;
      if (header.map.qty !== undefined && cells[header.map.qty]) {
        const q = String(cells[header.map.qty].str).replace(/,/g,'').trim();
        if (isNum(q)) qty = parseFloat(q);
      }
      if (qty === null) {
        for (const c of cells) {
          const q = String(c.str).replace(/,/g,'').trim();
          if (/^\d{1,6}(\.\d{1,4})?$/.test(q)) {
            const n = parseFloat(q);
            if (n > 0 && n < 100000) { qty = n; break; }
          }
        }
      }
      if (!qty || qty <= 0) return;
      let desc = '';
      const cI = header.map.code ?? 1, qI = header.map.qty;
      if (qI !== undefined && qI > cI + 1) desc = cells.slice(cI+1, qI).map(c => c.str).join(' ').trim();
      else if (header.map.desc !== undefined) desc = cells[header.map.desc].str;
      let unit = 'pcs';
      if (header.map.unit !== undefined && cells[header.map.unit]) unit = cells[header.map.unit].str.toLowerCase();
      const key = code.toLowerCase();
      if (!items.some(it => it.code.toLowerCase() === key)) items.push({ code, desc, qty, unit, price: 0 });
    });
  });
  return items;
}

function extractFromText(text){
  const items = [];
  if (!text || text.length < 20) return items;
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const seen = new Set();
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^(index|no\.?|#|product|item|description|qty|quantity|unit|price|total|page)/i.test(line)) continue;
    if (line.length < 5) continue;
    let match = null, code = '', desc = '', qty = 0, unit = 'pcs';
    let m1 = line.match(/^\d{1,4}[\s\t]+([A-Z0-9][\w\-\.\/]{2,})[\s\t]+(.+?)[\s\t]+(\d+(?:\.\d+)?)[\s\t]*([a-zA-Z]{1,5})?$/i);
    if (m1) { code=m1[1]; desc=m1[2].trim(); qty=parseFloat(m1[3]); unit=m1[4]||'pcs'; match=true; }
    if (!match) {
      let m2 = line.match(/^([A-Z0-9][\w\-\.\/]{3,})[\s\t]+(.+?)[\s\t]+(\d+(?:\.\d+)?)[\s\t]*([a-zA-Z]{1,5})?$/i);
      if (m2 && /[A-Z]/.test(m2[1]) && /\d/.test(m2[1])) { code=m2[1]; desc=m2[2].trim(); qty=parseFloat(m2[3]); unit=m2[4]||'pcs'; match=true; }
    }
    if (match && code && qty > 0 && qty < 100000) {
      const k = code.toLowerCase();
      if (!seen.has(k)) { seen.add(k); items.push({ code, desc, qty, unit, price: 0 }); }
    }
  }
  return items;
}

async function handlePDFFiles(files){
  const arr = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
  if (!arr.length) return toast({type:'warning', title:'No PDF files'});
  for (const f of arr) await processPDF(f);
}

async function processPDF(file){
  const entry = { file, name: file.name, size: file.size, status: 'processing', progress: 0, parsed: null };
  State.pdfFiles.push(entry);
  renderPDFFiles();

  try {
    const pages = await extractPdfStructure(file, (p) => { entry.progress = Math.round(p * 50); renderPDFFiles(); });
    const allText = pagesToText(pages);
    let ocr = '';
    if (allText.replace(/\s/g,'').length < 50) {
      toast({type:'info', title:'Scanned PDF detected', message:'Running OCR...', duration:2000});
      ocr = await runOCR(file, (p) => { entry.progress = 50 + Math.round(p * 40); renderPDFFiles(); });
    }
    const parsed = parseSMR(pages, ocr);
    entry.parsed = parsed;
    entry.status = 'done';
    entry.progress = 100;
    renderPDFFiles();
    if (parsed.items.length > 0) {
      toast({type:'success', title:'✅ Extracted', message:`${parsed.items.length} items via ${parsed.debug.strategy}`});
      setTimeout(() => openPDFPreview(entry), 400);
    } else {
      toast({type:'warning', title:'⚠️ No items', message:'Review or add manually'});
      setTimeout(() => openPDFPreview(entry), 400);
    }
  } catch(e){
    entry.status = 'error';
    entry.error = e.message;
    renderPDFFiles();
    toast({type:'error', title:'Failed', message:e.message});
  }
}

function renderPDFItems(items){
  const body = $('#pdfItemsBody');
  if (!body) return;
  body.innerHTML = items.map((it, i) => `

      <td style="padding:6px;"><input style="width:100%;padding:7px;border:1px solid var(--border-subtle);border-radius:6px;font-size:12px;text-align:center;background:var(--bg-surface);color:var(--text-primary);" data-f="unit" value="${escapeHtml(it.unit || 'pcs')}"></td>

    </tr>
  `).join('');

}

function collectPDFItems(){
  const items = [];
  $$('#pdfItemsBody tr').forEach(tr => {
    const get = f => tr.querySelector(`[data-f="${f}"]`)?.value || '';
    const code = get('code').trim();
    const qty = parseFloat(get('qty')) || 0;
    if (!code && !qty) return;
    items.push({ code, desc: get('desc').trim(), qty, unit: get('unit').trim(), price: 0 });
  });
  return items;
}

async function savePDFToSupabase(){
  if (!db) return toast({type:'error', title:'Supabase not available'});
  const items = collectPDFItems();
  const smrNumber = $('#pdf_smrNumber').value.trim();
  const smrDate = $('#pdf_smrDate').value;
  const project = $('#pdf_project').value.trim();
  const siteId = $('#pdf_siteId').value.trim();
  const total = items.reduce((s, i) => s + i.qty * i.price, 0);

  const btn = $('#pdfSave');
  btn.disabled = true;
  btn.textContent = '⏳ Saving...';

  try {
    const entry = State.activePDF;
    const fileName = `smr/${siteId || 'unknown'}_${Date.now()}_${entry.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error: upErr } = await db.storage.from('smr-files').upload(fileName, entry.file, { contentType:'application/pdf', upsert:false });
    if (upErr) throw upErr;
    const { data: urlData } = db.storage.from('smr-files').getPublicUrl(fileName);

    const siteData = {
      site_id: siteId || ('SMR-' + Date.now().toString().slice(-6)),
      smr_number: smrNumber,
      smr_value: total,
      smr_items: items,
      smr_file: entry.name,
      smr_drive_url: urlData.publicUrl,
      date_field: smrDate || null,
      main_scope: project || null
    };

    const { error: insErr } = await db.from('sites').insert([siteData]);
    if (insErr) throw insErr;

    toast({type:'success', title:'✅ Saved', message:`SMR created with ${items.length} items`});
    closeModal();
    await loadSites();
    if (State.currentPage === 'sites') renderSites();
  } catch(e){
    console.error('Save failed:', e);
    toast({type:'error', title:'Save failed', message:e.message});
    btn.disabled = false;
    btn.textContent = '💾 Save to Supabase';
  }
}

function closeModal(){
  const backdrop = $('#modalBackdrop');
  backdrop.classList.remove('show');
  setTimeout(() => backdrop.innerHTML = '', 300);
}

   ⚠️ نهاية الرسالة 2 — لا تغلق الملف

   /* =========================================================

function processAIQuery(query){
  const q = query.toLowerCase().trim();
  const stats = getStats();
  const sites = State.sites;

  if (/^(hi|hello|hey|مرحبا|هلا|السلام|اهلا)/i.test(q)) {
    return `👋 مرحباً! أنا مساعدك الذكي.<br>اسألني عن:<br>
    • <code>كم موقع؟</code><br>
    • <code>Basra</code><br>
    • <code>أفضل فريق</code><br>
    • <code>المالية</code><br>
    • <code>overdue</code>`;
  }

  if (/(كم|how many|عدد).*(موقع|site)|total sites|إجمالي/i.test(q)) {
    return `📊 عندك <strong>${stats.total}</strong> موقع موزعة على:<br>
    • <strong>${stats.govCount}</strong> محافظة<br>
    • <strong>${stats.teamCount}</strong> فريق<br>
    • نسبة الإنجاز: <strong>${stats.donePct}%</strong>`;
  }

  const govMatch = q.match(/(basra|babil|baghdad|mosul|erbil|kirkuk|najaf|karbala|بصرة|بابل|بغداد|موصل|أربيل|كركوك|نجف|كربلاء)/i);
  if (govMatch) {
    const gov = govMatch[1];
    const found = sites.filter(s => (s.gov||'').toLowerCase().includes(gov.toLowerCase()));
    if (found.length) {
      const done = found.filter(s => (s.states||'').toLowerCase().includes('done')).length;
      return `📍 <strong>${gov}</strong>:<br>
      • إجمالي: <strong>${found.length}</strong> موقع<br>
      • منجزة: <strong>${done}</strong> (${Math.round(done/found.length*100)}%)`;
    }
    return `لا توجد مواقع في <strong>${gov}</strong>.`;
  }

  if (/(أفضل|best|top).*(فريق|team)/i.test(q)) {
    const teams = {};
    sites.forEach(s => {
      if (!s.team) return;
      if (!teams[s.team]) teams[s.team] = { done: 0, total: 0 };
      teams[s.team].total++;
      if ((s.states||'').toLowerCase().includes('done')) teams[s.team].done++;
    });
    const sorted = Object.entries(teams)
      .map(([name, d]) => ({ name, ...d, pct: Math.round(d.done / d.total * 100) }))
      .sort((a, b) => b.pct - a.pct).slice(0, 5);
    if (!sorted.length) return 'لا توجد بيانات للفرق.';
    return `🏆 <strong>أفضل الفرق:</strong><br>${sorted.map((t, i) =>
      `${i+1}. <strong>${escapeHtml(t.name)}</strong> — ${t.done}/${t.total} (${t.pct}%)`
    ).join('<br>')}`;
  }

  if (/(مالية|financial|money|balance|رصيد|فلوس|دفع)/i.test(q)) {
    return `💰 <strong>الملخص المالي:</strong><br>
    • Subcon: <strong>${fmtMoney(stats.totalSubcon)} IQD</strong><br>
    • Paid: <strong>${fmtMoney(stats.totalPaid)} IQD</strong><br>
    • Balance: <strong style="color:var(--danger-600)">${fmtMoney(stats.balance)} IQD</strong>`;
  }

  if (/(overdue|متأخر|pending|معلق)/i.test(q)) {
    const overdue = sites.filter(s => !(s.states||'').toLowerCase().includes('done'));
    return `⏰ <strong>${overdue.length}</strong> موقع لم يُنجز بعد.`;
  }

  if (/(smr|مواد|material)/i.test(q)) {
    const withSmr = sites.filter(s => s.smr_number).length;
    return `📄 <strong>SMR Status:</strong><br>
    • Sites with SMR: <strong>${withSmr}/${stats.total}</strong>`;
  }

  const siteMatch = q.match(/\b(\d{3,6})\b/);
  if (siteMatch) {
    const site = sites.find(s => String(s.site_id||'').includes(siteMatch[1]));
    if (site) {
      return `📍 <strong>Site ${escapeHtml(site.site_id)}</strong><br>
      • Gov: ${escapeHtml(site.gov||'—')}<br>
      • Team: ${escapeHtml(site.team||'—')}<br>
      • Status: ${escapeHtml(site.states||'—')}<br>
      • Subcon: ${fmtNum(parseFloat(site.amount_to_subcon)||0)} IQD`;
    }
  }

  if (/(completion|إنجاز|نسبة|done|منجز)/i.test(q)) {
    return `✅ <strong>نسبة الإنجاز:</strong> ${stats.donePct}%<br>
    • Done: <strong>${stats.done}</strong> موقع<br>
    • Pending: <strong>${stats.total - stats.done}</strong> موقع`;
  }

  if (/(help|مساعدة|ماذا يمكنك)/i.test(q)) {
    return `🤖 يمكنني الإجابة على:<br>
    • عدد المواقع<br>• إحصائيات محافظة<br>• ترتيب الفرق<br>
    • الملخص المالي<br>• المواقع المتأخرة<br>• SMR`;
  }

  return `لم أفهم السؤال. جرب:<br>• <code>كم موقع؟</code><br>• <code>Basra</code><br>• <code>أفضل فريق</code><br>• <code>المالية</code>`;
}

async function sendChat(){
  const input = $('#chatInput');

  if (!q) return;

  input.value = '';
  renderChatMessages();

  typing.style.cssText = 'display:flex;gap:10px;align-self:flex-start;';

  body.appendChild(typing);

  await new Promise(r => setTimeout(r, 600));

  renderChatMessages();
}

function getFilteredReportSites(){
  const gov = $('#rGov')?.value || '';
  const team = $('#rTeam')?.value || '';
  const status = $('#rStatus')?.value || '';
  return State.sites.filter(s => {
    if (gov && s.gov !== gov) return false;
    if (team && s.team !== team) return false;
    if (status) {
      const st = (s.states||'').toLowerCase();
      if (status === 'done' && !st.includes('done')) return false;
      if (status === 'progress' && !st.includes('progress')) return false;
      if (status === 'pending' && (st.includes('done') || st.includes('progress'))) return false;
    }
    return true;
  });
}

function exportReport(format){
  const sites = getFilteredReportSites();
  const cols = ALL_COLUMNS.filter(c => State.reportConfig.columns.includes(c.key));
  if (!sites.length) return toast({type:'warning', title:'No data'});

  if (format === 'csv') {
    const rows = [cols.map(c => c.label).join(',')];
    sites.forEach(s => rows.push(cols.map(c => {
      let v = String(s[c.key] ?? '').replace(/"/g,'""');
      if (v.includes(',') || v.includes('"')) v = `"${v}"`;
      return v;
    }).join(',')));
    const blob = new Blob(['\uFEFF' + rows.join('\n')], {type:'text/csv;charset=utf-8;'});
    downloadBlob(blob, `mfc_report_${new Date().toISOString().slice(0,10)}.csv`);
  } else if (format === 'xlsx') {
    const rows = sites.map(s => {
      const o = {};
      cols.forEach(c => o[c.label] = s[c.key] || '');
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, `mfc_report_${new Date().toISOString().slice(0,10)}.xlsx`);
  } else if (format === 'pdf') {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'mm', 'a4');
    doc.setFillColor(15, 23, 42);
    doc.rect(0, 0, 297, 40, 'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(22);
    doc.setFont('helvetica','bold');
    doc.text('MFC Company', 15, 20);
    doc.setFontSize(14);
    doc.setFont('helvetica','normal');
    doc.text('Site Report', 15, 30);
    doc.setFontSize(9);
    doc.text(`Generated: ${new Date().toLocaleString()} | ${sites.length} sites`, 15, 36);
    doc.autoTable({
      startY: 46,
      head: [cols.map(c => c.label)],
      body: sites.map(s => cols.map(c => String(s[c.key] || '—'))),
      styles: { fontSize: 7, cellPadding: 1.5 },
      headStyles: { fillColor: [99,102,241], textColor: [255,255,255], fontStyle: 'bold' }
    });
    doc.save(`mfc_report_${new Date().toISOString().slice(0,10)}.pdf`);
  }
  addAudit('export_' + format, `${sites.length} sites`);
  toast({type:'success', title:`${format.toUpperCase()} exported`});
}

    const u = State.users.find(x => x.id === parseInt(b.dataset.id,10));

    State.users = State.users.filter(x => x.id !== u.id);
    saveUsers();
    addAudit('delete_user', u.name);
    renderUsers();
    toast({type:'success', title:'User deleted'});
  });
}

function goToPage(page){

  $$('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.page === page));

  // Cleanup previous page if needed
  if (State.mapInstance && page !== 'map') {
    try { State.mapInstance.remove(); } catch(e){}

function openCmdk(){
  let backdrop = $('#cmdkBackdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'cmdkBackdrop';
    backdrop.style.cssText = 'position:fixed;inset:0;background:var(--bg-overlay);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;';
    backdrop.innerHTML = `
      <div style="background:var(--bg-elevated);border-radius:14px;box-shadow:var(--shadow-2xl);width:100%;max-width:580px;overflow:hidden;border:1px solid var(--border-subtle);">
        <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-subtle);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="cmdkInput" style="flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text-primary);" placeholder="Type a command...">
          <span style="font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:6px;background:var(--bg-subtle);color:var(--text-tertiary);">ESC</span>
        </div>
        <div id="cmdkResults" style="max-height:400px;overflow-y:auto;padding:8px;"></div>
      </div>
    `;
    document.body.appendChild(backdrop);
  }
  backdrop.style.display = 'flex';
  const input = $('#cmdkInput');
  input.value = '';
  input.focus();
  renderCmdk('');
  input.oninput = () => renderCmdk(input.value);
  input.onkeydown = (e) => {
    if (e.key === 'Escape') closeCmdk();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter') {
      e.preventDefault();
      const items = $$('#cmdkResults [data-cmd]');
      const active = $('#cmdkResults [data-cmd].active');
      let idx = items.indexOf(active);
      if (e.key === 'ArrowDown') idx = Math.min(idx + 1, items.length - 1);
      if (e.key === 'ArrowUp') idx = Math.max(idx - 1, 0);
      if (e.key === 'Enter') { if (active) active.click(); return; }
      items.forEach(x => x.classList.remove('active'));
      if (items[idx]) { items[idx].classList.add('active'); items[idx].scrollIntoView({ block:'nearest' }); }
    }
  };
  backdrop.onclick = (e) => { if (e.target === backdrop) closeCmdk(); };
}

function closeCmdk(){
  const backdrop = $('#cmdkBackdrop');
  if (backdrop) backdrop.style.display = 'none';
}

function renderCmdk(query){
  const q = query.trim().toLowerCase();
  const results = $('#cmdkResults');
  const filtered = q ? COMMANDS.filter(c => c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q)) : COMMANDS;
  const siteResults = q ? State.sites.filter(s => {
    const hay = `${s.site_id||''} ${s.gov||''} ${s.team||''}`.toLowerCase();
    return hay.includes(q);
  }).slice(0, 6) : [];

  let html = '';
  if (filtered.length) {
    html += `<div style="padding:8px 12px 4px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);">Commands</div>`;
    filtered.forEach((c, i) => {
      html += `<div data-cmd="${c.id}" class="cmdk-item${i === 0 ? ' active' : ''}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;${i === 0 ? 'background:var(--brand-50);' : ''}">
        <div style="width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);font-size:13px;">${c.icon}</div>
        <div style="flex:1;"><div style="font-size:13.5px;font-weight:600;">${escapeHtml(c.title)}</div><div style="font-size:11.5px;color:var(--text-tertiary);">${escapeHtml(c.desc)}</div></div>
      </div>`;
    });
  }
  if (siteResults.length) {
    html += `<div style="padding:8px 12px 4px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);">Sites</div>`;
    siteResults.forEach(s => {
      html += `<div data-site="${s.id}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;">
        <div style="width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);font-size:13px;">📍</div>
        <div style="flex:1;"><div style="font-size:13.5px;font-weight:600;">Site ${escapeHtml(s.site_id||'?')}</div><div style="font-size:11.5px;color:var(--text-tertiary);">${escapeHtml(s.gov||'')}</div></div>
      </div>`;
    });
  }
  if (!html) html = `<div style="padding:40px;text-align:center;color:var(--text-tertiary);">No results</div>`;
  results.innerHTML = html;

  results.querySelectorAll('[data-cmd]').forEach(el => {
    el.onmouseenter = () => { results.querySelectorAll('[data-cmd]').forEach(x => x.classList.remove('active')); el.classList.add('active'); };
    el.onclick = () => { COMMANDS.find(c => c.id === el.dataset.cmd)?.action(); closeCmdk(); };
  });
  results.querySelectorAll('[data-site]').forEach(el => {
    el.onmouseenter = () => { results.querySelectorAll('[data-cmd]').forEach(x => x.classList.remove('active')); };
    el.onclick = () => { const s = State.sites.find(x => x.id === parseInt(el.dataset.site,10)); if (s) openSiteDrawer(s); closeCmdk(); };
  });
}

/* =========================================================
   ============ BULK ACTIONS ============
   ========================================================= */
async function bulkDelete(){
  const ids = [...State.selected];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} sites?`)) return;
  try {
    if (db) { const { error } = await db.from('sites').delete().in('id', ids); if (error) throw error; }
    State.sites = State.sites.filter(r => !ids.includes(r.id));
    State.selected.clear();
    applyFilters();
    renderSites();
    updateBulkBar();
    toast({type:'success', title:`Deleted ${ids.length} sites`});
  } catch(e){ toast({type:'error', title:'Delete failed', message:e.message}); }
}

async function bulkSetField(field, value){
  const ids = [...State.selected];
  if (!ids.length || !value) return;
  try {
    if (db) { const u = {}; u[field] = value; const { error } = await db.from('sites').update(u).in('id', ids); if (error) throw error; }
    State.sites.forEach(r => { if (ids.includes(r.id)) r[field] = value; });
    applyFilters();
    renderSites();
    toast({type:'success', title:`Updated ${ids.length} sites`});
  } catch(e){ toast({type:'error', title:'Update failed', message:e.message}); }
}

/* =========================================================
   ============ GLOBAL EVENT BINDINGS ============
   ========================================================= */
function bindGlobalEvents(){
  // Sidebar nav
  $$('.nav-item[data-page]').forEach(item => {
    item.onclick = () => goToPage(item.dataset.page);
  });

  // Mobile menu
  const mm = $('#mobileMenu');
  if (mm) {
    mm.onclick = () => $('#sidebar').classList.toggle('open');
    const upd = () => mm.style.display = window.innerWidth <= 960 ? 'flex' : 'none';
    window.addEventListener('resize', upd);
    upd();
  }

  // Sidebar toggle
  const st = $('#sidebarToggle');
  if (st) st.onclick = toggleSidebar;

  // Theme
  const tt = $('#themeToggle');
  if (tt) tt.onclick = toggleTheme;

  // RTL
  const rt = $('#rtlToggle');
  if (rt) rt.onclick = toggleRTL;

  // Command palette
  const cb = $('#cmdBtn');
  if (cb) cb.onclick = openCmdk;

  // Install
  const ib = $('#installBtn');
  if (ib) ib.onclick = installApp;
  const ia = $('#installAccept');
  if (ia) ia.onclick = installApp;
  const idm = $('#installDismiss');
  if (idm) idm.onclick = () => {
    localStorage.setItem(STORAGE.installDismissed, '1');
    const banner = $('#installBanner');
    if (banner) banner.style.display = 'none';
  };

  // Update
  const ub = $('#updateBtn');
  if (ub) ub.onclick = applyUpdate;

  // Global search
  const gs = $('#globalSearch');
  if (gs) gs.addEventListener('input', debounce(e => {
    const q = e.target.value;
    if (q.length > 1) {
      State.search = q;
      if (State.currentPage !== 'sites') goToPage('sites');
      else { applyFilters(); renderSites(); }
    }
  }, 400));

  // Bulk bar
  const bd = $('#bulkDelete');
  if (bd) bd.onclick = bulkDelete;
  const bc = $('#bulkClear');
  if (bc) bc.onclick = () => { State.selected.clear(); updateBulkBar(); renderSites(); };
  const be = $('#bulkExport');
  if (be) be.onclick = () => {
    const sel = State.sites.filter(r => State.selected.has(r.id));
    if (sel.length) exportSitesFromList(sel, 'xlsx');
  };
  const bs = $('#bulkStatus');
  if (bs) bs.onclick = () => {
    const s = prompt('New status (Done / In Progress / Pending):');
    if (s) bulkSetField('states', s);
  };
  const bt = $('#bulkTeam');
  if (bt) bt.onclick = () => {
    const t = prompt('Team name:');
    if (t) bulkSetField('team', t);
  };

  // Online/offline
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCmdk(); }
    if ((e.metaKey || e.ctrlKey) && e.key === '/') { e.preventDefault(); toggleTheme(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'b') { e.preventDefault(); toggleSidebar(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
      e.preventDefault();
      const gs = $('#globalSearch');
      if (gs) gs.focus();
    }
    if (e.key === 'Escape') {
      closeCmdk();
      closeModal();
      closeDrawer();
    }
    if (e.altKey && /^[1-9]$/.test(e.key)) {
      e.preventDefault();
      const pages = ['home','dashboard','sites','gantt','map','pdf','ai','reports','settings'];
      const idx = parseInt(e.key, 10) - 1;
      if (pages[idx]) goToPage(pages[idx]);
    }
  });
}

function exportSitesFromList(list, format){
  if (format === 'xlsx') {
    const rows = list.map(s => {
      const o = {};
      ALL_COLUMNS.forEach(c => o[c.label] = s[c.key] || '');
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sites');
    XLSX.writeFile(wb, `mfc_bulk_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast({type:'success', title:`Exported ${list.length} sites`});
  }
}

  if (sb) sb.textContent = State.sites.length;

  // Hide splash
  setTimeout(() => {
    const splash = $('#splash');
    if (splash) splash.classList.add('hide');
    $('#app').classList.add('ready');
    goToPage('home');

    setTimeout(() => {
      toast({
        type:'success',
        title:'🎉 Welcome to MFC Command Center',
        message:`${State.sites.length} sites loaded · Press Ctrl+K for commands`,
        duration:5000
      });
    }, 500);
  }, 1200);

  console.log('%c✅ Ready', 'color:#10b981;font-weight:bold;font-size:14px');
  console.log('%c💡 Shortcuts: Ctrl+K (palette), Ctrl+/ (theme), Ctrl+B (sidebar), Alt+1-9 (pages)', 'color:#94a3b8;font-size:11px');
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
