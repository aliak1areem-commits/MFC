<style>
/* =========================================================
   DESIGN SYSTEM v3.0 — COMPLETE
   ========================================================= */
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-200:#c7d2fe;--brand-300:#a5b4fc;
  --brand-400:#818cf8;--brand-500:#6366f1;--brand-600:#4f46e5;--brand-700:#4338ca;--brand-800:#3730a3;--brand-900:#312e81;
  --accent-400:#22d3ee;--accent-500:#06b6d4;--accent-600:#0891b2;
  --success-50:#ecfdf5;--success-100:#d1fae5;--success-500:#10b981;--success-600:#059669;--success-700:#047857;
  --warning-50:#fffbeb;--warning-100:#fef3c7;--warning-500:#f59e0b;--warning-600:#d97706;--warning-700:#b45309;
  --danger-50:#fef2f2;--danger-100:#fee2e2;--danger-500:#ef4444;--danger-600:#dc2626;--danger-700:#b91c1c;
  --info-50:#eff6ff;--info-100:#dbeafe;--info-500:#3b82f6;--info-600:#2563eb;
  --purple-50:#f5f3ff;--purple-500:#8b5cf6;--purple-600:#7c3aed;
  --bg-base:#f8fafc;--bg-surface:#ffffff;--bg-elevated:#ffffff;--bg-subtle:#f1f5f9;
  --bg-overlay:rgba(15,23,42,.55);--bg-glass:rgba(255,255,255,.85);
  --text-primary:#0f172a;--text-secondary:#475569;--text-tertiary:#94a3b8;--text-inverse:#ffffff;
  --border-subtle:#e2e8f0;--border-default:#cbd5e1;--border-strong:#94a3b8;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.07),0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.05);
  --shadow-xl:0 20px 25px -5px rgba(15,23,42,.10),0 8px 10px -6px rgba(15,23,42,.05);
  --shadow-2xl:0 25px 50px -12px rgba(15,23,42,.25);
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --font-sans:'Inter','Cairo',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-brand-soft:linear-gradient(135deg,rgba(99,102,241,.1) 0%,rgba(139,92,246,.1) 50%,rgba(6,182,212,.1) 100%);
  --grad-hero:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#312e81 100%);
  --grad-success:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
  --grad-warning:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);
  --grad-danger:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);
  --sidebar-w:260px;--sidebar-w-collapsed:72px;--topbar-h:68px;
}
[data-theme="dark"]{
  --bg-base:#0a0e1a;--bg-surface:#111827;--bg-elevated:#1a2233;--bg-subtle:#161e2e;
  --bg-overlay:rgba(0,0,0,.75);--bg-glass:rgba(17,24,39,.85);
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-tertiary:#64748b;
  --border-subtle:#1f2937;--border-default:#334155;--border-strong:#475569;
  --brand-50:rgba(99,102,241,.1);--brand-100:rgba(99,102,241,.15);--brand-200:rgba(99,102,241,.25);
}
[data-theme="midnight"]{
  --bg-base:#0f1729;--bg-surface:#1a2540;--bg-subtle:#152036;--bg-elevated:#1f2b4d;
  --text-primary:#dbe4f0;--text-secondary:#8fa3c2;--text-tertiary:#6b7fa0;
  --border-subtle:#2a3a5c;--border-default:#3d5280;--border-strong:#5d7099;
  --brand-500:#4f93ff;--brand-600:#3d82f0;--brand-700:#2f6fd9;
}
[data-theme="sepia"]{
  --bg-base:#f5efdc;--bg-surface:#fdfaf0;--bg-subtle:#f0e8d0;--bg-elevated:#fdfaf0;
  --text-primary:#3a2e1f;--text-secondary:#7a6b52;--text-tertiary:#9a8b70;
  --border-subtle:#e0d5b8;--border-default:#c4b592;--border-strong:#a89468;
  --brand-500:#a0661d;--brand-600:#8a5515;--brand-700:#734510;
}
*,*::before,*::after{box-sizing:border-box;}
*{margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;transition:background var(--dur-base),color var(--dur-base);}
[dir="rtl"] body{font-family:'Cairo',sans-serif;}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
img,svg{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
ul,ol{list-style:none;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:var(--r-full);border:2px solid var(--bg-base);}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}
::selection{background:var(--brand-200);color:var(--brand-900);}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px;border-radius:var(--r-sm);}
.hidden{display:none !important;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes bounceIn{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pulseScale{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.4)}50%{box-shadow:0 0 40px rgba(99,102,241,.7)}}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes fadeOutSplash{to{opacity:0;visibility:hidden}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* =========================================================
   SPLASH SCREEN
   ========================================================= */
.splash{position:fixed;inset:0;z-index:9999;background:var(--grad-hero);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;transition:opacity .5s;}
.splash.hide{animation:fadeOutSplash .5s forwards;}
.splash-logo{width:100px;height:100px;border-radius:24px;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-weight:800;font-size:28px;color:#fff;letter-spacing:1px;
  animation:splashPulse 1.5s ease-in-out infinite;box-shadow:0 20px 60px rgba(99,102,241,.5);}
.splash-text{color:#94a3b8;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;}
.splash-dots{display:flex;gap:6px;}
.splash-dots span{width:8px;height:8px;border-radius:50%;background:var(--brand-500);animation:pulse 1.2s infinite;}
.splash-dots span:nth-child(2){animation-delay:.2s;}
.splash-dots span:nth-child(3){animation-delay:.4s;}

/* =========================================================
   APP LAYOUT
   ========================================================= */
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--topbar-h) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";
  transition:grid-template-columns var(--dur-base) var(--ease-out);opacity:0;}
.app.ready{opacity:1;transition:opacity .3s;}
.app.sidebar-collapsed{grid-template-columns:var(--sidebar-w-collapsed) 1fr;}

/* SIDEBAR */
.sidebar{grid-area:sidebar;background:var(--grad-hero);color:#fff;display:flex;
  flex-direction:column;z-index:150;overflow:hidden;
  border-inline-end:1px solid rgba(255,255,255,.06);transition:width var(--dur-base);}
.sidebar-brand{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-5) var(--sp-4);
  border-bottom:1px solid rgba(255,255,255,.06);min-height:var(--topbar-h);}
.sidebar-logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-weight:800;font-size:13px;flex:none;letter-spacing:.5px;
  box-shadow:0 8px 24px rgba(99,102,241,.4);animation:glow 3s ease-in-out infinite;}
.sidebar-brand-text{overflow:hidden;white-space:nowrap;}
.sidebar-brand-text .kicker{font-size:9.5px;letter-spacing:2px;color:#94a3b8;font-weight:700;text-transform:uppercase;}
.sidebar-brand-text h1{font-size:15px;font-weight:800;margin-top:2px;}
.sidebar-nav{flex:1;padding:var(--sp-4) var(--sp-3);overflow-y:auto;overflow-x:hidden;}
.nav-section{margin-bottom:var(--sp-5);}
.nav-section-title{font-size:10px;color:#64748b;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;padding:var(--sp-2) var(--sp-3);white-space:nowrap;overflow:hidden;}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);padding:10px var(--sp-3);
  border-radius:var(--r-md);color:#cbd5e1;font-size:13.5px;font-weight:500;
  cursor:pointer;transition:all var(--dur-fast);margin-bottom:2px;white-space:nowrap;
  position:relative;overflow:hidden;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(99,102,241,.18);color:#fff;font-weight:600;}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:20%;bottom:20%;
  width:3px;background:var(--brand-400);border-radius:0 var(--r-full) var(--r-full) 0;}
.nav-icon{width:20px;flex:none;text-align:center;font-size:16px;display:flex;align-items:center;justify-content:center;}
.nav-text{flex:1;overflow:hidden;text-overflow:ellipsis;}
.nav-badge{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 7px;
  border-radius:var(--r-full);background:rgba(239,68,68,.9);color:#fff;}
.nav-badge.success{background:rgba(16,185,129,.9);}
.sidebar-footer{padding:var(--sp-4);border-top:1px solid rgba(255,255,255,.06);}
.online-status{display:flex;align-items:center;gap:var(--sp-2);padding:8px 12px;
  border-radius:var(--r-md);background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);
  font-size:11.5px;font-weight:600;color:#34d399;transition:all var(--dur-base);}
.online-status.offline{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.online-dot{width:7px;height:7px;border-radius:50%;background:#10b981;
  box-shadow:0 0 0 3px rgba(16,185,129,.3);animation:pulse 2s infinite;flex:none;}
.online-status.offline .online-dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.3);}
.app.sidebar-collapsed .sidebar-brand-text,
.app.sidebar-collapsed .nav-text,
.app.sidebar-collapsed .nav-section-title,
.app.sidebar-collapsed .nav-badge{display:none;}
.app.sidebar-collapsed .sidebar-nav{padding:var(--sp-4) var(--sp-2);}
.app.sidebar-collapsed .nav-item{justify-content:center;padding:10px;}
.app.sidebar-collapsed .sidebar-brand{justify-content:center;padding:var(--sp-4) var(--sp-2);}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--bg-glass);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-6);
  position:sticky;top:0;z-index:100;}
.topbar-btn{width:38px;height:38px;border-radius:var(--r-md);display:flex;
  align-items:center;justify-content:center;color:var(--text-secondary);
  transition:all var(--dur-fast);flex:none;position:relative;font-size:16px;}
.topbar-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.topbar-btn.active{background:var(--brand-50);color:var(--brand-600);}
.topbar-btn .dot{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;
  border-radius:50%;background:var(--danger-500);border:2px solid var(--bg-surface);}
.topbar-search{flex:1;max-width:520px;position:relative;}
.topbar-search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  color:var(--text-tertiary);pointer-events:none;}
.topbar-search input{width:100%;padding:10px 16px;padding-inline-start:42px;padding-inline-end:80px;
  border-radius:var(--r-md);border:1.5px solid var(--border-subtle);background:var(--bg-subtle);
  font-size:13.5px;color:var(--text-primary);transition:all var(--dur-fast);}
.topbar-search input:focus{outline:none;border-color:var(--brand-500);
  background:var(--bg-surface);box-shadow:0 0 0 4px rgba(99,102,241,.1);}
.topbar-search-kbd{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
  padding:3px 8px;border-radius:5px;background:var(--bg-surface);
  border:1px solid var(--border-subtle);pointer-events:none;}
.topbar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:var(--sp-2);}
.topbar-divider{width:1px;height:24px;background:var(--border-subtle);margin:0 var(--sp-2);}

/* MAIN */
.main{grid-area:main;padding:var(--sp-6);overflow-y:auto;overflow-x:hidden;
  min-height:calc(100vh - var(--topbar-h));}
.page-header{margin-bottom:var(--sp-6);display:flex;align-items:flex-start;
  gap:var(--sp-4);flex-wrap:wrap;}
.page-header-text{flex:1;min-width:200px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text-primary);margin-bottom:var(--sp-1);}
.page-subtitle{font-size:14px;color:var(--text-secondary);}
.page-actions{margin-inline-start:auto;display:flex;gap:var(--sp-2);flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  padding:9px 16px;border-radius:var(--r-md);font-weight:600;font-size:13px;
  transition:all var(--dur-fast) var(--ease-out);white-space:nowrap;
  border:1.5px solid transparent;user-select:none;position:relative;overflow:hidden;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3);}
.btn-primary:hover:not(:disabled){background:var(--brand-700);box-shadow:0 6px 16px rgba(99,102,241,.4);transform:translateY(-1px);}
.btn-outline{background:var(--bg-surface);color:var(--text-primary);border-color:var(--border-default);}
.btn-outline:hover:not(:disabled){border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover:not(:disabled){background:var(--bg-subtle);color:var(--text-primary);}
.btn-danger{background:var(--danger-500);color:#fff;}
.btn-danger:hover:not(:disabled){background:var(--danger-600);}
.btn-success{background:var(--success-500);color:#fff;}
.btn-success:hover:not(:disabled){background:var(--success-600);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:var(--r-sm);}
.btn-lg{padding:12px 20px;font-size:14px;}
.btn-icon{padding:8px;width:36px;height:36px;}
.btn-icon.btn-sm{padding:6px;width:30px;height:30px;}

/* CARDS */
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;
  transition:all var(--dur-base) var(--ease-out);}
.card:hover{box-shadow:var(--shadow-md);}
.card-header{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:var(--sp-3);}
.card-title{font-size:14px;font-weight:700;color:var(--text-primary);flex:1;}
.card-body{padding:var(--sp-5);}
.card-footer{padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--border-subtle);background:var(--bg-subtle);}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:var(--sp-2);padding:3px 10px;
  border-radius:var(--r-full);font-size:11.5px;font-weight:600;border:1px solid;line-height:1.4;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.badge-success{color:var(--success-700);border-color:rgba(16,185,129,.35);background:var(--success-50);}
.badge-warning{color:var(--warning-700);border-color:rgba(245,158,11,.35);background:var(--warning-50);}
.badge-danger{color:var(--danger-700);border-color:rgba(239,68,68,.35);background:var(--danger-50);}
.badge-info{color:var(--info-600);border-color:rgba(59,130,246,.35);background:var(--info-50);}
.badge-neutral{color:var(--text-secondary);border-color:var(--border-default);background:var(--bg-subtle);}

/* FORM */
.form-field{margin-bottom:var(--sp-4);}
.form-field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:var(--sp-2);}
.form-field input,.form-field select,.form-field textarea{
  width:100%;padding:10px 14px;border-radius:var(--r-md);
  border:1.5px solid var(--border-subtle);background:var(--bg-subtle);
  font-size:13.5px;color:var(--text-primary);transition:all var(--dur-fast);}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  outline:none;border-color:var(--brand-500);background:var(--bg-surface);
  box-shadow:0 0 0 4px rgba(99,102,241,.1);}
.form-field input.mono{font-family:var(--font-mono);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-4);}

/* TOAST */
.toast-container{position:fixed;bottom:var(--sp-6);inset-inline-end:var(--sp-6);
  z-index:1000;display:flex;flex-direction:column;gap:var(--sp-3);max-width:420px;pointer-events:none;}
.toast{background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:var(--r-md);box-shadow:var(--shadow-xl);padding:var(--sp-4);
  display:flex;gap:var(--sp-3);border-inline-start:4px solid var(--brand-500);
  pointer-events:auto;animation:bounceIn var(--dur-base) var(--ease-spring);min-width:300px;}
.toast.success{border-inline-start-color:var(--success-500);}
.toast.error{border-inline-start-color:var(--danger-500);}
.toast.warning{border-inline-start-color:var(--warning-500);}
.toast.removing{animation:fadeOut var(--dur-fast) forwards;}
.toast-icon{width:24px;height:24px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--bg-subtle);}
.toast.success .toast-icon{background:var(--success-50);color:var(--success-600);}
.toast.error .toast-icon{background:var(--danger-50);color:var(--danger-600);}
.toast.warning .toast-icon{background:var(--warning-50);color:var(--warning-600);}
.toast.info .toast-icon{background:var(--info-50);color:var(--info-600);}
.toast-body{flex:1;min-width:0;}
.toast-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.toast-msg{font-size:12.5px;color:var(--text-secondary);line-height:1.4;}
.toast-close{width:20px;height:20px;border-radius:var(--r-xs);
  display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:14px;flex:none;}
.toast-close:hover{background:var(--bg-subtle);color:var(--text-primary);}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:var(--bg-overlay);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);z-index:900;display:flex;align-items:center;justify-content:center;
  padding:var(--sp-5);opacity:0;pointer-events:none;transition:opacity var(--dur-base);}
.modal-backdrop.show{opacity:1;pointer-events:auto;}
.modal{background:var(--bg-elevated);border-radius:var(--r-xl);box-shadow:var(--shadow-2xl);
  width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;
  transform:scale(.95);transition:transform var(--dur-base) var(--ease-spring);overflow:hidden;}
.modal-backdrop.show .modal{transform:scale(1);}
.modal.modal-sm{max-width:400px;}
.modal.modal-lg{max-width:800px;}
.modal.modal-xl{max-width:1100px;}
.modal-header{padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:flex-start;gap:var(--sp-4);}
.modal-title{flex:1;font-size:17px;font-weight:800;color:var(--text-primary);}
.modal-subtitle{font-size:13px;color:var(--text-secondary);margin-top:2px;}
.modal-close{width:32px;height:32px;border-radius:var(--r-sm);display:flex;
  align-items:center;justify-content:center;color:var(--text-tertiary);
  transition:all var(--dur-fast);flex:none;font-size:16px;}
.modal-close:hover{background:var(--bg-subtle);color:var(--text-primary);}
.modal-body{padding:var(--sp-5) var(--sp-6);overflow-y:auto;flex:1;}
.modal-footer{padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border-subtle);
  background:var(--bg-subtle);display:flex;gap:var(--sp-3);justify-content:flex-end;flex-wrap:wrap;}

/* DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:var(--bg-overlay);backdrop-filter:blur(4px);
  z-index:800;opacity:0;pointer-events:none;transition:opacity var(--dur-base);}
.drawer-backdrop.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100vw);
  background:var(--bg-elevated);z-index:801;box-shadow:var(--shadow-2xl);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform var(--dur-base) var(--ease-out);}
[dir="rtl"] .drawer{transform:translateX(-100%);}
.drawer.open{transform:translateX(0) !important;}
.drawer-header{padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:var(--sp-3);}
.drawer-title{flex:1;font-size:16px;font-weight:800;}
.drawer-body{flex:1;overflow-y:auto;padding:var(--sp-5) var(--sp-6);}

/* KPI */
.kpi-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5);}
.kpi-group{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);box-shadow:var(--shadow-sm);}
.kpi-group-title{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);
  font-size:11px;font-weight:800;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;}
.kpi-group-title::after{content:"";flex:1;height:1px;background:var(--border-subtle);}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
.kpi{padding:var(--sp-3);border-radius:var(--r-md);background:var(--bg-subtle);
  border:1px solid var(--border-subtle);transition:all var(--dur-fast);}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.kpi-label{font-size:11px;color:var(--text-secondary);font-weight:600;margin-bottom:var(--sp-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kpi-value{font-family:var(--font-mono);font-size:19px;font-weight:800;color:var(--text-primary);}

/* DASHBOARD GRID */
.dashboard-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--sp-5);margin-bottom:var(--sp-5);}
.widget[data-size="small"]{grid-column:span 3;}
.widget[data-size="medium"]{grid-column:span 4;}
.widget[data-size="large"]{grid-column:span 6;}
.widget[data-size="wide"]{grid-column:span 8;}
.widget[data-size="full"]{grid-column:span 12;}
@media (max-width:1400px){
  .widget[data-size="small"]{grid-column:span 4;}
  .widget[data-size="medium"]{grid-column:span 6;}
  .widget[data-size="large"],.widget[data-size="wide"]{grid-column:span 12;}
}
@media (max-width:900px){.widget[data-size]{grid-column:span 12;}}

.widget{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--shadow-sm);
  transition:all var(--dur-base) var(--ease-out);position:relative;overflow:hidden;
  animation:slideUp var(--dur-slow) var(--ease-out) backwards;cursor:grab;}
.widget:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--border-default);}
.widget:active{cursor:grabbing;}
.widget.dragging{opacity:.4;cursor:grabbing;transform:scale(.98);}
.widget.drag-over{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(99,102,241,.15);}
.widget-header{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4);}
.widget-title{font-size:12px;font-weight:800;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.8px;flex:1;}
.widget-actions{display:flex;gap:var(--sp-1);opacity:0;transition:opacity var(--dur-fast);}
.widget:hover .widget-actions{opacity:1;}
.widget-btn{width:26px;height:26px;border-radius:var(--r-sm);display:flex;
  align-items:center;justify-content:center;color:var(--text-tertiary);transition:all var(--dur-fast);}
.widget-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.widget-btn.danger:hover{background:var(--danger-50);color:var(--danger-600);}

.kpi-value-lg{font-family:var(--font-mono);font-size:32px;font-weight:800;
  color:var(--text-primary);letter-spacing:-1px;line-height:1.1;margin-bottom:var(--sp-2);}
.kpi-label-lg{font-size:13px;color:var(--text-secondary);font-weight:500;}
.kpi-trend{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:12px;font-weight:700;
  padding:3px 8px;border-radius:var(--r-full);margin-top:var(--sp-3);}
.kpi-trend.up{background:var(--success-50);color:var(--success-700);}
.kpi-trend.down{background:var(--danger-50);color:var(--danger-700);}
.kpi-trend.neutral{background:var(--bg-subtle);color:var(--text-secondary);}

.progress-ring{display:flex;align-items:center;justify-content:center;position:relative;height:160px;}
.progress-ring svg{transform:rotate(-90deg);}
.progress-ring circle{fill:none;stroke-linecap:round;}
.progress-ring .bg{stroke:var(--border-subtle);}
.progress-ring .fg{stroke:url(#ringGradient);transition:stroke-dashoffset 1s var(--ease-out);}
.progress-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.progress-ring-value{font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--text-primary);line-height:1;}
.progress-ring-label{font-size:11px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;margin-top:var(--sp-1);font-weight:700;}

.chart-wrap{position:relative;height:220px;}
.chart-wrap.tall{height:280px;}

.feed{max-height:340px;overflow-y:auto;margin:0 calc(var(--sp-5) * -1);}
.feed-item{display:flex;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);
  border-bottom:1px solid var(--border-subtle);transition:background var(--dur-fast);}
.feed-item:last-child{border-bottom:none;}
.feed-item:hover{background:var(--bg-subtle);}
.feed-icon{width:32px;height:32px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg-subtle);}
.feed-icon.success{background:var(--success-50);color:var(--success-700);}
.feed-icon.warning{background:var(--warning-50);color:var(--warning-700);}
.feed-icon.danger{background:var(--danger-50);color:var(--danger-700);}
.feed-icon.info{background:var(--info-50);color:var(--info-600);}
.feed-body{flex:1;min-width:0;}
.feed-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.feed-meta{font-size:11.5px;color:var(--text-tertiary);}

.alert-item{display:flex;gap:var(--sp-3);padding:var(--sp-3);border-radius:var(--r-md);
  margin-bottom:var(--sp-2);border-inline-start:3px solid;background:var(--bg-subtle);
  animation:slideUp var(--dur-base) var(--ease-out);}
.alert-item.warning{border-inline-start-color:var(--warning-500);}
.alert-item.danger{border-inline-start-color:var(--danger-500);}
.alert-item.success{border-inline-start-color:var(--success-500);}
.alert-icon{font-size:16px;flex:none;}
.alert-body{flex:1;min-width:0;}
.alert-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:2px;}
.alert-desc{font-size:12px;color:var(--text-secondary);}

/* SITES TABLE */
.toolbar{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow-sm);}
.toolbar-row{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;}
.toolbar-row + .toolbar-row{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border-subtle);}
.search-wrap{position:relative;flex:1 1 320px;max-width:480px;}
.search-wrap svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);
  color:var(--text-tertiary);pointer-events:none;}
.search-wrap input{width:100%;padding:10px 14px;padding-inline-start:42px;
  border-radius:var(--r-md);border:1.5px solid var(--border-subtle);
  background:var(--bg-subtle);font-size:13.5px;color:var(--text-primary);transition:all var(--dur-fast);}
.search-wrap input:focus{outline:none;border-color:var(--brand-500);
  background:var(--bg-surface);box-shadow:0 0 0 4px rgba(99,102,241,.1);}
.search-kbd{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
  padding:3px 7px;border-radius:5px;background:var(--bg-surface);
  border:1px solid var(--border-subtle);pointer-events:none;}

.group-selector{display:inline-flex;align-items:center;gap:6px;padding:4px;
  background:var(--bg-subtle);border-radius:var(--r-md);border:1px solid var(--border-subtle);}
.group-btn{padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;
  color:var(--text-secondary);transition:all var(--dur-fast);}
.group-btn:hover{color:var(--text-primary);}
.group-btn.active{background:var(--bg-surface);color:var(--brand-600);box-shadow:var(--shadow-sm);}

.table-card{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);}
.table-head-bar{display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;}
.table-count{font-size:13px;font-weight:600;color:var(--text-primary);}
.table-count span{color:var(--text-tertiary);font-weight:500;}
.table-actions{margin-inline-start:auto;display:flex;gap:var(--sp-2);flex-wrap:wrap;}
.table-scroll{overflow:auto;max-height:calc(100vh - 380px);}

table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap;}
table.dt thead th{position:sticky;top:0;z-index:5;background:var(--bg-subtle);
  color:var(--text-secondary);text-align:start;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;
  border-bottom:1px solid var(--border-subtle);cursor:pointer;user-select:none;}
table.dt thead th:hover{color:var(--text-primary);background:var(--border-subtle);}
table.dt thead th .sort-icon{font-size:9px;margin-inline-start:6px;color:var(--brand-600);}
table.dt thead th.frozen{position:sticky;z-index:6;box-shadow:2px 0 4px -2px rgba(0,0,0,.08);}
table.dt thead th.chk,table.dt tbody td.chk{width:40px;padding:8px;text-align:center;
  position:sticky;inset-inline-start:0;z-index:5;background:var(--bg-surface);}
table.dt thead th.chk{z-index:7;background:var(--bg-subtle);}
table.dt tbody td{padding:11px 14px;border-bottom:1px solid var(--border-subtle);
  color:var(--text-primary);vertical-align:middle;max-width:280px;
  overflow:hidden;text-overflow:ellipsis;background:var(--bg-surface);transition:background var(--dur-fast);}
table.dt tbody td.frozen{position:sticky;z-index:4;box-shadow:2px 0 4px -2px rgba(0,0,0,.08);}
table.dt tbody tr:hover td{background:var(--brand-50) !important;}
[data-theme="dark"] table.dt tbody tr:hover td,
[data-theme="midnight"] table.dt tbody tr:hover td{background:rgba(99,102,241,.08) !important;}
table.dt tbody tr.selected td{background:var(--brand-50) !important;}
[data-theme="dark"] table.dt tbody tr.selected td,
[data-theme="midnight"] table.dt tbody tr.selected td{background:rgba(99,102,241,.12) !important;}
table.dt tbody tr.status-done td.chk{border-inline-start:3px solid var(--success-500);}
table.dt tbody tr.status-pending td.chk{border-inline-start:3px solid var(--warning-500);}
table.dt tbody tr.status-overdue td.chk{border-inline-start:3px solid var(--danger-500);}
.density-compact tbody td{padding:6px 10px;font-size:12.5px;}
.density-comfortable tbody td{padding:16px 14px;}

.group-header td{background:var(--brand-50) !important;padding:12px 14px !important;
  font-weight:800 !important;font-size:12.5px !important;color:var(--brand-700) !important;
  cursor:pointer;text-transform:uppercase;letter-spacing:.5px;border-top:2px solid var(--brand-100) !important;}
.group-header .group-toggle{display:flex;align-items:center;gap:10px;width:100%;}
.group-header .arrow{transition:transform var(--dur-fast);font-size:10px;}
.group-header.collapsed .arrow{transform:rotate(-90deg);}
.group-header .count{margin-inline-start:auto;font-family:var(--font-mono);font-size:11px;
  padding:2px 8px;border-radius:var(--r-full);background:var(--brand-100);color:var(--brand-800);}

.cell-id{font-family:var(--font-mono);font-weight:700;color:var(--brand-600);font-size:13px;cursor:pointer;}
.cell-id:hover{text-decoration:underline;}
.cell-num{font-family:var(--font-mono);text-align:center;}
.cell-money{font-family:var(--font-mono);text-align:end;font-weight:600;}
.cell-money.neg{color:var(--danger-600);}
.cell-money.pos{color:var(--success-600);}
.cell-edit:focus{outline:2px solid var(--brand-500);outline-offset:-2px;background:var(--bg-surface);}

.chkbox{width:16px;height:16px;border:1.5px solid var(--border-default);border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--bg-surface);transition:all var(--dur-fast);flex:none;}
.chkbox.checked{background:var(--brand-600);border-color:var(--brand-600);color:#fff;}
.chkbox.checked::after{content:"";width:4px;height:8px;border:solid #fff;
  border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
.chkbox.indet{background:var(--brand-500);border-color:var(--brand-500);}
.chkbox.indet::after{content:"";width:8px;height:2px;background:#fff;}

.bulk-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);box-shadow:var(--shadow-xl);padding:12px 20px;
  display:flex;align-items:center;gap:16px;z-index:150;
  transition:transform .3s var(--ease-out),opacity .3s;pointer-events:none;opacity:0;}
.bulk-bar.show{transform:translateX(-50%) translateY(0);pointer-events:auto;opacity:1;}
.bulk-bar .count{font-weight:700;font-size:14px;color:var(--brand-600);
  padding-inline-end:16px;border-inline-end:1px solid var(--border-subtle);}
.bulk-actions{display:flex;gap:8px;}

/* MENU */
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;min-width:220px;
  background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);box-shadow:var(--shadow-xl);padding:var(--sp-2);
  z-index:200;display:none;}
.menu.show{display:block;animation:slideDown var(--dur-fast);}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--r-sm);font-size:13px;cursor:pointer;width:100%;text-align:start;transition:background var(--dur-fast);}
.menu-item:hover{background:var(--bg-subtle);}
.menu-item.danger{color:var(--danger-600);}
.menu-item.danger:hover{background:var(--danger-50);}
.menu-divider{height:1px;background:var(--border-subtle);margin:var(--sp-1) var(--sp-2);}
.relative{position:relative;}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,var(--bg-subtle) 0%,var(--border-subtle) 50%,var(--bg-subtle) 100%);
  background-size:1000px 100%;animation:shimmer 2s infinite linear;border-radius:var(--r-md);height:20px;margin-bottom:8px;}
.skeleton.w-75{width:75%;}.skeleton.w-50{width:50%;}.skeleton.w-30{width:30%;}
.skeleton-lg{height:60px;}

/* EMPTY */
.empty-state{padding:60px 24px;text-align:center;}
.empty-icon{width:72px;height:72px;margin:0 auto 16px;border-radius:var(--r-xl);
  background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;
  font-size:32px;opacity:.6;}
.empty-title{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--text-primary);}
.empty-desc{font-size:13.5px;color:var(--text-secondary);max-width:400px;margin:0 auto 20px;line-height:1.6;}

/* WELCOME */
.welcome-card{background:var(--grad-brand);color:#fff;border-radius:var(--r-xl);
  padding:40px;margin-bottom:24px;position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(99,102,241,.3);}
.welcome-card::before{content:"";position:absolute;top:-50%;right:-10%;
  width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.1);}
.welcome-card::after{content:"";position:absolute;bottom:-50%;left:-10%;
  width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08);}
.welcome-content{position:relative;z-index:1;}

<script>
/* =========================================================

/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  version: '3.0.0',
  buildDate: '2024-12-01',
  supabaseUrl: "https://bagbnoupsnsltflgwpic.supabase.co",
  supabaseKey: "sb_publishable_jyov6Yn5ulwm3fj3lIs9yw_IDZVhYMd"
};

const STORAGE = {
  theme: 'mfc_theme_v4',
  rtl: 'mfc_rtl_v4',
  sidebar: 'mfc_sidebar_v4',
  layout: 'mfc_layout_v4',
  columns: 'mfc_columns_v4',
  views: 'mfc_views_v4',
  density: 'mfc_density_v4',
  users: 'mfc_users_v4',
  currentUser: 'mfc_current_user_v4',
  audit: 'mfc_audit_v4',
  rules: 'mfc_rules_v4',
  installDismissed: 'mfc_install_dismissed_v4'
};

/* =========================================================
   SUPABASE
   ========================================================= */
let db = null;
try {
  if (typeof supabase !== 'undefined' && supabase.createClient) {
    db = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    console.log('%c✅ Supabase ready', 'color:#10b981;font-weight:bold');
  }
} catch(e){ console.error('❌ Supabase init failed:', e); }

/* =========================================================
   GLOBAL STATE
   ========================================================= */
const State = {
  currentPage: 'home',
  sites: [],
  filtered: [],
  selected: new Set(),
  sortKey: null,
  sortDir: 1,
  groupBy: '',
  collapsedGroups: new Set(),
  search: '',
  visibleColumns: new Set(),
  density: 'normal',
  savedViews: [],
  currentView: 'all',
  isOnline: navigator.onLine,
  deferredPrompt: null,
  registration: null,
  charts: {},
  draggedWidgetId: null,
  currentLayout: [],
  users: [],
  currentUser: null,
  audit: [],
  rules: [],
  alerts: [],
  messages: [],
  // Gantt
  ganttZoom: 'week',
  ganttStart: null,
  ganttEnd: null,
  // Map
  mapInstance: null,
  markersLayer: null,
  clustersLayer: null,
  heatLayer: null,
  mapFilter: 'all',
  // PDF
  pdfFiles: [],
  activePDF: null
};

/* =========================================================
   COLUMNS DEFINITION
   ========================================================= */
const ALL_COLUMNS = [
  { key:'site_id', label:'Site ID', type:'id', width:130, default:true, frozen:true },
  { key:'gov', label:'Governorate', type:'text', width:120, default:true, frozen:true },
  { key:'team', label:'Team', type:'text', width:120, default:true },

  { key:'flm_feedback', label:'FLM', type:'badge', width:100, default:true },
  { key:'main_scope', label:'Scope', type:'text', width:140, default:true },
  { key:'date_field', label:'Date', type:'text', width:110, default:true },
  { key:'amount_to_subcon', label:'Subcon', type:'money', width:120, default:true },
  { key:'amount_paid', label:'Paid', type:'money', width:120, default:true },
  { key:'nokia_amount', label:'Nokia', type:'money', width:120, default:true },
  { key:'payment_status', label:'Payment', type:'badge', width:110, default:true },
  { key:'po', label:'PO', type:'text', width:100, default:false },
  { key:'po2', label:'PO2', type:'text', width:100, default:false },
  { key:'pending_payment', label:'Pending', type:'money', width:110, default:false },
  { key:'smr_number', label:'SMR #', type:'text', width:110, default:false },
  { key:'smr_value', label:'SMR Value', type:'money', width:110, default:false },
  { key:'contract_value', label:'Contract', type:'money', width:110, default:false },
  { key:'field_engineer', label:'Engineer', type:'text', width:130, default:false },
  { key:'subcontractor', label:'Subcontractor', type:'text', width:130, default:false },

  { key:'nokia_comments', label:'Comments', type:'text', width:180, default:false },
  { key:'details_of_request', label:'Details', type:'text', width:180, default:false },
  { key:'lat', label:'LAT', type:'text', width:90, default:false },
  { key:'long', label:'LONG', type:'text', width:90, default:false },
  { key:'saif_tool', label:'Saif', type:'badge', width:90, default:false },
  { key:'dismantle', label:'Dismantle', type:'text', width:100, default:false },
  { key:'snags_1', label:'Snag 1', type:'text', width:140, default:false },
  { key:'snags_2', label:'Snag 2', type:'text', width:140, default:false },
  { key:'snags_3', label:'Snag 3', type:'text', width:140, default:false }
];

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, c=document)=> c.querySelector(s);
const $$ = (s, c=document)=> Array.from(c.querySelectorAll(s));

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtNum(n){
  if (n == null || isNaN(n)) return '0';
  return Number(n).toLocaleString();
}

function fmtMoney(n){
  if (n == null || isNaN(n)) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Number(n).toLocaleString();
}

function debounce(fn, ms=300){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), ms); };
}

function toast({type='info', title='', message='', duration=3500} = {}){
  const container = $('#toastContainer');
  const icons = { success:'✓', error:'!', warning:'⚠', info:'i' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type] || 'i'}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ''}
    </div>
    <button class="toast-close">✕</button>
  `;
  el.querySelector('.toast-close').onclick = () => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 200);
  };
  container.appendChild(el);
  if (duration > 0) setTimeout(()=>{
    el.classList.add('removing');
    setTimeout(()=> el.remove(), 200);
  }, duration);
}

/* =========================================================
   THEME / RTL / SIDEBAR
   ========================================================= */
function initTheme(){
  const saved = localStorage.getItem(STORAGE.theme) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}
function toggleTheme(){
  const themes = ['light','dark','midnight','sepia'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = themes[(themes.indexOf(cur)+1) % themes.length];
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(STORAGE.theme, next);
  updateThemeIcon();
  if (State.currentPage === 'dashboard') renderDashboard();
  if (State.currentPage === 'map' && State.mapInstance) updateMapTiles();
}
function updateThemeIcon(){
  const btn = $('#themeToggle');
  if (!btn) return;
  const cur = document.documentElement.getAttribute('data-theme');
  btn.textContent = (cur === 'dark' || cur === 'midnight') ? '☀️' : '🌙';
}

function initRTL(){
  const saved = localStorage.getItem(STORAGE.rtl) === '1';
  document.documentElement.setAttribute('dir', saved ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', saved ? 'ar' : 'en');
}
function toggleRTL(){
  const rtl = document.documentElement.getAttribute('dir') !== 'rtl';
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', rtl ? 'ar' : 'en');
  localStorage.setItem(STORAGE.rtl, rtl ? '1' : '0');
  toast({type:'info', title: rtl ? 'تم التبديل للعربية' : 'Switched to English', duration:2000});
}

function toggleSidebar(){
  const app = $('#app');
  app.classList.toggle('sidebar-collapsed');
  const collapsed = app.classList.contains('sidebar-collapsed');
  localStorage.setItem(STORAGE.sidebar, collapsed ? '1' : '0');
  if (State.currentPage === 'dashboard') setTimeout(renderDashboard, 300);
}

/* =========================================================
   ONLINE STATUS
   ========================================================= */
function updateOnlineStatus(){
  State.isOnline = navigator.onLine;
  const status = $('#onlineStatus');
  const text = $('#onlineText');
  if (!status || !text) return;
  if (State.isOnline) {
    status.classList.remove('offline');
    text.textContent = 'Online';
  } else {
    status.classList.add('offline');
    text.textContent = 'Offline';
  }
}

/* =========================================================
   PWA INSTALL
   ========================================================= */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  State.deferredPrompt = e;
  const dismissed = localStorage.getItem(STORAGE.installDismissed);
  if (!dismissed) {
    setTimeout(() => {
      const banner = $('#installBanner');
      if (banner) banner.style.display = 'flex';
      const btn = $('#installBtn');
      if (btn) btn.style.display = 'flex';
    }, 3000);
  }
});

window.addEventListener('appinstalled', () => {
  toast({type:'success', title:'App installed!', message:'MFC is now on your home screen'});
  const banner = $('#installBanner');
  if (banner) banner.style.display = 'none';
  const btn = $('#installBtn');
  if (btn) btn.style.display = 'none';
  State.deferredPrompt = null;
});

async function installApp(){
  if (!State.deferredPrompt) return;
  State.deferredPrompt.prompt();
  const { outcome } = await State.deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    toast({type:'success', title:'Installing...', duration:2000});
  }
  State.deferredPrompt = null;
  const banner = $('#installBanner');
  if (banner) banner.style.display = 'none';
}

/* =========================================================
   SERVICE WORKER
   ========================================================= */
async function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    State.registration = reg;
    console.log('%c✅ Service Worker registered', 'color:#10b981;font-weight:bold');
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          const banner = $('#updateBanner');
          if (banner) banner.style.display = 'flex';
        }
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
  } catch(e){
    console.warn('SW registration skipped (may need HTTPS):', e.message);
  }
}

function applyUpdate(){
  if (State.registration && State.registration.waiting) {
    State.registration.waiting.postMessage('SKIP_WAITING');
  }
  const banner = $('#updateBanner');
  if (banner) banner.style.display = 'none';
}

/* =========================================================
   DATA LOADING
   ========================================================= */
async function loadSites(){
  if (!db) {
    console.warn('⚠️ Supabase not available, using cache');
    try {
      const cached = JSON.parse(localStorage.getItem('mfc_sites_cache') || 'null');
      if (cached) State.sites = cached.data || [];
    } catch(e){}
    return;
  }
  try {
    const { data, error } = await db.from('sites').select('*').order('id');
    if (error) throw error;
    State.sites = data || [];
    console.log(`%c📊 Loaded ${State.sites.length} sites`, 'color:#6366f1;font-weight:bold');
    localStorage.setItem('mfc_sites_cache', JSON.stringify({ data: State.sites, timestamp: Date.now() }));
    const badge = $('#sitesBadge');
    if (badge) badge.textContent = State.sites.length;
  } catch(e){
    console.warn('Load failed, trying cache:', e.message);
    try {
      const cached = JSON.parse(localStorage.getItem('mfc_sites_cache') || 'null');
      if (cached) State.sites = cached.data || [];
    } catch(_){}
  }
}

function getStats(){
  const s = State.sites;
  const total = s.length;
  const done = s.filter(r => (r.states||'').toLowerCase().includes('done')).length;
  const totalSubcon = s.reduce((sum, r) => sum + (parseFloat(r.amount_to_subcon)||0), 0);
  const totalPaid = s.reduce((sum, r) => sum + (parseFloat(r.amount_paid)||0), 0);
  const totalNokia = s.reduce((sum, r) => sum + (parseFloat(r.nokia_amount)||0), 0);
  const totalSMR = s.reduce((sum, r) => sum + (parseFloat(r.smr_value)||0), 0);
  const balance = totalSubcon - totalPaid;
  const donePct = total ? Math.round(done / total * 100) : 0;
  const govCount = new Set(s.map(r => r.gov).filter(Boolean)).size;
  const teamCount = new Set(s.map(r => r.team).filter(Boolean)).size;
  const noTeam = s.filter(r => !r.team).length;
  return { total, done, donePct, totalSubcon, totalPaid, totalNokia, totalSMR, balance, govCount, teamCount, noTeam };
}

function destroyChart(key){

    try { State.charts[key].destroy(); } catch(e){}
    delete State.charts[key];

}
function chartColors(){
  const style = getComputedStyle(document.documentElement);
  return {
    text: style.getPropertyValue('--text-secondary').trim() || '#475569',
    grid: style.getPropertyValue('--border-subtle').trim() || '#e2e8f0',
    brand: style.getPropertyValue('--brand-500').trim() || '#6366f1'
  };
}

function wChartStatus(w){

function attachWidgetEvents(w, item){
  w.querySelectorAll('[data-act="remove"]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (!confirm('Remove this widget?')) return;
      State.currentLayout = State.currentLayout.filter(x => x.id !== item.id);
      saveLayout();
      renderDashboard();
      toast({type:'info', title:'Widget removed', duration:2000});
    };
  });
  w.addEventListener('dragstart', (e) => {
    State.draggedWidgetId = item.id;
    w.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  w.addEventListener('dragend', () => {
    w.classList.remove('dragging');
    $$('.widget.drag-over').forEach(el => el.classList.remove('drag-over'));
    State.draggedWidgetId = null;
  });
  w.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (State.draggedWidgetId && State.draggedWidgetId !== item.id) w.classList.add('drag-over');
  });
  w.addEventListener('dragleave', () => w.classList.remove('drag-over'));
  w.addEventListener('drop', (e) => {
    e.preventDefault();
    w.classList.remove('drag-over');
    if (!State.draggedWidgetId || State.draggedWidgetId === item.id) return;
    const fromIdx = State.currentLayout.findIndex(x => x.id === State.draggedWidgetId);
    const toIdx = State.currentLayout.findIndex(x => x.id === item.id);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = State.currentLayout.splice(fromIdx, 1);
    State.currentLayout.splice(toIdx, 0, moved);
    saveLayout();
    renderDashboard();
  });
}

function parseSearch(query){
  const filters = {};
  let text = query.trim();
  const tokens = text.match(/(\w+):([^\s]+)/g) || [];
  tokens.forEach(t => {
    const [key, ...rest] = t.split(':');
    const val = rest.join(':');
    if (['gov','team','states','payment_status','site_id','flm_feedback','smr_number'].includes(key)){
      filters[key] = val;
      text = text.replace(t, '').trim();
    }
  });
  return { text, filters };
}

function badgeClass(val){
  const v = String(val || '').toLowerCase();
  if (!v) return 'badge-neutral';
  if (v.includes('reject') || v.includes('overdue') || v.includes('unpaid')) return 'badge-danger';
  if (v.includes('accept') || v.includes('done') || v.includes('paid') || v.includes('approved') || v === 'yes') return 'badge-success';
  if (v.includes('partial') || v.includes('progress') || v.includes('pending') || v.includes('submitted')) return 'badge-warning';
  return 'badge-neutral';
}

function applyFilters(){
  const { text, filters } = parseSearch(State.search);
  const q = text.toLowerCase();
  State.filtered = State.sites.filter(row => {
    if (q) {
      const hay = ALL_COLUMNS.map(c => row[c.key] || '').join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    for (const [k, v] of Object.entries(filters)) {
      if (String(row[k] || '').toLowerCase() !== v.toLowerCase()) return false;
    }
    const view = State.savedViews.find(v => v.id === State.currentView);
    if (view && view.filters) {
      for (const [k, v] of Object.entries(view.filters)) {
        if (String(row[k] || '').toLowerCase() !== String(v).toLowerCase()) return false;
      }
    }
    return true;
  });
  if (State.sortKey) {
    State.filtered.sort((a, b) => {
      let va = a[State.sortKey] || '', vb = b[State.sortKey] || '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb) && va !== '' && vb !== '') return (na - nb) * State.sortDir;
      return String(va).localeCompare(String(vb)) * State.sortDir;
    });
  }
}

function renderSitesTable(visibleCols){
  const thead = $('#theadRow');
  const tbody = $('#tbodyRows');

  thead.innerHTML = `
    <th class="chk"><div class="chkbox" id="selectAll"></div></th>
    ${visibleCols.map(c => {
      const frozen = c.frozen ? 'frozen' : '';
      const sortIcon = State.sortKey === c.key ? `<span class="sort-icon">${State.sortDir === 1 ? '▲' : '▼'}</span>` : '';
      return `<th class="${frozen}" data-key="${c.key}">${c.label}${sortIcon}</th>`;
    }).join('')}
  `;

  if (!State.filtered.length) {
    $('#sitesEmpty').style.display = 'block';
    tbody.innerHTML = '';
    $('#cntDisplay').textContent = '0';
    $('#cntSub').textContent = '';
    return;
  }
  $('#sitesEmpty').style.display = 'none';

  let html = '';
  if (State.groupBy) {
    const groups = {};
    State.filtered.forEach(r => {
      const k = r[State.groupBy] || '(Empty)';
      if (!groups[k]) groups[k] = [];
      groups[k].push(r);
    });
    Object.keys(groups).sort().forEach(gKey => {
      const isCollapsed = State.collapsedGroups.has(gKey);
      html += `<tr class="group-header ${isCollapsed ? 'collapsed' : ''}" data-group="${escapeHtml(gKey)}">
        <td colspan="${visibleCols.length + 1}">
          <div class="group-toggle">
            <span class="arrow">▼</span>
            <span>${escapeHtml(gKey)}</span>
            <span class="count">${groups[gKey].length}</span>
          </div>
        </td>
      </tr>`;
      if (!isCollapsed) groups[gKey].forEach(r => { html += renderSiteRow(r, visibleCols); });
    });
  } else {
    State.filtered.forEach(r => { html += renderSiteRow(r, visibleCols); });
  }
  tbody.innerHTML = html;

  $('#cntDisplay').textContent = State.filtered.length;
  $('#cntSub').textContent = State.filtered.length !== State.sites.length ? `of ${State.sites.length} total` : 'total sites';
  $('#sitesCount').textContent = `${State.sites.length} total · ${State.selected.size} selected`;

  bindTableRowEvents();
}

function renderSiteRow(r, visibleCols){
  const isSelected = State.selected.has(r.id);
  const status = String(r.states || '').toLowerCase();
  const statusClass = status.includes('done') ? 'status-done'
    : status.includes('progress') ? 'status-pending'
    : status.includes('overdue') ? 'status-overdue' : '';

  return `<tr class="${isSelected ? 'selected' : ''} ${statusClass}" data-id="${r.id}">
    <td class="chk"><div class="chkbox ${isSelected ? 'checked' : ''}" data-id="${r.id}"></div></td>
    ${visibleCols.map(c => {
      const val = r[c.key];
      const frozen = c.frozen ? 'frozen' : '';
      if (c.type === 'id') return `<td class="${frozen}" data-label="${c.label}"><span class="cell-id" data-site-id="${escapeHtml(val)}">${escapeHtml(val || '—')}</span></td>`;
      if (c.type === 'badge') return `<td class="${frozen}" data-label="${c.label}">${val ? `<span class="badge ${badgeClass(val)}">${escapeHtml(val)}</span>` : '—'}</td>`;
      if (c.type === 'money') return `<td class="cell-money ${frozen}" data-label="${c.label}">${val ? fmtMoney(parseFloat(val) || 0) : '—'}</td>`;
      return `<td class="cell-edit ${frozen}" contenteditable="true" data-col="${c.key}" data-label="${c.label}">${escapeHtml(val || '')}</td>`;
    }).join('')}
  </tr>`;
}

function bindTableRowEvents(){
  $$('#theadRow th[data-key]').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if (State.sortKey === k) State.sortDir *= -1;
      else { State.sortKey = k; State.sortDir = 1; }
      applyFilters();
      renderSites();
    };
  });

  const selectAll = $('#selectAll');
  if (selectAll) {
    const allSel = State.filtered.length > 0 && State.filtered.every(r => State.selected.has(r.id));
    const someSel = State.filtered.some(r => State.selected.has(r.id)) && !allSel;
    selectAll.classList.toggle('checked', allSel);
    selectAll.classList.toggle('indet', someSel);
    selectAll.onclick = (e) => {
      e.stopPropagation();
      if (allSel) State.filtered.forEach(r => State.selected.delete(r.id));
      else State.filtered.forEach(r => State.selected.add(r.id));
      renderSites();
    };
  }

  $$('#tbodyRows .chkbox[data-id]').forEach(cb => {
    cb.onclick = (e) => {
      e.stopPropagation();
      const id = parseInt(cb.dataset.id, 10);
      if (State.selected.has(id)) State.selected.delete(id);
      else State.selected.add(id);
      cb.classList.toggle('checked', State.selected.has(id));
      cb.closest('tr').classList.toggle('selected', State.selected.has(id));
      updateBulkBar();
    };
  });

  $$('#tbodyRows .cell-id').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const site = State.sites.find(r => r.site_id === el.dataset.siteId);
      if (site) openSiteDrawer(site);
    };
  });

  $$('#tbodyRows .cell-edit').forEach(cell => {
    cell.dataset.original = cell.textContent;
    cell.addEventListener('blur', async () => {
      const id = parseInt(cell.closest('tr').dataset.id, 10);
      const col = cell.dataset.col;
      const newVal = cell.textContent.trim();
      const site = State.sites.find(r => r.id === id);
      if (!site || site[col] === newVal) return;
      const oldVal = site[col];
      site[col] = newVal;
      try {
        if (db) {
          const upd = {}; upd[col] = newVal;
          const { error } = await db.from('sites').update(upd).eq('id', id);
          if (error) throw error;
        }
        toast({type:'success', title:'Saved', message:col, duration:1500});
      } catch(e){
        site[col] = oldVal;
        cell.textContent = oldVal;
        toast({type:'error', title:'Save failed', message:e.message});
      }
    });
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); cell.blur(); }
      if (e.key === 'Escape') { cell.textContent = cell.dataset.original; cell.blur(); }
    });
  });

  $$('.group-header').forEach(gh => {
    gh.onclick = () => {
      const k = gh.dataset.group;
      if (State.collapsedGroups.has(k)) State.collapsedGroups.delete(k);
      else State.collapsedGroups.add(k);
      renderSites();
    };
  });
}

      if (!db) return toast({type:'warning', title:'Offline'});

        const { data, error } = await db.from('sites').insert([{ site_id:'NEW' + Date.now().toString().slice(-4) }]).select().single();
        if (error) throw error;
        State.sites.push(data);
        applyFilters();
        renderSites();
        toast({type:'success', title:'Site created'});
      } catch(e){ toast({type:'error', title:'Create failed', message:e.message}); }
    };
  }

  document.addEventListener('click', () => {
    const cm = $('#colMenu'); if (cm) cm.classList.remove('show');
    const em = $('#exportMenu'); if (em) em.classList.remove('show');
  }, { once: true });
}

function exportSites(format){
  const data = State.filtered;
  const cols = ALL_COLUMNS.filter(c => State.visibleColumns.has(c.key));
  if (!data.length) return toast({type:'warning', title:'No data'});

  if (format === 'xlsx') {
    const rows = data.map(r => {
      const obj = {};
      cols.forEach(c => obj[c.label] = r[c.key] || '');
      return obj;
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sites');
    XLSX.writeFile(wb, `mfc_sites_${new Date().toISOString().slice(0,10)}.xlsx`);
  } else if (format === 'csv') {
    const rows = [cols.map(c => c.label).join(',')];
    data.forEach(r => {
      rows.push(cols.map(c => {
        let v = String(r[c.key] ?? '').replace(/"/g,'""');
        if (v.includes(',') || v.includes('"')) v = `"${v}"`;
        return v;
      }).join(','));
    });
    const blob = new Blob(['\uFEFF' + rows.join('\n')], {type:'text/csv;charset=utf-8;'});
    downloadBlob(blob, `mfc_sites_${new Date().toISOString().slice(0,10)}.csv`);
  } else if (format === 'json') {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    downloadBlob(blob, `mfc_sites_${new Date().toISOString().slice(0,10)}.json`);
  }
  toast({type:'success', title:`${format.toUpperCase()} exported`, message:`${data.length} sites`});
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================
   ============ GANTT / TIMELINE ============
   ========================================================= */
function parseDate(str){
  if (!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  m = s.match(/^(\d{1,2})[-\/\s]([A-Za-z]{3})[-\/\s](\d{2,4})/);
  if (m) {
    const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    let year = parseInt(m[3]);
    if (year < 100) year += 2000;
    return new Date(year, months[m[2].toLowerCase()], parseInt(m[1]));
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function formatDate(d){
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function daysBetween(a, b){ return Math.round((b - a) / (1000*60*60*24)); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function isWeekend(d){ const day = d.getDay(); return day === 0 || day === 6; }
function isToday(d){
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function getStatusClass(row){
  const s = String(row.states || '').toLowerCase();
  if (s.includes('done') || s.includes('complete')) return 'done';
  if (s.includes('progress') || s.includes('ongoing')) return 'progress';
  if (s.includes('pending') || s.includes('waiting')) return 'pending';
  if (s.includes('overdue') || s.includes('late')) return 'overdue';
  return 'progress';
}

function renderGantt(){
  const items = State.sites.map(r => {
    const start = parseDate(r.date_field);
    return start ? { ...r, _start: start, _end: addDays(start, 30) } : null;
  }).filter(Boolean).sort((a,b) => a._start - b._start);

  $('#pageContainer').innerHTML = `
    <div class="page-header">
      <div class="page-header-text">
        <h1 class="page-title">Timeline</h1>
        <p class="page-subtitle">${items.length} sites with dates · ${State.ganttZoom} view</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="todayBtn">📅 Today</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="group-selector">
        <button class="group-btn ${State.ganttZoom==='day'?'active':''}" data-gantt-zoom="day">Day</button>
        <button class="group-btn ${State.ganttZoom==='week'?'active':''}" data-gantt-zoom="week">Week</button>
        <button class="group-btn ${State.ganttZoom==='month'?'active':''}" data-gantt-zoom="month">Month</button>
      </div>
    </div>
    ${items.length === 0 ? `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">No sites with dates</div>
        <div class="empty-desc">Add dates to your sites to see them on the timeline</div>
      </div>
    ` : `
      <div class="card">
        <div style="overflow:auto;max-height:calc(100vh - 320px);">
          <div id="ganttInner"></div>
        </div>
      </div>
    `}
  `;

  $$('[data-gantt-zoom]').forEach(b => {
    b.onclick = () => {
      State.ganttZoom = b.dataset.ganttZoom;
      renderGantt();
    };
  });

  const todayBtn = $('#todayBtn');
  if (todayBtn) {
    todayBtn.onclick = () => {
      const scroll = $('#ganttInner');
      if (!scroll) return;
      const today = new Date();
      const todayX = daysBetween(State.ganttStart, today) * (State.ganttZoom === 'day' ? 40 : State.ganttZoom === 'week' ? 20 : 8);
      scroll.parentElement.scrollTo({ left: Math.max(0, todayX - 400), behavior: 'smooth' });
    };
  }

  if (!items.length) return;

  const allDates = items.flatMap(r => [r._start, r._end]);
  let minDate = new Date(Math.min(...allDates));
  let maxDate = new Date(Math.max(...allDates));
  minDate = addDays(minDate, -7);
  maxDate = addDays(maxDate, 7);
  State.ganttStart = minDate;
  State.ganttEnd = maxDate;

  const cellWidth = State.ganttZoom === 'day' ? 40 : State.ganttZoom === 'week' ? 20 : 8;
  const totalDays = daysBetween(minDate, maxDate) + 1;
  const totalWidth = totalDays * cellWidth;

  let html = `<div style="display:grid;grid-template-columns:260px ${totalWidth}px;min-width:100%;">`;
  // Header labels
  html += `<div style="position:sticky;left:0;background:var(--bg-subtle);z-index:5;border-inline-end:2px solid var(--border-subtle);">`;
  html += `<div style="height:56px;padding:0 20px;display:flex;align-items:center;font-size:11px;font-weight:800;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--border-subtle);">Site</div>`;
  items.forEach(r => {
    html += `<div style="height:52px;padding:0 20px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--border-subtle);cursor:pointer;" onclick="window.__openSiteById(${r.id})">
      <div style="font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--brand-600);">📍 ${escapeHtml(r.site_id || '—')}</div>
      <div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">${escapeHtml(r.gov || '')} · ${escapeHtml(r.team || 'No team')}</div>
    </div>`;
  });
  html += `</div>`;

  // Timeline
  html += `<div style="position:relative;">`;
  // Header cells
  html += `<div style="height:56px;display:flex;position:sticky;top:0;background:var(--bg-subtle);z-index:4;border-bottom:2px solid var(--border-subtle);">`;
  for (let i = 0; i < totalDays; i++) {
    const d = addDays(minDate, i);
    const wk = isWeekend(d);
    const td = isToday(d);
    const show = State.ganttZoom === 'day' || (State.ganttZoom === 'week' && d.getDay() === 1) || (State.ganttZoom === 'month' && d.getDate() === 1) || i === 0;
    html += `<div style="width:${cellWidth}px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-inline-end:1px solid var(--border-subtle);${td ? 'background:rgba(99,102,241,.12);' : wk ? 'background:rgba(0,0,0,.02);' : ''}">${show ? `<div style="font-size:9px;color:var(--text-tertiary);text-transform:uppercase;">${d.toLocaleDateString('en-US',{month:'short'})}</div><div style="font-family:var(--font-mono);font-weight:800;font-size:13px;${td ? 'color:var(--brand-600);' : ''}">${d.getDate()}</div>` : ''}</div>`;
  }
  html += `</div>`;

  // Body rows
  items.forEach(r => {
    const startOff = daysBetween(minDate, r._start);
    const dur = Math.max(1, daysBetween(r._start, r._end));
    const left = startOff * cellWidth;
    const width = Math.max(dur * cellWidth, 60);
    const statusCls = getStatusClass(r);
    const colors = {
      done: 'linear-gradient(135deg,#10b981,#059669)',
      progress: 'linear-gradient(135deg,#3b82f6,#2563eb)',
      pending: 'linear-gradient(135deg,#f59e0b,#d97706)',
      overdue: 'linear-gradient(135deg,#ef4444,#dc2626)'
    };
    html += `<div style="height:52px;position:relative;border-bottom:1px solid var(--border-subtle);">`;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(minDate, i);
      const wk = isWeekend(d);
      const td = isToday(d);
      html += `<div style="position:absolute;left:${i*cellWidth}px;top:0;bottom:0;width:${cellWidth}px;border-inline-end:1px solid var(--border-subtle);${td ? 'background:rgba(99,102,241,.06);' : wk ? 'background:rgba(0,0,0,.02);' : ''}"></div>`;
    }
    html += `<div style="position:absolute;left:${left}px;top:12px;height:28px;width:${width}px;background:${colors[statusCls]};border-radius:6px;display:flex;align-items:center;padding:0 10px;color:#fff;font-size:11.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;white-space:nowrap;overflow:hidden;" onclick="window.__openSiteById(${r.id})">${escapeHtml(r.site_id)} · ${dur}d</div>`;
    html += `</div>`;
  });

  // Today marker
  const todayOff = daysBetween(minDate, new Date());
  if (todayOff >= 0 && todayOff < totalDays) {
    html += `<div style="position:absolute;left:${todayOff*cellWidth + cellWidth/2}px;top:56px;bottom:0;width:2px;background:var(--danger-500);box-shadow:0 0 8px rgba(239,68,68,.5);z-index:3;pointer-events:none;"></div>`;
  }
  html += `</div></div>`;

  $('#ganttInner').innerHTML = html;
}

window.__openSiteById = function(id){
  const site = State.sites.find(s => s.id === id);
  if (site) openSiteDrawer(site);
};
