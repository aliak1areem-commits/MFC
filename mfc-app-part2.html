<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFC | Command Center Pro</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   DESIGN SYSTEM v3.0 (same as Part 1)
   ========================================================= */
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-200:#c7d2fe;
  --brand-300:#a5b4fc;--brand-400:#818cf8;--brand-500:#6366f1;
  --brand-600:#4f46e5;--brand-700:#4338ca;--brand-800:#3730a3;--brand-900:#312e81;
  --accent-400:#22d3ee;--accent-500:#06b6d4;--accent-600:#0891b2;
  --success-50:#ecfdf5;--success-100:#d1fae5;--success-500:#10b981;--success-600:#059669;--success-700:#047857;
  --warning-50:#fffbeb;--warning-100:#fef3c7;--warning-500:#f59e0b;--warning-600:#d97706;--warning-700:#b45309;
  --danger-50:#fef2f2;--danger-100:#fee2e2;--danger-500:#ef4444;--danger-600:#dc2626;--danger-700:#b91c1c;
  --info-50:#eff6ff;--info-100:#dbeafe;--info-500:#3b82f6;--info-600:#2563eb;
  --bg-base:#f8fafc;--bg-surface:#ffffff;--bg-elevated:#ffffff;--bg-subtle:#f1f5f9;
  --bg-overlay:rgba(15,23,42,.55);--bg-glass:rgba(255,255,255,.85);
  --text-primary:#0f172a;--text-secondary:#475569;--text-tertiary:#94a3b8;--text-inverse:#fff;
  --border-subtle:#e2e8f0;--border-default:#cbd5e1;--border-strong:#94a3b8;
  --shadow-xs:0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.07),0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.05);
  --shadow-xl:0 20px 25px -5px rgba(15,23,42,.10),0 8px 10px -6px rgba(15,23,42,.05);
  --shadow-2xl:0 25px 50px -12px rgba(15,23,42,.25);
  --r-xs:4px;--r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in-out:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:150ms;--dur-base:250ms;--dur-slow:400ms;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;
  --sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --font-sans:'Inter','Cairo',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#06b6d4 100%);
  --grad-hero:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#312e81 100%);
  --sidebar-w:260px;--sidebar-w-collapsed:72px;--topbar-h:68px;
}
[data-theme="dark"]{
  --bg-base:#0a0e1a;--bg-surface:#111827;--bg-elevated:#1a2233;--bg-subtle:#161e2e;
  --bg-overlay:rgba(0,0,0,.75);--bg-glass:rgba(17,24,39,.85);
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-tertiary:#64748b;
  --border-subtle:#1f2937;--border-default:#334155;--border-strong:#475569;
  --brand-50:rgba(99,102,241,.1);--brand-100:rgba(99,102,241,.15);--brand-200:rgba(99,102,241,.25);
}
[data-theme="midnight"]{
  --bg-base:#0f1729;--bg-surface:#1a2540;--bg-subtle:#152036;--bg-elevated:#1f2b4d;
  --text-primary:#dbe4f0;--text-secondary:#8fa3c2;--text-tertiary:#6b7fa0;
  --border-subtle:#2a3a5c;--border-default:#3d5280;--border-strong:#5d7099;
  --brand-500:#4f93ff;--brand-600:#3d82f0;--brand-700:#2f6fd9;
}
[data-theme="sepia"]{
  --bg-base:#f5efdc;--bg-surface:#fdfaf0;--bg-subtle:#f0e8d0;--bg-elevated:#fdfaf0;
  --text-primary:#3a2e1f;--text-secondary:#7a6b52;--text-tertiary:#9a8b70;
  --border-subtle:#e0d5b8;--border-default:#c4b592;--border-strong:#a89468;
  --brand-500:#a0661d;--brand-600:#8a5515;--brand-700:#734510;
}
*,*::before,*::after{box-sizing:border-box;}
*{margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background var(--dur-base),color var(--dur-base);}
[dir="rtl"] body{font-family:'Cairo',sans-serif;}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
svg{display:block;max-width:100%;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:var(--r-full);border:2px solid var(--bg-base);}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}
::selection{background:var(--brand-200);color:var(--brand-900);}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px;border-radius:var(--r-sm);}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes bounceIn{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.4)}50%{box-shadow:0 0 40px rgba(99,102,241,.7)}}

/* =========================================================
   APP LAYOUT
   ========================================================= */
.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:var(--topbar-h) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";
  transition:grid-template-columns var(--dur-base) var(--ease-out);}
.app.sidebar-collapsed{grid-template-columns:var(--sidebar-w-collapsed) 1fr;}

/* SIDEBAR */
.sidebar{grid-area:sidebar;background:var(--grad-hero);color:#fff;display:flex;
  flex-direction:column;border-inline-end:1px solid rgba(255,255,255,.06);z-index:150;overflow:hidden;}
.sidebar-brand{display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-5) var(--sp-4);border-bottom:1px solid rgba(255,255,255,.06);
  min-height:var(--topbar-h);}
.sidebar-logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);
  font-weight:800;font-size:13px;color:#fff;flex:none;
  box-shadow:0 8px 24px rgba(99,102,241,.4);animation:glow 3s ease-in-out infinite;}
.sidebar-brand-text{overflow:hidden;white-space:nowrap;}
.sidebar-brand-text .kicker{font-size:9.5px;letter-spacing:2px;color:#94a3b8;
  font-weight:700;text-transform:uppercase;}
.sidebar-brand-text h1{font-size:15px;font-weight:800;color:#fff;margin-top:2px;}
.sidebar-nav{flex:1;padding:var(--sp-4) var(--sp-3);overflow-y:auto;overflow-x:hidden;}
.nav-section{margin-bottom:var(--sp-5);}
.nav-section-title{font-size:10px;color:#64748b;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;padding:var(--sp-2) var(--sp-3);
  white-space:nowrap;overflow:hidden;}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);
  padding:10px var(--sp-3);border-radius:var(--r-md);color:#cbd5e1;
  font-size:13.5px;font-weight:500;cursor:pointer;
  transition:all var(--dur-fast);margin-bottom:2px;white-space:nowrap;
  position:relative;overflow:hidden;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(99,102,241,.18);color:#fff;font-weight:600;}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;
  top:20%;bottom:20%;width:3px;background:var(--brand-400);
  border-radius:0 var(--r-full) var(--r-full) 0;}
.nav-icon{width:20px;height:20px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:16px;}
.nav-text{flex:1;overflow:hidden;text-overflow:ellipsis;}
.nav-badge{font-family:var(--font-mono);font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:var(--r-full);background:rgba(239,68,68,.9);color:#fff;}
.nav-badge.success{background:rgba(16,185,129,.9);}
.sidebar-footer{padding:var(--sp-4);border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:var(--sp-3);}
.sidebar-user{width:36px;height:36px;border-radius:50%;background:var(--grad-brand);
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:12px;color:#fff;flex:none;border:2px solid rgba(255,255,255,.15);cursor:pointer;}
.sidebar-user-info{flex:1;overflow:hidden;white-space:nowrap;}
.sidebar-user-name{font-size:13px;font-weight:600;color:#fff;}
.sidebar-user-role{font-size:11px;color:#94a3b8;}
.sidebar-collapse-btn{width:28px;height:28px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);color:#94a3b8;transition:all var(--dur-fast);}
.sidebar-collapse-btn:hover{background:rgba(255,255,255,.12);color:#fff;}
.app.sidebar-collapsed .sidebar-brand-text,
.app.sidebar-collapsed .nav-text,
.app.sidebar-collapsed .nav-section-title,
.app.sidebar-collapsed .nav-badge,
.app.sidebar-collapsed .sidebar-user-info,
.app.sidebar-collapsed .sidebar-collapse-btn{display:none;}
.app.sidebar-collapsed .sidebar-nav{padding:var(--sp-4) var(--sp-2);}
.app.sidebar-collapsed .nav-item{justify-content:center;padding:10px;}
.app.sidebar-collapsed .sidebar-brand{justify-content:center;padding:var(--sp-4) var(--sp-2);}
.app.sidebar-collapsed .sidebar-footer{justify-content:center;padding:var(--sp-4) var(--sp-2);}

@media (max-width:960px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main";}
  .sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sidebar-w);
    transform:translateX(-100%);transition:transform var(--dur-base) var(--ease-out);
    z-index:200;box-shadow:var(--shadow-2xl);}
  [dir="rtl"] .sidebar{transform:translateX(100%);}
  .sidebar.open{transform:translateX(0) !important;}
}

/* TOPBAR */
.topbar{grid-area:topbar;background:var(--bg-glass);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-6);
  position:sticky;top:0;z-index:100;}
.topbar-btn{width:38px;height:38px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);transition:all var(--dur-fast);
  position:relative;flex:none;}
.topbar-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.topbar-btn.active{background:var(--brand-50);color:var(--brand-600);}
.topbar-btn .dot{position:absolute;top:8px;inset-inline-end:8px;
  width:8px;height:8px;border-radius:50%;background:var(--danger-500);
  border:2px solid var(--bg-surface);}
.topbar-search{flex:1;max-width:520px;position:relative;}
.topbar-search svg{position:absolute;inset-inline-start:14px;top:50%;
  transform:translateY(-50%);color:var(--text-tertiary);pointer-events:none;}
.topbar-search input{width:100%;padding:10px 16px;
  padding-inline-start:42px;padding-inline-end:80px;border-radius:var(--r-md);
  border:1.5px solid var(--border-subtle);background:var(--bg-subtle);
  font-size:13.5px;color:var(--text-primary);transition:all var(--dur-fast);}
.topbar-search input:focus{outline:none;border-color:var(--brand-500);
  background:var(--bg-surface);box-shadow:0 0 0 4px rgba(99,102,241,.1);}
.topbar-search-kbd{position:absolute;inset-inline-end:12px;top:50%;
  transform:translateY(-50%);font-family:var(--font-mono);font-size:10.5px;
  color:var(--text-tertiary);padding:3px 8px;border-radius:5px;
  background:var(--bg-surface);border:1px solid var(--border-subtle);pointer-events:none;}
.topbar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:var(--sp-2);}
.topbar-divider{width:1px;height:24px;background:var(--border-subtle);margin:0 var(--sp-2);}

/* MAIN */
.main{grid-area:main;padding:var(--sp-6);overflow-y:auto;overflow-x:hidden;
  min-height:calc(100vh - var(--topbar-h));}
.page-header{margin-bottom:var(--sp-6);display:flex;align-items:flex-start;
  gap:var(--sp-4);flex-wrap:wrap;}
.page-header-text{flex:1;min-width:200px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.5px;
  color:var(--text-primary);margin-bottom:var(--sp-1);}
.page-subtitle{font-size:14px;color:var(--text-secondary);}
.page-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;
  gap:var(--sp-2);padding:9px 16px;border-radius:var(--r-md);
  font-weight:600;font-size:13px;transition:all var(--dur-fast);
  white-space:nowrap;border:1.5px solid transparent;user-select:none;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--brand-600);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3);}
.btn-primary:hover:not(:disabled){background:var(--brand-700);
  box-shadow:0 6px 16px rgba(99,102,241,.4);transform:translateY(-1px);}
.btn-outline{background:var(--bg-surface);color:var(--text-primary);
  border-color:var(--border-default);}
.btn-outline:hover:not(:disabled){border-color:var(--brand-500);
  color:var(--brand-600);background:var(--brand-50);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover:not(:disabled){background:var(--bg-subtle);color:var(--text-primary);}
.btn-danger{background:var(--danger-500);color:#fff;}
.btn-danger:hover:not(:disabled){background:var(--danger-600);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:var(--r-sm);}
.btn-icon{padding:8px;width:36px;height:36px;}
.btn-icon.btn-sm{padding:6px;width:30px;height:30px;}

/* =========================================================
   DASHBOARD GRID
   ========================================================= */
.dashboard-grid{display:grid;grid-template-columns:repeat(12,1fr);
  gap:var(--sp-5);margin-bottom:var(--sp-5);}
.widget[data-size="small"]{grid-column:span 3;}
.widget[data-size="medium"]{grid-column:span 4;}
.widget[data-size="large"]{grid-column:span 6;}
.widget[data-size="wide"]{grid-column:span 8;}
.widget[data-size="full"]{grid-column:span 12;}
@media (max-width:1400px){
  .widget[data-size="small"]{grid-column:span 4;}
  .widget[data-size="medium"]{grid-column:span 6;}
  .widget[data-size="large"],.widget[data-size="wide"]{grid-column:span 12;}
}
@media (max-width:900px){
  .widget[data-size]{grid-column:span 12;}
  .main{padding:var(--sp-4);}
  .topbar{padding:0 var(--sp-4);}
}

/* =========================================================
   WIDGET CARD
   ========================================================= */
.widget{background:var(--bg-surface);border:1px solid var(--border-subtle);
  border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--shadow-sm);
  transition:all var(--dur-base) var(--ease-out);position:relative;
  overflow:hidden;animation:slideUp var(--dur-slow) var(--ease-out) backwards;
  cursor:grab;}
.widget:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);
  border-color:var(--border-default);}
.widget:active{cursor:grabbing;}
.widget.dragging{opacity:.4;cursor:grabbing;transform:scale(.98);}
.widget.drag-over{border-color:var(--brand-500);
  box-shadow:0 0 0 3px rgba(99,102,241,.15);}
.widget-header{display:flex;align-items:center;gap:var(--sp-3);
  margin-bottom:var(--sp-4);}
.widget-title{font-size:12px;font-weight:800;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.8px;flex:1;}
.widget-actions{display:flex;gap:var(--sp-1);opacity:0;
  transition:opacity var(--dur-fast);}
.widget:hover .widget-actions{opacity:1;}
.widget-btn{width:26px;height:26px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);transition:all var(--dur-fast);}
.widget-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
.widget-btn.danger:hover{background:var(--danger-50);color:var(--danger-600);}

/* KPI */
.kpi-value{font-family:var(--font-mono);font-size:32px;font-weight:800;
  color:var(--text-primary);letter-spacing:-1px;line-height:1.1;
  margin-bottom:var(--sp-2);}
.kpi-label{font-size:13px;color:var(--text-secondary);font-weight:500;}
.kpi-trend{display:inline-flex;align-items:center;gap:var(--sp-1);
  font-size:12px;font-weight:700;padding:3px 8px;
  border-radius:var(--r-full);margin-top:var(--sp-3);}
.kpi-trend.up{background:var(--success-50);color:var(--success-700);}
.kpi-trend.down{background:var(--danger-50);color:var(--danger-700);}
.kpi-trend.neutral{background:var(--bg-subtle);color:var(--text-secondary);}

/* Progress Ring */
.progress-ring{display:flex;align-items:center;justify-content:center;
  position:relative;height:160px;}
.progress-ring svg{transform:rotate(-90deg);}
.progress-ring circle{fill:none;stroke-linecap:round;}
.progress-ring .bg{stroke:var(--border-subtle);}
.progress-ring .fg{stroke:url(#ringGradient);
  transition:stroke-dashoffset 1s var(--ease-out);}
.progress-ring-text{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);text-align:center;}
.progress-ring-value{font-family:var(--font-mono);font-size:32px;
  font-weight:800;color:var(--text-primary);line-height:1;}
.progress-ring-label{font-size:11px;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.8px;
  margin-top:var(--sp-1);font-weight:700;}

/* Chart Wrapper */
.chart-wrap{position:relative;height:220px;}
.chart-wrap.tall{height:280px;}

/* Feed */
.feed{max-height:340px;overflow-y:auto;margin:0 calc(var(--sp-5) * -1);}
.feed-item{display:flex;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);
  border-bottom:1px solid var(--border-subtle);
  transition:background var(--dur-fast);}
.feed-item:last-child{border-bottom:none;}
.feed-item:hover{background:var(--bg-subtle);}
.feed-icon{width:32px;height:32px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;background:var(--bg-subtle);}
.feed-icon.success{background:var(--success-50);color:var(--success-700);}
.feed-icon.warning{background:var(--warning-50);color:var(--warning-700);}
.feed-icon.danger{background:var(--danger-50);color:var(--danger-700);}
.feed-icon.info{background:var(--info-50);color:var(--info-600);}
.feed-body{flex:1;min-width:0;}
.feed-title{font-size:13px;font-weight:600;color:var(--text-primary);
  margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.feed-meta{font-size:11.5px;color:var(--text-tertiary);}

/* Alerts */
.alert-item{display:flex;gap:var(--sp-3);padding:var(--sp-3);
  border-radius:var(--r-md);margin-bottom:var(--sp-2);
  border-inline-start:3px solid;background:var(--bg-subtle);
  animation:slideUp var(--dur-base) var(--ease-out);}
.alert-item.warning{border-inline-start-color:var(--warning-500);}
.alert-item.danger{border-inline-start-color:var(--danger-500);}
.alert-item.success{border-inline-start-color:var(--success-500);}
.alert-icon{font-size:16px;flex:none;}
.alert-body{flex:1;min-width:0;}
.alert-title{font-size:13px;font-weight:700;color:var(--text-primary);
  margin-bottom:2px;}
.alert-desc{font-size:12px;color:var(--text-secondary);}

/* DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:var(--bg-overlay);
  backdrop-filter:blur(4px);z-index:800;opacity:0;pointer-events:none;
  transition:opacity var(--dur-base) var(--ease-out);}
.drawer-backdrop.show{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;
  width:min(440px,100vw);background:var(--bg-elevated);z-index:801;
  box-shadow:var(--shadow-2xl);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform var(--dur-base) var(--ease-out);}
[dir="rtl"] .drawer{transform:translateX(-100%);}
.drawer.open{transform:translateX(0) !important;}
.drawer-header{padding:var(--sp-5) var(--sp-6);
  border-bottom:1px solid var(--border-subtle);
  display:flex;align-items:center;gap:var(--sp-3);}
.drawer-title{flex:1;font-size:16px;font-weight:800;}
.drawer-body{flex:1;overflow-y:auto;padding:var(--sp-5) var(--sp-6);}

.widget-lib-item{display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3);border-radius:var(--r-md);
  border:1px solid var(--border-subtle);margin-bottom:var(--sp-2);
  cursor:pointer;transition:all var(--dur-fast);}
.widget-lib-item:hover{border-color:var(--brand-500);
  background:var(--brand-50);transform:translateX(4px);}
[dir="rtl"] .widget-lib-item:hover{transform:translateX(-4px);}
.widget-lib-icon{width:36px;height:36px;border-radius:var(--r-md);
  background:var(--grad-brand);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:16px;flex:none;}
.widget-lib-body{flex:1;min-width:0;}
.widget-lib-title{font-size:13.5px;font-weight:700;
  color:var(--text-primary);}
.widget-lib-desc{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
.widget-lib-badge{font-size:10.5px;font-weight:800;padding:3px 8px;
  border-radius:var(--r-full);background:var(--bg-subtle);
  color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;}
.widget-lib-badge.added{background:var(--success-50);color:var(--success-700);}

/* Toast */
.toast-container{position:fixed;bottom:var(--sp-6);inset-inline-end:var(--sp-6);
  z-index:1000;display:flex;flex-direction:column;gap:var(--sp-3);
  max-width:420px;pointer-events:none;}
.toast{background:var(--bg-elevated);border:1px solid var(--border-subtle);
  border-radius:var(--r-md);box-shadow:var(--shadow-xl);padding:var(--sp-4);
  display:flex;gap:var(--sp-3);border-inline-start:4px solid var(--brand-500);
  pointer-events:auto;animation:bounceIn var(--dur-base) var(--ease-spring);
  min-width:300px;position:relative;}
.toast.success{border-inline-start-color:var(--success-500);}
.toast.error{border-inline-start-color:var(--danger-500);}
.toast.warning{border-inline-start-color:var(--warning-500);}
.toast.removing{animation:fadeOut var(--dur-fast) var(--ease-out) forwards;}
.toast-icon{width:24px;height:24px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex:none;background:var(--bg-subtle);}
.toast.success .toast-icon{background:var(--success-50);color:var(--success-600);}
.toast.error .toast-icon{background:var(--danger-50);color:var(--danger-600);}
.toast.warning .toast-icon{background:var(--warning-50);color:var(--warning-600);}
.toast.info .toast-icon{background:var(--info-50);color:var(--info-600);}
.toast-body{flex:1;min-width:0;}
.toast-title{font-size:13.5px;font-weight:700;margin-bottom:2px;}
.toast-msg{font-size:12.5px;color:var(--text-secondary);line-height:1.4;}
.toast-close{width:20px;height:20px;border-radius:var(--r-xs);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);font-size:14px;flex:none;}
.toast-close:hover{background:var(--bg-subtle);color:var(--text-primary);}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--bg-subtle) 0%,
  var(--border-subtle) 50%,var(--bg-subtle) 100%);
  background-size:1000px 100%;animation:shimmer 2s infinite linear;
  border-radius:var(--r-md);height:20px;margin-bottom:8px;}
.skeleton.w-75{width:75%;}
.skeleton.w-50{width:50%;}
.skeleton.w-30{width:30%;}
.skeleton-lg{height:60px;}

/* Empty */
.empty-state{padding:var(--sp-10) var(--sp-5);text-align:center;}
.empty-icon{width:64px;height:64px;margin:0 auto var(--sp-4);
  border-radius:var(--r-xl);background:var(--bg-subtle);
  display:flex;align-items:center;justify-content:center;font-size:28px;}
.empty-title{font-size:15px;font-weight:700;margin-bottom:var(--sp-1);}
.empty-desc{font-size:13px;color:var(--text-secondary);}

/* Placeholder */
.placeholder-card{background:var(--bg-surface);
  border:2px dashed var(--border-default);border-radius:var(--r-xl);
  padding:var(--sp-12) var(--sp-6);text-align:center;}
.placeholder-card .icon{font-size:64px;margin-bottom:var(--sp-5);opacity:.4;}
.placeholder-card h2{font-size:20px;font-weight:800;
  color:var(--text-primary);margin-bottom:var(--sp-3);}
.placeholder-card p{font-size:14px;color:var(--text-secondary);
  max-width:520px;margin:0 auto var(--sp-5);line-height:1.7;}
.coming-soon{display:inline-block;padding:8px 16px;
  border-radius:var(--r-full);background:var(--brand-50);
  color:var(--brand-700);font-size:12.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;}

@media (max-width:960px){
  .main{padding:var(--sp-4);}
  .topbar{padding:0 var(--sp-4);gap:var(--sp-2);}
  .topbar-search{display:none;}
  .toast-container{left:var(--sp-4);right:var(--sp-4);bottom:var(--sp-4);}
  .toast{min-width:0;}
  .page-title{font-size:20px;}
}
</style>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  version: '3.0.0',
  supabaseUrl: "https://bagbnoupsnsltflgwpic.supabase.co",
  supabaseKey: "sb_publishable_jyov6Yn5ulwm3fj3lIs9yw_IDZVhYMd"
};
const STORAGE = {
  theme: 'mfc_theme_v3',
  rtl: 'mfc_rtl_v3',
  sidebar: 'mfc_sidebar_collapsed_v3',
  layout: 'mfc_dashboard_layout_v3'
};

/* =========================================================
   SUPABASE
   ========================================================= */
let db = null;
try {
  if (typeof supabase !== 'undefined' && supabase.createClient) {
    db = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    console.log('%c✅ Supabase ready', 'color:#10b981;font-weight:bold');
  }
} catch(e){ console.error('Supabase init failed:', e); }

/* =========================================================
   STATE
   ========================================================= */
const State = {
  currentPage: 'dashboard',
  sites: [],
  loading: false,
  theme: 'light',
  rtl: false,
  sidebarCollapsed: false,
  draggedWidgetId: null,
  charts: {}
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, c=document)=> c.querySelector(s);
const $$ = (s, c=document)=> Array.from(c.querySelectorAll(s));

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmt(n){
  if (isNaN(n) || n == null) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (abs >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (abs >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString();
}
function debounce(fn, ms=300){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=> fn(...args), ms); };
}

/* =========================================================
   TOAST
   ========================================================= */
function toast({type='info', title='', message='', duration=3500} = {}){
  const container = $('#toastContainer');
  const icons = { success:'✓', error:'!', warning:'⚠', info:'i' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <div class="toast-icon">${icons[type] || 'i'}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ''}
    </div>
    <button class="toast-close">✕</button>
  `;
  el.querySelector('.toast-close').onclick = ()=> removeToast(el);
  container.appendChild(el);
  if (duration > 0) setTimeout(()=> removeToast(el), duration);
}
function removeToast(el){
  if (!el.parentNode) return;
  el.classList.add('removing');
  setTimeout(()=> el.remove(), 200);
}

/* =========================================================
   THEME / RTL / SIDEBAR
   ========================================================= */
function initTheme(){
  const saved = localStorage.getItem(STORAGE.theme);
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  State.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon();
}
function toggleTheme(){
  const themes = ['light', 'dark', 'midnight', 'sepia'];
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = themes[(themes.indexOf(cur) + 1) % themes.length];
  State.theme = next;
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(STORAGE.theme, next);
  updateThemeIcon();
  if (State.currentPage === 'dashboard') renderDashboard();
}
function updateThemeIcon(){
  const btn = $('#themeToggle');
  if (!btn) return;
  const cur = document.documentElement.getAttribute('data-theme');
  btn.innerHTML = (cur === 'dark' || cur === 'midnight')
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
}
function initRTL(){
  const saved = localStorage.getItem(STORAGE.rtl);
  const rtl = saved === '1';
  State.rtl = rtl;
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', rtl ? 'ar' : 'en');
}
function toggleRTL(){
  const rtl = !State.rtl;
  State.rtl = rtl;
  document.documentElement.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', rtl ? 'ar' : 'en');
  localStorage.setItem(STORAGE.rtl, rtl ? '1' : '0');
  if (State.currentPage === 'dashboard') renderDashboard();
}
function initSidebar(){
  const collapsed = localStorage.getItem(STORAGE.sidebar) === '1';
  State.sidebarCollapsed = collapsed;
  if (collapsed) $('#app').classList.add('sidebar-collapsed');
}
function toggleSidebar(){
  const app = $('#app');
  const collapsed = app.classList.toggle('sidebar-collapsed');
  State.sidebarCollapsed = collapsed;
  localStorage.setItem(STORAGE.sidebar, collapsed ? '1' : '0');
}

/* =========================================================
   DATA HELPERS
   ========================================================= */
function getStats(){
  const s = State.sites;
  const total = s.length;
  const done = s.filter(r => (r.states||'').toLowerCase() === 'done').length;
  const totalSubcon = s.reduce((sum, r) => sum + (parseFloat(r.amount_to_subcon)||0), 0);
  const totalPaid = s.reduce((sum, r) => sum + (parseFloat(r.amount_paid)||0), 0);
  const totalNokia = s.reduce((sum, r) => sum + (parseFloat(r.nokia_amount)||0), 0);
  const totalSMR = s.reduce((sum, r) => sum + (parseFloat(r.smr_value)||0), 0);
  const balance = totalSubcon - totalPaid;
  const donePct = total ? Math.round(done / total * 100) : 0;
  const govCount = new Set(s.map(r => r.gov).filter(Boolean)).size;
  const teamCount = new Set(s.map(r => r.team).filter(Boolean)).size;
  const noTeam = s.filter(r => !r.team).length;
  const overdue = s.filter(r => (r.states||'').toLowerCase() !== 'done').length;
  return { total, done, donePct, totalSubcon, totalPaid, totalNokia, totalSMR, balance, govCount, teamCount, noTeam, overdue };
}

/* =========================================================
   WIDGET DEFINITIONS
   ========================================================= */
const WIDGET_TYPES = {
  kpi_total:    { name:'Total Sites',         desc:'Total count of all sites',       icon:'📍', size:'small',  render: renderKpiTotal },
  kpi_done:     { name:'Completion Rate',     desc:'Percentage of completed sites',  icon:'✅', size:'small',  render: renderKpiDone },
  kpi_finance:  { name:'Total Investment',    desc:'Total subcon amount',            icon:'💰', size:'small',  render: renderKpiFinance },
  kpi_balance:  { name:'Outstanding Balance', desc:'Amount pending payment',         icon:'⏳', size:'small',  render: renderKpiBalance },
  ring_progress:{ name:'Overall Progress',    desc:'Project completion ring',        icon:'🎯', size:'small',  render: renderProgressRing },
  chart_status: { name:'Status Distribution', desc:'Sites by status (doughnut)',     icon:'🥧', size:'medium', render: renderChartStatus },
  chart_gov:    { name:'By Governorate',      desc:'Sites distribution by region',   icon:'🗺️', size:'medium', render: renderChartGov },
  chart_teams:  { name:'Team Performance',    desc:'Done vs Total per team',         icon:'👥', size:'medium', render: renderChartTeams },
  chart_monthly:{ name:'Monthly Trend',       desc:'Sites over time',                icon:'📈', size:'large',  render: renderChartMonthly },
  chart_finance:{ name:'Financial Overview',  desc:'Subcon, Paid, SMR, Nokia',       icon:'💵', size:'medium', render: renderChartFinance },
  chart_payment:{ name:'Payment Progress',    desc:'Paid vs remaining',              icon:'💳', size:'medium', render: renderChartPayment },
  feed_activity:{ name:'Recent Activity',     desc:'Latest site updates',            icon:'⚡', size:'medium', render: renderActivityFeed },
  alerts_panel: { name:'Smart Alerts',        desc:'Attention needed items',         icon:'🔔', size:'medium', render: renderAlertsPanel },
  table_top:    { name:'Top 5 Sites',         desc:'Highest value sites',            icon:'🏆', size:'medium', render: renderTopSites },
  table_overdue:{ name:'Overdue Sites',       desc:'Not done yet',                   icon:'⚠️', size:'medium', render: renderOverdueSites }
};

const DEFAULT_LAYOUT = [
  { id:'w1', type:'kpi_total', size:'small' },
  { id:'w2', type:'kpi_done', size:'small' },
  { id:'w3', type:'kpi_finance', size:'small' },
  { id:'w4', type:'kpi_balance', size:'small' },
  { id:'w5', type:'ring_progress', size:'small' },
  { id:'w6', type:'chart_status', size:'small' },
  { id:'w7', type:'chart_gov', size:'medium' },
  { id:'w8', type:'chart_monthly', size:'large' },
  { id:'w9', type:'chart_teams', size:'medium' },
  { id:'w10', type:'chart_finance', size:'medium' },
  { id:'w11', type:'feed_activity', size:'medium' },
  { id:'w12', type:'alerts_panel', size:'medium' }
];

let currentLayout = [];

function loadLayout(){
  try {
    const saved = localStorage.getItem(STORAGE.layout);
    currentLayout = saved ? JSON.parse(saved) : [...DEFAULT_LAYOUT];
  } catch(e){ currentLayout = [...DEFAULT_LAYOUT]; }
}
function saveLayout(){
  try { localStorage.setItem(STORAGE.layout, JSON.stringify(currentLayout)); } catch(e){}
}

/* =========================================================
   WIDGET RENDERERS
   ========================================================= */
function widgetWrapper(w, title, inner){
  return `
    <div class="widget-header">

   DASHBOARD RENDERING
   ========================================================= */
function renderDashboard(){
  const content = $('#pageContent');
  content.innerHTML = `
    <div class="dashboard-grid" id="dashboardGrid"></div>
  `;
  const grid = $('#dashboardGrid');

  if (State.loading) {
    for (let i = 0; i < 8; i++) {
      const sk = document.createElement('div');
      sk.className = 'widget';
      sk.dataset.size = 'small';
      sk.innerHTML = `
        <div class="skeleton w-30"></div>
        <div class="skeleton skeleton-lg" style="margin-top:12px;"></div>
        <div class="skeleton w-75"></div>
        <div class="skeleton w-50"></div>
      `;
      grid.appendChild(sk);
    }
    return;
  }

  currentLayout.forEach((item, idx) => {
    const def = WIDGET_TYPES[item.type];
    if (!def) return;
    const w = document.createElement('div');
    w.className = 'widget';
    w.dataset.id = item.id;
    w.dataset.type = item.type;
    w.dataset.size = item.size || def.size || 'medium';
    w.draggable = true;
    w.style.animationDelay = `${idx * 40}ms`;
    def.render(w);
    attachWidgetEvents(w, item);
    grid.appendChild(w);
  });

  renderPageActions();
}

function attachWidgetEvents(w, item){
  w.querySelectorAll('[data-act="remove"]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (!confirm('Remove this widget?')) return;
      currentLayout = currentLayout.filter(x => x.id !== item.id);
      saveLayout();
      renderDashboard();
      renderWidgetLibrary();
      toast({type:'info', title:'Widget removed', duration:2000});
    };
  });

  w.addEventListener('dragstart', (e) => {
    State.draggedWidgetId = item.id;
    w.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  w.addEventListener('dragend', () => {
    w.classList.remove('dragging');
    $$('.widget.drag-over').forEach(el => el.classList.remove('drag-over'));
    State.draggedWidgetId = null;
  });
  w.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (State.draggedWidgetId && State.draggedWidgetId !== item.id) {
      w.classList.add('drag-over');
    }
  });
  w.addEventListener('dragleave', () => w.classList.remove('drag-over'));
  w.addEventListener('drop', (e) => {
    e.preventDefault();
    w.classList.remove('drag-over');
    if (!State.draggedWidgetId || State.draggedWidgetId === item.id) return;
    const fromIdx = currentLayout.findIndex(x => x.id === State.draggedWidgetId);
    const toIdx = currentLayout.findIndex(x => x.id === item.id);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = currentLayout.splice(fromIdx, 1);
    currentLayout.splice(toIdx, 0, moved);
    saveLayout();
    renderDashboard();
  });
}

function renderPageActions(){
  const actions = $('#pageActions');
  if (State.currentPage !== 'dashboard') { actions.innerHTML = ''; return; }
  actions.innerHTML = `
    <button class="btn btn-outline btn-sm" id="resetLayoutBtn">↺ Reset</button>
    <button class="btn btn-outline btn-sm" id="exportLayoutBtn">💾 Export</button>
    <button class="btn btn-primary btn-sm" id="addWidgetBtn">+ Add Widget</button>
  `;
  $('#resetLayoutBtn').onclick = () => {
    if (!confirm('Reset dashboard to default?')) return;
    currentLayout = [...DEFAULT_LAYOUT];
    saveLayout();
    renderDashboard();
    toast({type:'success', title:'Layout reset'});
  };
  $('#exportLayoutBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(currentLayout, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mfc_layout_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast({type:'success', title:'Layout exported'});
  };
  $('#addWidgetBtn').onclick = openWidgetLibrary;
}

function openWidgetLibrary(){
  const backdrop = $('#drawerBackdrop');
  backdrop.innerHTML = `
    <div class="drawer open">
      <div class="drawer-header">
        <div class="drawer-title">📦 Widget Library</div>

      </div>
      <div class="drawer-body" id="widgetLibBody"></div>
    </div>
  `;
  backdrop.classList.add('show');
  renderWidgetLibrary();
  $('#closeDrawerBtn').onclick = closeDrawer;
  backdrop.onclick = (e) => { if (e.target === backdrop) closeDrawer(); };
}

function closeDrawer(){
  const backdrop = $('#drawerBackdrop');
  const drawer = backdrop.querySelector('.drawer');
  if (drawer) drawer.classList.remove('open');
  backdrop.classList.remove('show');
  setTimeout(() => backdrop.innerHTML = '', 300);
}

function renderWidgetLibrary(){
  const body = $('#widgetLibBody');
  if (!body) return;
  const existingTypes = new Set(currentLayout.map(w => w.type));
  body.innerHTML = Object.entries(WIDGET_TYPES).map(([type, def]) => {
    const added = existingTypes.has(type);
    return `
      <div class="widget-lib-item" data-type="${type}">
        <div class="widget-lib-icon">${def.icon}</div>
        <div class="widget-lib-body">
          <div class="widget-lib-title">${escapeHtml(def.name)}</div>
          <div class="widget-lib-desc">${escapeHtml(def.desc)}</div>
        </div>
        <div class="widget-lib-badge ${added ? 'added' : ''}">${added ? 'Added' : 'Add'}</div>
      </div>
    `;
  }).join('');
  body.querySelectorAll('.widget-lib-item').forEach(el => {
    el.onclick = () => {
      const type = el.dataset.type;
      const id = 'w_' + type + '_' + Date.now();
      currentLayout.push({ id, type, size: WIDGET_TYPES[type].size });
      saveLayout();
      renderDashboard();
      renderWidgetLibrary();
      toast({type:'success', title:'Widget added', message:WIDGET_TYPES[type].name, duration:2000});
    };
  });
}

/* =========================================================
   LOAD DATA
   ========================================================= */
async function loadSites(){
  if (!db) {
    State.sites = [];
    State.loading = false;
    toast({type:'warning', title:'Offline', message:'Supabase not available'});
    return;
  }
  State.loading = true;
  try {
    const { data, error } = await db.from('sites').select('*').order('id');
    if (error) throw error;
    State.sites = data || [];
    const badge = $('#sitesCount');
    if (badge) badge.textContent = State.sites.length;
    console.log('%c📊 Loaded ' + State.sites.length + ' sites', 'color:#6366f1');
  } catch(e){
    console.error('Load failed:', e);
    toast({type:'error', title:'Load failed', message:e.message});
    State.sites = [];
  } finally {
    State.loading = false;
    if (State.currentPage === 'dashboard') renderDashboard();
  }
}

  const info = PAGE_INFO[page] || { title:page, subtitle:'' };
  $('#pageTitle').textContent = info.title;
  $('#pageSubtitle').textContent = info.subtitle;
  $('#pageContent').innerHTML = '';
  if (page === 'dashboard') renderDashboard();
  else if (page === 'settings') renderSettings();
  else renderPlaceholder(info);
  if (window.innerWidth <= 960) $('#sidebar').classList.remove('open');
}

function renderPlaceholder(info){
  $('#pageContent').innerHTML = `
    <div class="placeholder-card">
      <div class="icon">${info.icon || '📄'}</div>
      <h2>${escapeHtml(info.title)}</h2>
      <p>هذا القسم سيتم بناؤه في الأجزاء القادمة.</p>
      <div class="coming-soon">Coming Soon</div>
    </div>
  `;
}

function renderSettings(){
  $('#pageContent').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">
      <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px;">
        <h3 style="margin-bottom:16px;font-size:15px;font-weight:800;">🎨 Appearance</h3>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
          ${['light','dark','midnight','sepia'].map(t => `
            <button class="btn btn-outline btn-sm" onclick="window.setTheme('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>
          `).join('')}
        </div>
      </div>
      <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px;">
        <h3 style="margin-bottom:16px;font-size:15px;font-weight:800;">🌐 Language</h3>
        <button class="btn btn-outline" onclick="window.toggleRTL()">Toggle RTL</button>
      </div>
      <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:20px;">
        <h3 style="margin-bottom:16px;font-size:15px;font-weight:800;">ℹ️ About</h3>
        <p style="font-size:13px;color:var(--text-secondary);line-height:1.7;">
          <strong>MFC Command Center</strong><br>
          Version: ${CONFIG.version}<br>
          Phase: 2 of 9 (Dashboard Pro)
        </p>
      </div>
    </div>
  `;
}

window.setTheme = (t) => {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(STORAGE.theme, t);
  updateThemeIcon();
  toast({type:'success', title:'Theme updated'});
};
window.toggleRTL = toggleRTL;

/* =========================================================
   INIT
   ========================================================= */
function bindEvents(){
  $$('.nav-item').forEach(i => i.onclick = () => goToPage(i.dataset.page));
  $('#sidebarCollapse').onclick = toggleSidebar;
  const mm = $('#mobileMenu');
  mm.onclick = () => $('#sidebar').classList.toggle('open');
  const upd = () => mm.style.display = window.innerWidth <= 960 ? 'flex' : 'none';
  window.addEventListener('resize', upd);
  upd();
  $('#themeToggle').onclick = toggleTheme;
  $('#rtlToggle').onclick = toggleRTL;
  $('#widgetLibBtn').onclick = openWidgetLibrary;
  $('#refreshBtn').onclick = () => {
    toast({type:'info', title:'Refreshing...', duration:1500});
    loadSites();
  };
  $('#settingsBtn').onclick = () => goToPage('settings');
  $('#globalSearch').addEventListener('input', debounce(e => console.log('Search:', e.target.value), 250));
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'b') { e.preventDefault(); toggleSidebar(); }
    if ((e.metaKey || e.ctrlKey) && e.key === '/') { e.preventDefault(); toggleTheme(); }
    if (e.key === 'Escape') closeDrawer();
  });
}

async function init(){
  console.log('%c🚀 MFC Command Center v' + CONFIG.version, 'color:#6366f1;font-weight:bold;font-size:14px');
  initTheme();
  initRTL();
  initSidebar();
  bindEvents();
  loadLayout();
  await loadSites();
  goToPage('dashboard');
  setTimeout(() => toast({type:'success', title:'Welcome', message:'Dashboard loaded', duration:3000}), 400);
  console.log('%c✅ Ready — Phase 2 Complete', 'color:#10b981;font-weight:bold');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
